<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Inglês do Zeu">
<meta name="application-name" content="Inglês do Zeu">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=3">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3">
<title>Inglês do Zeu</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;800&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Public+Sans:wght@300..700&family=JetBrains+Mono:wght@400;600&display=swap');

:root{
  --ground:#E4E9E2; --card:#F4F7F2; --ink:#10211C; --ink-soft:#51635C;
  --line:#C4CDC1; --signal:#1B3CF5; --chalk:#EDDE3F; --alert:#D8342A;
  --font-display:'Bricolage Grotesque','Arial Black',system-ui,sans-serif;
  --font-body:'Public Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
a{color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:0 20px 120px}

/* MARCA */
.brand{display:flex;align-items:center;gap:14px;padding:30px 0 0}
.brand__mark{flex:0 0 auto;width:52px;height:52px}
.brand__mark svg{width:100%;height:100%;display:block}
.brand__w{font-family:var(--font-display);font-weight:800;font-size:26px;letter-spacing:-.03em;line-height:1}
.brand__w em{font-style:normal;color:var(--signal)}
.brand__tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin-top:3px}

.top{padding:24px 0 20px;border-bottom:2px solid var(--ink)}
.top__title{font-family:var(--font-display);font-weight:800;font-size:clamp(34px,7.8vw,64px);line-height:.92;letter-spacing:-.03em;margin:0;font-stretch:105%}
.top__title em{font-style:normal;color:var(--signal)}
.top__sub{margin:14px 0 0;max-width:54ch;color:var(--ink-soft);font-size:15px}
.stats{display:flex;gap:26px;margin-top:22px;flex-wrap:wrap}
.stat__n{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1}
.stat__l{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}

/* seletor de logo */
.logopick{border:2px solid var(--ink);background:var(--card);padding:20px;margin:22px 0 0}
.logopick__l{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 4px}
.logopick__t{font-family:var(--font-display);font-weight:600;font-size:20px;margin:0 0 14px;letter-spacing:-.01em}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.opt{border:2px solid var(--line);background:var(--ground);padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:10px}
.opt:hover{border-color:var(--ink)}
.opt[aria-pressed="true"]{border-color:var(--signal);background:var(--card);box-shadow:inset 0 0 0 2px var(--signal)}
.opt__mark{width:46px;height:46px}
.opt__mark svg{width:100%;height:100%;display:block}
.opt__n{font-weight:700;font-size:14px}
.opt__d{font-size:12.5px;color:var(--ink-soft);line-height:1.4}

/* campos */
.compose{margin:26px 0 8px;position:relative}
.compose__row{display:flex;gap:8px;flex-wrap:wrap}
.field{flex:1 1 240px;min-width:0;background:var(--card);border:2px solid var(--ink);padding:14px 16px;font-family:var(--font-body);font-size:17px;color:var(--ink)}
.field::placeholder{color:#93a29a}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--ground);padding:14px 22px;font-weight:600;font-size:15px;white-space:nowrap;transition:background .12s ease}
.btn:hover{background:var(--signal);border-color:var(--signal)}
.btn--ghost{background:transparent;color:var(--ink)}
.btn--ghost:hover{background:var(--ink);color:var(--ground)}
.compose__hint{font-size:13px;color:var(--ink-soft);margin:10px 2px 0}
.sugg{border:2px solid var(--signal);background:var(--card);margin-top:6px}
.sugg__l{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--signal);padding:9px 14px 4px;margin:0}
.sugg button{display:block;width:100%;text-align:left;padding:9px 14px;border-top:1px solid var(--line)}
.sugg button:hover{background:var(--ink);color:var(--card)}
.sugg__en{font-size:16px;font-weight:600}
.sugg__pt{font-size:13px;opacity:.7}

.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:24px 0 6px;padding-top:18px;border-top:1px solid var(--line)}
.seg{display:flex;border:2px solid var(--ink);flex-wrap:wrap}
.seg button{padding:8px 14px;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.bar__spacer{flex:1}

/* cartão */
.list{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.card{background:var(--card);border:2px solid var(--ink);padding:20px 20px 16px;position:relative}
.card--known{opacity:.6}.card--known:hover{opacity:1}
.card__source{font-size:14px;color:var(--ink-soft);margin:0 44px 6px 0}
.card__source b{font-weight:600;color:var(--ink)}
.card__text{font-family:var(--font-display);font-weight:600;font-size:clamp(21px,4.4vw,30px);line-height:1.3;letter-spacing:-.02em;margin:0 44px 0 0;word-break:break-word}
.card__note{margin:8px 0 0;font-size:14px;color:var(--ink-soft)}
.card__x{position:absolute;top:12px;right:12px;width:30px;height:30px;font-size:18px;line-height:1;color:var(--ink-soft);border-radius:50%}
.card__x:hover{background:var(--ink);color:var(--ground)}

.mark{background:rgba(216,52,42,.12);color:inherit;box-shadow:inset 0 -4px 0 var(--alert);padding:0 1px;cursor:help;border-radius:1px}
.trips{margin:14px 0 0;display:flex;flex-direction:column;gap:8px}
.trip{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.trip__k{flex:0 0 auto;font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;background:var(--alert);color:#fff;padding:3px 7px;margin-top:2px;white-space:nowrap}
.trip__b b{color:var(--alert);font-weight:600}
.trip__b span{color:var(--ink-soft)}

.beats{display:flex;align-items:flex-end;gap:5px;margin:16px 0 0;min-height:34px;flex-wrap:wrap}
.beat{position:relative;border-radius:1px;transition:background .15s ease}
.beat--strong{background:var(--ink);height:26px}
.beat--weak{background:var(--line);height:11px}
.beat--on{background:var(--signal)}
.beat--on.beat--weak{opacity:.6}
.beat__stress{position:absolute;left:0;right:0;top:-7px;height:4px;background:var(--chalk)}
.beats__legend{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin:7px 0 0}
.tips{margin:12px 0 0;padding:0 0 0 18px;font-size:14px;color:var(--ink-soft)}
.ctx{font-size:14px;color:var(--ink-soft);margin:10px 0 0;font-style:italic}

.acts{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line)}
.acts--bare{border:0;padding:0;margin:0}
.act{border:1.5px solid var(--line);padding:7px 12px;font-size:13px;font-weight:600;background:var(--card);display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.act:hover{border-color:var(--ink);background:var(--ink);color:var(--card)}
.act--main{border-color:var(--ink);background:var(--ink);color:var(--card)}
.act--main:hover{background:var(--signal);border-color:var(--signal)}
.act__k{font-family:var(--font-mono);font-size:10px;opacity:.6;font-weight:400}

.block{margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line)}
.block__l{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.block__l .core{color:var(--signal);letter-spacing:.02em;text-transform:none;font-size:11px}
.row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dotted var(--line)}
.row:last-child{border-bottom:0}
.row__play{flex:0 0 auto;border:1.5px solid var(--line);width:30px;height:30px;display:grid;place-items:center;font-size:12px;background:var(--card)}
.row__play:hover{background:var(--ink);color:var(--card);border-color:var(--ink)}
.row__body{flex:1;min-width:0}
.row__en{font-size:16px;margin:0;line-height:1.35}
.row__pt{font-size:13px;color:var(--ink-soft);margin:2px 0 0}
.row__side{flex:0 0 auto;display:flex;gap:5px;align-items:center}
.mini{border:1.5px solid var(--line);padding:4px 8px;font-size:11px;font-family:var(--font-mono);text-decoration:none;background:var(--card)}
.mini:hover{background:var(--ink);color:var(--card);border-color:var(--ink)}
.mini--on{background:var(--signal);border-color:var(--signal);color:#fff}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.chips__l{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);width:100%;margin:12px 0 2px}
.chip{border:1.5px solid var(--line);background:var(--card);padding:6px 11px;font-size:13px;border-radius:100px}
.chip:hover{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.kit{background:var(--card);border:2px solid var(--ink);padding:26px 22px 20px;margin-top:20px}
.kit__title{font-family:var(--font-display);font-weight:700;font-size:clamp(24px,5.5vw,36px);line-height:1.05;letter-spacing:-.025em;margin:0}
.kit__brief{margin:12px 0 0;font-size:15px;color:var(--ink-soft);max-width:60ch;border-left:3px solid var(--chalk);padding-left:14px}
.stage{margin:26px 0 0}
.stage__h{display:flex;gap:11px;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:7px;margin-bottom:4px}
.stage__n{font-family:var(--font-mono);font-size:12px;color:var(--signal);font-weight:600}
.stage__t{font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:-.01em}
.hear{margin:28px 0 0;background:rgba(27,60,245,.06);border-left:3px solid var(--signal);padding:16px 18px}
.hear__l{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--signal);margin:0 0 4px}
.hear__d{font-size:13px;color:var(--ink-soft);margin:0 0 8px}
.hear .row{border-bottom-color:rgba(27,60,245,.18)}
.kit__foot{margin:24px 0 0;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}

/* histórico */
.hist{background:var(--card);border:2px solid var(--ink);padding:24px 22px;margin-top:18px}
.hist__t{font-family:var(--font-display);font-weight:700;font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
.hist__d{font-size:14px;color:var(--ink-soft);margin:0 0 18px}
.days{display:flex;align-items:flex-end;gap:3px;height:70px;border-bottom:2px solid var(--ink);padding-bottom:0}
.day{flex:1;background:var(--line);min-height:3px;position:relative}
.day--hot{background:var(--signal)}
.day--top{background:var(--ink)}
.days__ax{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10px;color:var(--ink-soft);margin-top:6px;letter-spacing:.1em;text-transform:uppercase}
.hist__grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:26px;margin-top:26px}
.hist__h{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px}
.rank{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px dotted var(--line);font-size:15px}
.rank__n{font-family:var(--font-mono);font-size:12px;color:var(--signal);flex:0 0 auto}
.rank__c{margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);flex:0 0 auto}

.empty{border:2px dashed var(--line);padding:34px 24px;text-align:center;margin-top:20px}
.empty h2{font-family:var(--font-display);font-size:24px;margin:0 0 8px;letter-spacing:-.02em}
.empty p{color:var(--ink-soft);margin:0 auto 18px;max-width:48ch;font-size:15px}

.train{background:var(--ink);color:var(--ground);margin-top:18px;padding:32px 24px 26px}
.train .card__text{font-size:clamp(24px,5.6vw,38px);margin-right:0;text-align:center}
.train .card__source{text-align:center;margin-right:0;color:#9fb0a8}
.train .card__source b{color:var(--ground)}
.train .mark{background:rgba(216,52,42,.32);box-shadow:inset 0 -4px 0 #FF6B60}
.train .trip__b span{color:#9fb0a8}
.train .beat--strong{background:var(--chalk)}
.train .beat--weak{background:#3c4f48}
.train .beat--on{background:var(--card)}
.train .beat__stress{background:var(--card)}
.train .beats{justify-content:center}
.train .beats__legend,.train .ctx,.train .tips,.train .block__l,.train .row__pt,.train .card__note{color:#9fb0a8}
.train .acts,.train .block,.train .row{border-color:#2b3d37}
.train .acts{justify-content:center}
.train .act,.train .mini,.train .row__play{background:transparent;border-color:#3c4f48;color:var(--ground)}
.train .act:hover,.train .mini:hover,.train .row__play:hover{background:var(--ground);color:var(--ink);border-color:var(--ground)}
.train .act--main{background:var(--ground);color:var(--ink);border-color:var(--ground)}
.train__pos{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7d918a;text-align:center;margin:0 0 20px}
.train__nav{display:flex;gap:8px;justify-content:center;margin-top:20px}

.vid{margin:14px 0 0;border:2px solid var(--ink);background:var(--ground)}
.vid__bar{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:9px 11px;border-bottom:2px solid var(--ink);font-family:var(--font-mono);font-size:11px;letter-spacing:.04em}
.vid__l{display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--signal);animation:blink 1s ease-in-out infinite;flex:0 0 auto}
@keyframes blink{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.auto{padding:11px 12px;border-bottom:1px solid var(--line);background:rgba(27,60,245,.05)}
.auto__row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.auto__l{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-left:6px}
.chip--sm{padding:4px 9px;font-size:12px;font-family:var(--font-mono)}
.auto__st{font-family:var(--font-mono);font-size:11px;color:var(--signal);margin:9px 0 0;letter-spacing:.04em}
.handoff{padding:26px 20px;text-align:center;border-top:2px solid var(--ink);background:var(--ground)}
.handoff__t{font-family:var(--font-display);font-weight:600;font-size:19px;margin:0 0 8px;letter-spacing:-.01em}
.handoff__d{font-size:14px;color:var(--ink-soft);margin:0 auto 16px;max-width:52ch}
.vid__box{min-height:260px;background:var(--card);display:block}
.vid__box iframe{width:100%!important;border:0;display:block}
.vid__fail{padding:34px 22px;text-align:center}
.vid__failt{font-family:var(--font-display);font-weight:600;font-size:19px;margin:0 0 8px;letter-spacing:-.01em}
.vid__faild{font-size:14px;color:var(--ink-soft);margin:0 auto 16px;max-width:44ch}
.vid__note{font-size:12px;color:var(--ink-soft);padding:9px 11px;margin:0;border-top:1px solid var(--line);line-height:1.45}
.train .vid{border-color:#3c4f48}
.train .vid__bar{border-bottom-color:#3c4f48;color:var(--ground)}
.train .vid__note{color:#9fb0a8;border-top-color:#2b3d37}
.msg{font-size:13px;color:var(--signal);margin:10px 0 0;font-family:var(--font-mono)}
.foot{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-soft);display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.foot button{text-decoration:underline;font-size:13px}

/* ===== MÉTODO DIÁRIO ===== */
.eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 6px}
.today{background:var(--ink);color:var(--ground);padding:26px 22px 20px;margin-top:18px}
.today .eyebrow{color:#9fb0a8}
.today__t{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,6vw,42px);line-height:1.02;letter-spacing:-.03em;margin:0}
.today__t em{font-style:normal;color:var(--chalk)}
.today__d{margin:8px 0 0;color:#9fb0a8;font-size:14px;max-width:62ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;margin:22px 0 0}
.kpi__n{display:block;font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1;letter-spacing:-.02em}
.kpi__n small{font-size:16px;color:#9fb0a8;font-weight:600}
.kpi__l{display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#9fb0a8;margin-top:6px}
.prog{height:8px;background:#2b3d37;margin:20px 0 0;position:relative}
.prog span{position:absolute;left:0;top:0;bottom:0;background:var(--chalk)}
.prog--day{height:5px;margin-top:14px}
.prog--day span{background:#8FA2FF}
.prog__l{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#7d918a;margin-top:6px}
.today__ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid #2b3d37}
.today .seg{border-color:#3c4f48}
.today .seg button[aria-pressed="true"]{background:var(--ground);color:var(--ink)}
.today .act{background:transparent;border-color:#3c4f48;color:var(--ground)}
.today .act:hover{background:var(--ground);color:var(--ink);border-color:var(--ground)}
.notice{margin-top:18px;background:var(--chalk);color:var(--ink);padding:12px 14px;font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.today .notice .act{color:var(--ink);border-color:var(--ink)}

.mis-list{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.mis{background:var(--card);border:2px solid var(--ink);display:grid;grid-template-columns:auto 1fr;scroll-margin-top:12px}
.mis__chk{width:54px;border-right:2px solid var(--ink);font-size:20px;font-weight:700;display:grid;place-items:center;min-height:58px}
.mis__chk:hover{background:var(--ground)}
.mis--done .mis__chk{background:var(--signal);color:#fff}
.mis--done .mis__t{text-decoration:line-through;text-decoration-thickness:2px;color:var(--ink-soft)}
.mis__head{display:flex;align-items:center;gap:6px 14px;padding:12px 16px;text-align:left;flex-wrap:wrap;width:100%}
.mis__head:hover{background:var(--ground)}
.mis__slot{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--signal);width:118px;flex:0 0 auto}
.mis__t{font-family:var(--font-display);font-weight:600;font-size:18px;letter-spacing:-.01em;flex:1 1 170px}
.mis__min{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft)}
.mis__chev{font-family:var(--font-mono);font-size:18px;width:18px;text-align:center}
.mis__body{grid-column:1/-1;border-top:2px solid var(--ink);padding:18px 18px 16px;min-width:0}
.mis__why{margin:0 0 16px;font-size:14px;color:var(--ink-soft);border-left:3px solid var(--chalk);padding-left:12px;max-width:66ch}

.drill{border:2px solid var(--ink);background:var(--ground);padding:20px}
.drill__pos{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 10px}
.drill__ask{font-size:14px;color:var(--ink-soft);margin:0 0 4px}
.drill__q{font-family:var(--font-display);font-weight:600;font-size:clamp(22px,4.6vw,30px);line-height:1.25;letter-spacing:-.02em;margin:0;word-break:break-word}
.drill__a{margin-top:18px;padding-top:16px;border-top:1px dashed var(--ink-soft)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:16px}
.grades--2{grid-template-columns:repeat(2,1fr)}
.grade{border:2px solid var(--ink);padding:11px 6px;font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--card)}
.grade small{font-family:var(--font-mono);font-size:10px;font-weight:400;color:var(--ink-soft)}
.grade:hover{background:var(--ink);color:var(--card)}
.grade:hover small{color:inherit}
.grade--bad{border-color:var(--alert);color:var(--alert)}
.grade--bad:hover{background:var(--alert);color:#fff;border-color:var(--alert)}
.fab__frame{margin:0 0 16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.fab__en{font-family:var(--font-mono);font-size:16px;margin:0;color:var(--signal);font-weight:600}
.fab__pt{font-size:13px;color:var(--ink-soft);margin:2px 0 0}
.fab__tip{font-size:13px;margin:8px 0 0;background:rgba(237,222,63,.45);padding:7px 10px;max-width:64ch}

.sc{margin-top:10px}
.sc:empty{display:none}
.sc__l{font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;color:var(--ink-soft);margin:0}
.sc__v{font-family:var(--font-display);font-weight:700;font-size:19px;margin:0 0 6px}
.sc__w{display:inline-block;padding:1px 6px;margin:2px 3px 2px 0;font-size:15px}
.sc__w--ok{background:rgba(27,60,245,.12);color:var(--signal)}
.sc__w--no{background:rgba(216,52,42,.12);color:var(--alert);text-decoration:line-through}
.sc__said{font-size:15px;margin:4px 0 0}
.act--live{background:var(--alert)!important;border-color:var(--alert)!important;color:#fff!important}
.rec{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.rec audio{height:36px;max-width:100%}
.rec__t{font-family:var(--font-mono);font-size:12px;color:var(--alert)}
.frames{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.frame{border:1.5px dashed var(--ink);padding:6px 10px;font-family:var(--font-mono);font-size:13px;background:var(--card)}
.frame:hover{background:var(--ink);color:var(--card);border-style:solid}
.ex{margin-top:10px;font-size:14px}
.ex summary{cursor:pointer;font-weight:600;font-size:13px}
.ex p{margin:8px 0 0;padding:10px 12px;background:var(--card);border-left:3px solid var(--signal)}
.q{padding:16px 0;border-bottom:1px dotted var(--line)}
.q:last-child{border-bottom:0}
.q__en{font-family:var(--font-display);font-weight:600;font-size:20px;margin:0;letter-spacing:-.01em;display:flex;gap:10px;align-items:center}
.q__pt{font-size:13px;color:var(--ink-soft);margin:4px 0 0 40px}
.steps{margin:0 0 14px;padding-left:20px;font-size:14px;max-width:66ch}
.steps li{margin:4px 0}
.esc--hide .row__en,.esc--hide .row__pt{filter:blur(6px);user-select:none}
.row--on{background:rgba(237,222,63,.45)}

.place .eyebrow{color:var(--signal)}
.cando{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px dotted var(--line);flex-wrap:wrap}
.cando__t{flex:1 1 280px;font-size:15px}
.cando__lv{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:var(--signal);margin-right:8px;text-transform:uppercase}
.yn{display:flex;border:2px solid var(--ink)}
.yn button{padding:6px 14px;font-size:13px;font-weight:600}
.yn button+button{border-left:2px solid var(--ink)}
.yn button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}

.sec__t{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.02em;margin:30px 0 4px}
.sec__d{font-size:14px;color:var(--ink-soft);margin:0 0 6px;max-width:62ch}
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:12px}
.unit{border:2px solid var(--line);background:var(--ground);padding:14px;display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.unit .act{margin-top:auto}
.unit--on{border-color:var(--signal);box-shadow:inset 0 0 0 2px var(--signal)}
.unit__en{font-family:var(--font-mono);font-weight:600;font-size:14px;color:var(--signal)}
.unit__pt{font-size:13px;color:var(--ink-soft)}
.unit__bar{height:5px;background:var(--line);position:relative;width:100%}
.unit__bar span{position:absolute;left:0;top:0;bottom:0;background:var(--signal)}
.srs{display:flex;gap:8px;align-items:flex-end;margin-top:6px}
.srs__c{display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--font-mono);font-size:12px;width:44px}
.srs__c small{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.srs__b{width:100%;background:var(--signal)}
.srs__c:nth-child(n+5) .srs__b{background:var(--ink)}
@media (max-width:560px){
  .mis__slot{width:100%}
  .grades{grid-template-columns:repeat(2,1fr)}
  .mis__chk{width:46px}
  .today{padding:22px 16px 18px}
}


/* ===== CONTA, NUVEM E GAMIFICAÇÃO ===== */
:root[data-tema="oceano"]{--signal:#0A6E80;--chalk:#8FE3D6;--ground:#E1EAEA}
:root[data-tema="vinho"]{--signal:#8C1D40;--chalk:#F6C1CF;--ground:#ECE4E4}
:root[data-tema="ouro"]{--signal:#9A5B00;--chalk:#F4C653;--ground:#EDE8DC}
.acct{margin-top:14px}
.acct__b{display:inline-flex;align-items:center;gap:9px;border:1.5px solid var(--line);background:var(--card);padding:7px 12px;font-size:13px;text-align:left;max-width:100%}
.acct__b:hover{border-color:var(--ink)}
.acct__dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:var(--line)}
.acct__dot--ok{background:#1E9E5A}.acct__dot--wait{background:var(--chalk);animation:blink 1s infinite}.acct__dot--bad{background:var(--alert)}

.gbar{display:grid;grid-template-columns:auto 1fr auto auto;gap:14px 18px;align-items:center;border:2px solid var(--ink);background:var(--card);padding:14px 16px;margin-top:18px}
.gbar__rank{display:flex;align-items:center;gap:10px}
.gbar__ic{font-size:30px;line-height:1}
.gbar__n{font-family:var(--font-display);font-weight:700;font-size:19px;margin:0;letter-spacing:-.01em;white-space:nowrap}
.gbar__row{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:6px;flex-wrap:wrap}
.gbar__row span{color:var(--ink-soft)}
.gbar__bar{height:10px;background:var(--line);position:relative}
.gbar__bar span{position:absolute;left:0;top:0;bottom:0;background:var(--signal);transition:width .4s ease}
.gbar__st{display:flex;gap:12px;font-family:var(--font-mono);font-size:13px;white-space:nowrap}
@media (max-width:700px){.gbar{grid-template-columns:1fr auto}.gbar__xp{grid-column:1/-1;order:3}.gbar .act{grid-column:1/-1;order:4;justify-content:center}}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;font-family:var(--font-mono);font-size:13px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.18);pointer-events:none;max-width:90vw}
.toast--on{animation:toastin .35s ease}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.celeb,.certbox{position:fixed;inset:0;background:rgba(16,33,28,.62);display:grid;place-items:center;z-index:70;padding:16px;overflow:auto}
.celeb[hidden],.certbox[hidden]{display:none}
.celeb__box{background:var(--card);border:2px solid var(--ink);max-width:440px;width:100%;padding:28px 22px 22px;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.celeb__ic{font-size:60px;text-align:center;line-height:1.1;margin-bottom:8px}
.celeb__t{font-family:var(--font-display);font-weight:800;font-size:28px;letter-spacing:-.03em;text-align:center;margin:0}
.celeb__d{text-align:center;color:var(--ink-soft);font-size:15px;margin:10px 0 0}
.celeb__r{text-align:center;font-family:var(--font-mono);font-size:13px;background:var(--chalk);padding:8px 10px;margin:16px 0 0}
.celeb__list{margin-top:14px;display:flex;flex-direction:column;gap:8px;max-height:40vh;overflow:auto}
.celeb__it{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.celeb__it span:first-child{font-size:22px}
.celeb__it small{color:var(--ink-soft)}

.rank--lock{opacity:.5}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.badge{border:2px solid var(--ink);background:var(--ground);padding:14px 12px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.badge small{font-size:12px;color:var(--ink-soft);line-height:1.35}
.badge__ic{font-size:28px;line-height:1.1}
.badge__dt{font-family:var(--font-mono);font-size:10px!important;margin-top:auto}
.badge--lock{border-color:var(--line);opacity:.55}
.chip:disabled{opacity:.5;cursor:not-allowed}

.cert{background:#FFFDF6;color:#10211C;border:3px double #10211C;padding:36px 30px;max-width:640px;width:100%;text-align:center;position:relative}
.cert--ouro{border-color:#B8860B;box-shadow:inset 0 0 0 6px #F4E3A8}
.cert__mark{width:54px;height:54px;margin:0 auto 12px}
.cert__mark svg{width:100%;height:100%}
.cert__lead{margin:14px 0 0;font-size:14px;color:#51635C}
.cert__nome{font-family:var(--font-display);font-weight:800;font-size:clamp(28px,6vw,42px);letter-spacing:-.03em;margin:4px 0 12px}
.cert__txt{font-size:15px;max-width:48ch;margin:0 auto;line-height:1.55}
.cert__data{font-family:var(--font-mono);font-size:13px;margin:18px 0 0}
.cert__selo{display:inline-block;margin:12px 0 0;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;background:#F4C653;padding:5px 10px}
.cert__nota{font-size:11px;color:#51635C;margin:18px 0 0}
.certbox__in{width:100%;max-width:660px;display:flex;flex-direction:column;align-items:center}
.certbox .act{background:var(--card)}
@media print{
  body *{visibility:hidden!important}
  #cert,#cert *{visibility:visible!important}
  #cert{position:fixed;left:0;top:0;width:100%;max-width:none;border-width:3px}
}

.sql{width:100%;min-height:160px;margin-top:10px;font-family:var(--font-mono);font-size:11.5px;line-height:1.45;border:2px solid var(--ink);background:#0F1D19;color:#D9E4DD;padding:12px;resize:vertical}
.stu__top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.stu__st{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;background:#1E9E5A;color:#fff;padding:4px 8px;white-space:nowrap}
.stu--off .stu__st{background:var(--alert)}
.stu--off{opacity:.75}
.stu__kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin-top:16px}
.stu__kpi span{display:flex;flex-direction:column}
.stu__kpi b{font-family:var(--font-display);font-size:18px}
.stu__kpi small{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.tl{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px dotted var(--line);font-size:14px}
.tl__ic{flex:0 0 auto}
.tl__b{flex:1}
.tl__xp{font-family:var(--font-mono);font-size:11px;color:var(--signal)}
.tl__t{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);white-space:nowrap}

body.portao .top,body.portao .bar,body.portao .compose{display:none}
body.portao #view{margin-top:18px}

.tmr{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--ground);padding:11px 14px 10px;margin:0 0 14px;display:grid;gap:7px;box-shadow:0 6px 14px rgba(16,33,28,.12)}
.tmr__row{display:flex;justify-content:space-between;gap:6px 14px;flex-wrap:wrap;font-size:14px}
.tmr__row b{font-family:var(--font-mono)}
.tmr__bar{height:6px;background:#2b3d37;position:relative}
.tmr__bar span{position:absolute;left:0;top:0;bottom:0;background:var(--chalk);transition:width .9s linear}
.tmr__st{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:#9fb0a8}
.tmr--pause .tmr__bar span{background:#7d918a}
.tmr--done{background:#1E7A4A}
.tmr--done .tmr__bar span{background:#9BE7B9}
.drill__top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.maos[aria-pressed="true"]{background:var(--alert);border-color:var(--alert);color:#fff}
.sc__go{font-weight:700;color:#1E9E5A;margin:8px 0 0}

.banner{position:fixed;left:50%;top:14px;transform:translate(-50%,-140%);z-index:65;background:var(--card);border:2px solid var(--ink);box-shadow:0 10px 28px rgba(16,33,28,.22);padding:12px 16px;display:flex;gap:12px;align-items:center;max-width:min(92vw,460px);transition:transform .35s cubic-bezier(.2,1.2,.4,1);pointer-events:none}
.banner--on{transform:translate(-50%,0)}
.banner__ic{font-size:32px;line-height:1}
.banner span:last-child{display:flex;flex-direction:column;gap:1px;font-size:14px}
.banner small{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--signal)}
.banner b{font-family:var(--font-display);font-size:18px}
.banner em{font-style:normal;color:var(--ink-soft);font-size:13px}
.banner i{font-style:normal;font-family:var(--font-mono);font-size:12px;background:var(--chalk);align-self:flex-start;padding:1px 6px;margin-top:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ==================================================================
   VISUAL DE APP — arredondado, colorido, botões com volume
   ================================================================== */
:root{
  --ground:#FFFFFF; --card:#FFFFFF; --ink:#3C3C3C; --ink-soft:#7A7A7A; --line:#E5E5E5;
  --signal:#1E9BEA; --signal-d:#1679BB; --chalk:#FFC21A; --chalk-d:#DB9E00; --alert:#EE4D4D; --alert-d:#C53434;
  --green:#4CC23A; --green-d:#3A9A2C; --green-l:#D7F5CF; --purple:#A560E8; --purple-d:#8445C2;
  --font-display:'Nunito',system-ui,-apple-system,Segoe UI,sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,Segoe UI,sans-serif;
  --font-mono:'Nunito',system-ui,sans-serif;
  --r:16px;
}
:root[data-tema="oceano"]{--green:#14B3A6;--green-d:#0E8C82;--green-l:#CFF3EF;--signal:#2D8CFF;--signal-d:#1F69C4;--ground:#fff}
:root[data-tema="vinho"]{--green:#D9487A;--green-d:#AE345E;--green-l:#FBD9E5;--signal:#8C5AE8;--signal-d:#6B3FC2;--ground:#fff}
:root[data-tema="ouro"]{--green:#E8A500;--green-d:#B88200;--green-l:#FFF0C2;--signal:#E86A1E;--signal-d:#B95215;--ground:#fff}
body{background:#fff;color:var(--ink);font-family:var(--font-body);font-weight:600}
.wrap{max-width:640px;padding:0 16px 110px}
h1,h2,h3,b,strong{font-weight:800}

/* navegação */
.nav{position:fixed;z-index:40;background:#fff;display:flex}
.nav button{display:flex;align-items:center;gap:14px;border-radius:14px;color:var(--ink-soft);font-weight:800;font-size:14px;letter-spacing:.04em;text-transform:uppercase;border:2px solid transparent}
.nav .ni{font-size:24px;line-height:1;filter:saturate(1.1)}
.nav button[aria-pressed="true"]{background:#DDF4FF;border-color:#84D8FF;color:var(--signal)}
.nav__brand{display:none}
.nav__sec{display:flex;flex-direction:column;gap:4px}
.nav__acc{padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.nav__acc .nl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft)}
.nav__tools{display:flex;flex-wrap:wrap;gap:6px;padding:4px 12px 8px}
.nav__tools button{font-size:12px;text-transform:none;letter-spacing:0;padding:6px 10px;border:2px solid var(--line);border-radius:12px;color:var(--ink)}
@media (min-width:980px){
  body{padding-left:250px}
  .nav{left:0;top:0;bottom:0;width:250px;flex-direction:column;gap:6px;padding:22px 14px;border-right:2px solid var(--line);overflow:auto}
  .nav__brand{display:block;font-family:var(--font-display);font-weight:900;font-size:26px;color:var(--green);padding:4px 14px 20px;letter-spacing:-.02em}
  .nav__brand em{font-style:normal;color:var(--signal)}
  .nav button{padding:10px 14px;width:100%;text-align:left}
  .nav__more{display:none!important}
  .nav__sec{margin-top:10px;padding-top:10px;border-top:2px solid var(--line)}
  .nav__sec .ni{font-size:20px}
  .appbar__brand{display:none!important}
}
@media (max-width:979px){
  .nav{left:0;right:0;bottom:0;height:66px;border-top:2px solid var(--line);justify-content:space-around;align-items:center;padding:0 4px env(safe-area-inset-bottom)}
  .nav > button{flex-direction:column;gap:2px;padding:6px 4px;font-size:10px;flex:1;max-width:84px}
  .nav > button .ni{font-size:24px}
  .nav > button[aria-pressed="true"]{background:#DDF4FF}
  .nav__sec{display:none;position:fixed;left:10px;right:10px;bottom:78px;background:#fff;border:2px solid var(--line);border-radius:20px;padding:10px;box-shadow:0 14px 40px rgba(0,0,0,.16);max-height:70vh;overflow:auto}
  body.more .nav__sec{display:flex}
  .nav__sec button{padding:10px 12px;width:100%;text-align:left}
  body.inlesson .nav{display:none}
  body.inlesson .wrap{padding-bottom:40px}
}
body.portao .nav,body.portao .appbar__stats{display:none}
body.portao{padding-left:0}

/* barra do topo */
.appbar{position:sticky;top:0;z-index:30;background:#fff;display:flex;align-items:center;gap:10px;padding:12px 0 10px;border-bottom:2px solid var(--line);margin:0 0 6px}
.appbar__brand{display:flex;align-items:center;gap:8px;margin-right:auto}
.appbar__brand .brand__mark{width:34px;height:34px}
.appbar__brand .brand__w{font-weight:900;font-size:19px;color:var(--green);letter-spacing:-.02em}
.brand__w em{color:var(--signal)}
.appbar__stats{display:flex;gap:6px;align-items:center;margin-left:auto}
.ab{display:inline-flex;align-items:center;gap:4px;font-weight:900;font-size:16px;padding:5px 9px;border-radius:12px}
.ab b{font-weight:900}
.ab--lvl{border:2px solid var(--line);color:var(--signal);font-size:14px}
.ab--fire{color:#FF9600}
.ab--xp{color:var(--chalk-d)}
.avatar{position:relative;width:38px;height:38px;border-radius:50%;background:var(--purple);color:#fff;font-weight:900;font-size:17px;display:grid;place-items:center;border-bottom:3px solid var(--purple-d)}
.avatar__dot{position:absolute;right:-2px;bottom:-2px;width:13px;height:13px;border-radius:50%;border:2px solid #fff;background:#bbb}
.avatar__dot--ok{background:var(--green)}.avatar__dot--wait{background:var(--chalk)}.avatar__dot--bad{background:var(--alert)}
.acct{margin:0}
body.inlesson .appbar{display:none}

/* esconder o que não é do modo atual */
.bar{display:none;border:0;margin:14px 0 0;padding:0}
body[data-mode="col"] .bar,body[data-mode="tra"] .bar{display:flex}
.top,.foot{display:none}

/* botões com volume */
.act,.btn,.grade,.yn button,.lvltab,.big{transition:transform .06s ease,filter .1s ease}
.act{border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:#fff;color:var(--ink);font-weight:800;font-size:14px;padding:9px 14px}
.act:hover{background:#F7F7F7;color:var(--ink);border-color:var(--line)}
.act:active,.btn:active,.grade:active,.big:active,.node:active,.row__play:active,.lvltab:active{transform:translateY(2px)}
.act--main,.btn{background:var(--green);border:2px solid var(--green-d);border-bottom-width:4px;color:#fff;border-radius:14px;font-weight:900}
.act--main:hover,.btn:hover{background:var(--green);filter:brightness(1.06);border-color:var(--green-d);color:#fff}
.act--on{background:#DDF4FF;border-color:#84D8FF;color:var(--signal)}
.act--live{background:var(--alert)!important;border-color:var(--alert-d)!important;color:#fff!important}
.btn--ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn--ghost:hover{background:#F7F7F7;color:var(--ink)}
.big{display:block;width:100%;background:var(--green);color:#fff;border:0;border-bottom:4px solid var(--green-d);border-radius:16px;padding:14px 16px;font-weight:900;font-size:16px;letter-spacing:.06em;text-transform:uppercase;margin-top:14px}
.big:hover{filter:brightness(1.06)}
.big--alt{background:var(--signal);border-bottom-color:var(--signal-d)}
.linkbtn{display:block;margin:18px auto 0;color:var(--signal);font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.05em}
.chip{border:2px solid var(--line);border-bottom-width:3px;border-radius:999px;background:#fff;font-weight:800;padding:6px 12px}
.chip:hover{background:#F7F7F7;color:var(--ink);border-color:var(--line)}
.chip[aria-pressed="true"]{background:#DDF4FF;border-color:#84D8FF;color:var(--signal)}
.chip--sm{font-family:var(--font-body)}
.mini{border:2px solid var(--line);border-radius:10px;font-family:var(--font-body);font-weight:800}
.mini:hover{background:#F7F7F7;color:var(--ink);border-color:var(--line)}
.mini--on{background:var(--green);border-color:var(--green-d);color:#fff}
.seg{border:2px solid var(--line);border-radius:14px;overflow:hidden}
.seg button{font-family:var(--font-body);font-weight:800;font-size:12px;letter-spacing:.04em}
.seg button[aria-pressed="true"]{background:#DDF4FF;color:var(--signal)}
.field{border:2px solid var(--line);border-radius:14px;background:#F7F7F7;font-weight:700}
.field:focus{border-color:#84D8FF;background:#fff;outline:none}
:focus-visible{outline:3px solid #84D8FF}

/* cartões */
.kit,.card,.hist,.drill,.empty,.unit,.badge,.sidecard,.logopick,.cert{border-radius:var(--r)}
.kit,.card,.hist,.logopick{border:2px solid var(--line);background:#fff}
.kit{padding:22px 18px 18px}
.kit__title,.hist__t,.lesson__t,.empty h2{font-family:var(--font-display);font-weight:900;letter-spacing:-.02em}
.kit__brief{border-left:0;padding-left:0}
.eyebrow{font-family:var(--font-body);font-weight:900;letter-spacing:.08em;color:var(--signal)}
.hist__h,.block__l,.drill__pos,.auto__l,.stat__l,.days__ax,.beats__legend,.hear__l,.sugg__l,.logopick__l,.cando__lv,.unit__en{font-family:var(--font-body);font-weight:900;letter-spacing:.06em}
.stage__h{border-bottom:2px solid var(--line)}
.stage__n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;font-family:var(--font-body);font-weight:900;font-size:13px}
.stage__t{font-weight:900}
.hear{border-left:0;border-radius:var(--r);background:#F1F9FF}
.row{border-bottom:2px solid #F2F2F2;align-items:center}
.row__en{font-weight:800}
.empty{border:2px dashed var(--line)}
.msg{font-family:var(--font-body);font-weight:800}
.days{border-bottom:2px solid var(--line)}
.day{border-radius:4px 4px 0 0}
.day--hot{background:var(--signal)}
.day--top{background:var(--green)}
.rank{border-bottom:2px solid #F2F2F2}
.rank__n,.rank__c{font-family:var(--font-body);font-weight:900}
.mark{border-radius:4px}
.trip__k{border-radius:6px;font-family:var(--font-body);font-weight:900}
.beat{border-radius:4px}
.beat--strong{background:var(--ink)}
.beat--on{background:var(--signal)}
.opt{border-radius:14px}
.opt[aria-pressed="true"]{border-color:#84D8FF;box-shadow:none;background:#F1F9FF}
.vid,.vid__bar{border-color:var(--line)!important;border-radius:var(--r)}
.vid{overflow:hidden}
.stats{gap:18px}
.stat__n{font-weight:900}
.sugg{border-radius:14px;overflow:hidden;border-color:#84D8FF}
.sugg button:hover{background:#F1F9FF;color:var(--ink)}

/* botão de ouvir com contador */
.row__play{width:46px;height:46px;border-radius:14px;border:0;border-bottom:4px solid var(--signal-d);background:var(--signal);color:#fff;font-size:16px;position:relative}
.row__play:hover{background:var(--signal);filter:brightness(1.08);color:#fff}
.pb{position:relative;overflow:visible}
.pb::after{content:attr(data-pl);position:absolute;top:-8px;right:-9px;min-width:26px;height:20px;padding:0 5px;border-radius:999px;background:#fff;border:2px solid var(--line);color:var(--ink-soft);font-size:11px;font-weight:900;line-height:16px;text-align:center;font-family:var(--font-body)}
.pb--ok{background:var(--green)!important;border-bottom-color:var(--green-d)!important;color:#fff!important}
.pb--ok::after{background:var(--green);border-color:#fff;color:#fff}
.act.pb::after{top:-10px;right:-10px}

/* treino livre claro */
.train{background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:var(--r)}
.train .card__source,.train .beats__legend,.train .ctx,.train .tips,.train .block__l,.train .row__pt,.train .card__note,.train .trip__b span,.train__pos{color:var(--ink-soft)}
.train .card__source b{color:var(--ink)}
.train .act,.train .mini{background:#fff;border-color:var(--line);color:var(--ink)}
.train .act--main{background:var(--green);border-color:var(--green-d);color:#fff}
.train .row__play{background:var(--signal);color:#fff}
.train .beat--strong{background:var(--ink)}.train .beat--weak{background:var(--line)}.train .beat--on{background:var(--signal)}
.train .acts,.train .block,.train .row{border-color:#F2F2F2}

/* HOJE: saudação e meta */
.hello{display:grid;gap:14px;margin:12px 0 0}
.hello__k{margin:0;font-weight:800;color:var(--ink-soft)}
.hello__t{margin:2px 0 0;font-size:26px;font-weight:900;letter-spacing:-.02em;line-height:1.15}
.goal{border:2px solid var(--line);border-radius:var(--r);padding:14px 16px}
.goal__row{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.goal__row--s{font-size:13px;color:var(--ink-soft);margin-top:6px}
.goal__bar{height:16px;border-radius:999px;background:var(--line);margin-top:8px;overflow:hidden;position:relative}
.goal__bar span{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--chalk);box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.notice{border-radius:var(--r);background:#FFF5D6;color:var(--ink);margin-top:14px}
.unitbar{background:var(--green);color:#fff;border-radius:var(--r);border-bottom:4px solid var(--green-d);padding:14px 18px;margin:18px 0 6px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.unitbar__k{margin:0;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.unitbar__t{margin:2px 0 0;font-size:20px;font-weight:900}
.unitbar__r{text-align:right;display:flex;flex-direction:column}
.unitbar__r b{font-size:18px}
.unitbar__r small{font-size:12px;opacity:.9}
.unitbar__det{font-size:14px}
.unitbar__det summary{cursor:pointer;font-weight:800;background:rgba(255,255,255,.18);border-radius:12px;padding:6px 10px}
.unitbar__det ul{margin:10px 0 0;padding-left:18px}

/* caminho de lições */
.path{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 0 10px}
.pnode{display:flex;flex-direction:column;align-items:center;transform:translateX(var(--off));position:relative;width:180px;text-align:center}
.node{--p:0;position:relative;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--green) calc(var(--p)*1%), #E5E5E5 0);
  box-shadow:0 7px 0 var(--chalk-d);margin-bottom:10px}
.node::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--chalk);box-shadow:inset 0 -5px 0 rgba(0,0,0,.12)}
.node__ic{position:relative;font-size:32px;line-height:1;color:#fff;font-weight:900}
.node:active{box-shadow:0 3px 0 var(--chalk-d)}
.node--done{background:var(--green);box-shadow:0 7px 0 var(--green-d)}
.node--done::before{background:var(--green)}
.node--done:active{box-shadow:0 3px 0 var(--green-d)}
.node--cur{animation:nodepulse 1.8s ease-in-out infinite}
@keyframes nodepulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.pnode__l{font-weight:900;font-size:14px;line-height:1.2}
.pnode__s{font-size:12px;color:var(--ink-soft);font-weight:700;margin-top:2px}
.bubble{position:absolute;top:-40px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--line);color:var(--green);font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:12px;white-space:nowrap;animation:bob 1.4s ease-in-out infinite;z-index:2}
.bubble::after{content:"";position:absolute;bottom:-8px;left:50%;width:12px;height:12px;background:#fff;border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-5px)}}
.pnode:has(.bubble){margin-top:34px}
.chest{font-size:52px;line-height:1;margin:8px 0 6px;filter:grayscale(.4)}
.chest--open{filter:none;animation:nodepulse 1.4s ease-in-out infinite}
.side{display:grid;gap:10px;margin-top:22px}
.sidecard{display:flex;gap:12px;align-items:center;border:2px solid var(--line);padding:12px 14px;flex-wrap:wrap}
.sidecard__ic{font-size:26px}
.sidecard > span:nth-child(2){display:flex;flex-direction:column;flex:1 1 160px}
.sidecard small{color:var(--ink-soft);font-size:13px;font-weight:700}
.sidecard__a{display:flex;gap:6px;flex-wrap:wrap}
.sidecard__a .act{padding:6px 10px;font-size:13px}
.lvltabs{display:flex;gap:8px;margin:14px 0 0}
.lvltab{flex:1;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:8px;font-weight:900;color:var(--ink-soft)}
.lvltab[aria-pressed="true"]{background:#DDF4FF;border-color:#84D8FF;color:var(--signal)}

/* lição */
.lesson{padding:14px 0 30px}
.lesson__top{display:flex;align-items:center;gap:14px;position:sticky;top:0;background:#fff;z-index:20;padding:10px 0}
.lesson__x{font-size:24px;color:#AFAFAF;font-weight:900;width:32px;flex:0 0 auto}
.lesson__x:hover{color:var(--ink)}
.lesson__bar{flex:1;height:16px;border-radius:999px;background:var(--line);position:relative;overflow:hidden}
.lesson__bar span{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--green);box-shadow:inset 0 -4px 0 rgba(0,0,0,.1);transition:width .5s ease}
.lesson__bar span::after{content:"";position:absolute;left:10px;right:10px;top:4px;height:4px;border-radius:999px;background:rgba(255,255,255,.35)}
.lesson__min{font-weight:900;color:var(--ink-soft);font-size:14px;min-width:56px;text-align:right;white-space:nowrap}
.lesson__kick{margin:14px 0 0;font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--purple)}
.lesson__t{margin:4px 0 0;font-size:clamp(24px,6vw,30px);line-height:1.15}
.lesson__why{margin:8px 0 0;color:var(--ink-soft);font-size:15px;font-weight:600}
.lesson__hint{display:block;margin-top:6px;color:var(--signal);font-weight:800;font-size:14px}
.lesson__body{margin-top:16px}
.lesson__foot:empty{display:none}
.lesson__foot{position:sticky;bottom:0;background:#fff;padding:10px 0 12px;margin-top:18px;z-index:15}
.lesson__foot--ok{background:var(--green-l);margin-left:-16px;margin-right:-16px;padding:14px 16px 16px;border-top:2px solid transparent;animation:slideup .3s ease}
@keyframes slideup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.okpanel{display:flex;gap:12px;align-items:center;color:var(--green-d)}
.okpanel__ic{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:24px;font-weight:900;flex:0 0 auto}
.okpanel span:last-child{display:flex;flex-direction:column}
.okpanel b{font-size:20px}
.okpanel small{font-weight:800;font-size:14px}
.lesson .kit{border:0;padding:0;margin:0}
.lesson .stage{margin-top:22px}

/* exercícios */
.drill{border:2px solid var(--line);background:#fff;padding:18px}
.drill__q{font-family:var(--font-display);font-weight:900}
.drill__a{border-top:2px dashed var(--line)}
.fab__frame{border-bottom:2px solid #F2F2F2}
.fab__en{font-family:var(--font-body);font-weight:900;color:var(--signal);font-size:18px}
.fab__tip{border-radius:12px;background:#FFF5D6}
.grade{border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:#fff;font-weight:900}
.grade:hover{background:#F7F7F7;color:var(--ink)}
.grade:hover small{color:var(--ink-soft)}
.grades--2 .grade:not(.grade--bad),.grades .grade:last-child{background:var(--green);border-color:var(--green-d);color:#fff}
.grades .grade:last-child small{color:#fff}
.grade--bad{border-color:#FFC1C1;color:var(--alert);background:#FFF5F5}
.grade--bad:hover{background:var(--alert);color:#fff;border-color:var(--alert-d)}
.frame{border:2px solid var(--line);border-bottom-width:3px;border-radius:12px;font-family:var(--font-body);font-weight:800;background:#fff}
.frame:hover{background:#F1F9FF;color:var(--ink);border-style:solid}
.ex p{border-left:0;border-radius:12px;background:#F7F7F7}
.ex summary{color:var(--signal);font-weight:900}
.q{border-bottom:2px solid #F2F2F2}
.q__pt{margin-left:56px}
.steps{font-weight:600}
.cando{border-bottom:2px solid #F2F2F2}
.yn{border:2px solid var(--line);border-radius:12px;overflow:hidden}
.yn button+button{border-left:2px solid var(--line)}
.yn button[aria-pressed="true"]{background:var(--green);color:#fff}
.sc{border-radius:14px;padding:12px 14px}
.sc--ok{background:var(--green-l);color:var(--green-d)}
.sc--mid{background:#FFF5D6;color:#9A6A00}
.sc--no{background:#FFE4E4;color:var(--alert-d)}
.sc__v{font-family:var(--font-body);font-weight:900}
.sc__w{border-radius:8px;font-weight:800}
.sc__w--ok{background:rgba(76,194,58,.2);color:var(--green-d)}
.sc__l{font-family:var(--font-body);font-weight:700}
.sc__go{color:var(--green-d);font-size:16px}
.tmr{background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:var(--r);box-shadow:none}
.tmr__bar{background:var(--line);border-radius:999px;height:12px;overflow:hidden}
.tmr__bar span{background:var(--green);border-radius:999px}
.tmr__st{color:var(--ink-soft);font-family:var(--font-body);font-weight:700}
.tmr--done{background:var(--green-l)}
.tmr--done .tmr__bar span{background:var(--green)}
.maos{font-weight:800}
.esc--hide .row__en,.esc--hide .row__pt{filter:blur(7px)}
.row--on{background:#FFF5D6;border-radius:12px}

/* fim de rodada */
.donecard{text-align:center;padding:10px 0}
.donecard__ic{font-size:64px;line-height:1.1}
.donecard__t{font-size:28px;font-weight:900;color:var(--chalk-d);margin:6px 0 16px}
.donecard__stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ds{border:2px solid;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ds small{color:#fff;font-weight:900;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:4px}
.ds b{font-size:20px;padding:8px 4px;background:#fff}
.ds--g{border-color:var(--green)}.ds--g small{background:var(--green)}.ds--g b{color:var(--green-d)}
.ds--b{border-color:var(--signal)}.ds--b small{background:var(--signal)}.ds--b b{color:var(--signal-d)}
.ds--y{border-color:var(--chalk)}.ds--y small{background:var(--chalk)}.ds--y b{color:var(--chalk-d)}
.donecard .ex{text-align:left;margin-top:16px}

/* conquistas e outros */
.gbar{border:2px solid var(--line);border-radius:var(--r);background:#fff}
.gbar__bar{height:14px;border-radius:999px;overflow:hidden}
.gbar__bar span{background:var(--chalk);border-radius:999px}
.badge{border:2px solid var(--line);border-bottom-width:4px;background:#fff}
.badge--lock{background:#F7F7F7}
.srs__b{border-radius:6px 6px 0 0}
.stu__st{border-radius:999px}
.today{display:none}
.place .cando__lv{color:var(--signal)}
.celeb__box{border:0;border-radius:24px}
.celeb__r{border-radius:12px}
.toast{border-radius:14px;background:var(--ink);font-family:var(--font-body);font-weight:800}
.banner{border-radius:18px;border:2px solid var(--line)}
.banner small{font-family:var(--font-body);font-weight:900}
.banner i{border-radius:8px;font-family:var(--font-body);font-weight:900}
.sql{border-radius:12px}
.compose{margin-top:16px}
.top__title{display:none}
.toast{top:12px;bottom:auto}
@keyframes toastin{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
.banner{top:62px}
[hidden]{display:none!important}

/* ===== provas e reembolso ===== */
.provacta{border:2px solid #84D8FF;background:#F1F9FF;border-radius:16px;padding:14px 16px;margin:0 0 16px;font-weight:700}
.provacta--ok{border-color:var(--green);background:var(--green-l);color:var(--green-d);font-weight:900}
.provacta--lock{border-color:var(--line);background:#F7F7F7;color:var(--ink-soft)}
.prova__intro{border:2px solid var(--line);border-radius:16px;padding:16px 18px}
.prova__lead{font-size:20px;font-weight:900;margin:0 0 10px}
.prova__rules{margin:0;padding-left:20px;display:grid;gap:8px;font-size:15.5px;font-weight:600}
.prova__msg{margin:16px 0 0;font-size:15px;font-weight:700;line-height:1.5}
.pq__k{font-weight:900;color:var(--signal);font-size:13px;letter-spacing:.04em;text-transform:uppercase;margin:0}
.pq__q{font-size:24px;font-weight:900;line-height:1.3;margin:8px 0 12px}
.pq__gap{display:inline-block;min-width:44px;border-bottom:3px solid var(--signal);color:transparent}
.pq__apoio{color:var(--ink-soft);font-weight:700;margin:-4px 0 12px}
.pq__in{width:100%;box-sizing:border-box;font-size:17px;resize:vertical}
.pq__opts{display:grid;gap:10px}
.pq__opt{border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:14px 16px;text-align:left;font-weight:800;font-size:16px;background:#fff}
.pq__opt[aria-pressed="true"]{border-color:#84D8FF;background:#DDF4FF;color:var(--signal-d)}
.pq__nav{display:flex;gap:10px;align-items:center}
.pq__nav .big{margin:0;flex:1}
.pc{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;margin-top:8px}
.pc--ok{background:var(--green-l)}.pc--no{background:#FFF0F0}
.pc__ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;flex:0 0 auto}
.pc--ok .pc__ic{background:var(--green)}.pc--no .pc__ic{background:var(--alert)}
.pc__b{display:flex;flex-direction:column;gap:2px;font-size:15px}
.pc__b small{color:var(--ink-soft);font-weight:700}
.pc__b s{color:var(--alert-d)}
.rcard{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:2px solid #FFD666;background:#FFF8E1;border-radius:16px;padding:12px 14px;margin:14px 0 0}
.rcard--c{margin:14px 0 0}
.rcard__ic{font-size:30px}
.rcard__b{flex:1;display:flex;flex-direction:column;gap:3px}
.rcard__b small{color:#7A5A00;font-weight:800;font-size:12.5px}
.rcard__b b{font-size:20px;font-weight:900;color:#5C4300}
.rcard__b b i{font-style:normal;font-size:14px;color:#8A6A00;font-weight:800}
.rcard__bar{height:10px;border-radius:999px;background:#FFE7A3;position:relative;overflow:hidden}
.rcard__bar span{position:absolute;left:0;top:0;bottom:0;background:var(--chalk-d);border-radius:999px}
.pix{margin-top:16px}
.paylist{display:grid;gap:10px;margin-top:12px}
.payrow{border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.payrow__h{display:flex;flex-direction:column}
.payrow__h small{color:var(--ink-soft);font-weight:700}
.payrow__g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:10px}
.payrow__g > span{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.payrow__g small{color:var(--ink-soft);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.payrow__g b.ok{color:var(--green-d)}.payrow__g b.no{color:var(--alert-d)}
.payrow__ok{margin:10px 0 0;background:var(--green-l);color:var(--green-d);border-radius:10px;padding:8px 10px;font-weight:800;font-size:14px}

.mq__dots{display:flex;gap:6px;align-items:center;margin:10px 0 6px}
.mq__dots span{width:12px;height:12px;border-radius:50%;background:var(--line)}
.mq__dots span.on{background:var(--green)}
.mq__dots span.cur{background:#84D8FF}

{ id:'compras', tag:'Chegando num país', title:'Caixa, mercado e farmácia',

  steps:[
    {step:'Procurando', lines:[
      {en:"Excuse me, where can I find aspirin?", pt:'Com licença, onde eu acho aspirina?', core:'where can I find'},
      {en:"Do you have this in a large?", pt:'Tem esse no tamanho grande?', core:'do you have this in'},

    {step:'No caixa', lines:[

{ id:'palestra', tag:'No trabalho', title:'Abrir uma palestra',
  brief:'Plateia americana espera que você vá direto ao ponto: agradecimento curto, quem você é em uma frase, e o que ela vai levar dali. Piada de aquecimento é opcional; prometer o que vai entregar não é.',
  steps:[
    {step:'Saudação', lines:[
      {en:"Good morning, everyone. Thanks for having me.", pt:'Bom dia a todos. Obrigado pelo convite.', core:'thanks for having me'},
      {en:"It's great to be here today.", pt:'É ótimo estar aqui hoje.', core:"it's great to be here"},
      {en:"Can everyone hear me okay in the back?", pt:'Todo mundo consegue me ouvir lá atrás?', core:'can everyone hear me'}]},
    {step:'Quem é você', lines:[
      {en:"For those who don't know me, I'm Zeu.", pt:'Para quem não me conhece, sou o Zeu.', core:"for those who don't know me"},
      {en:"I've been working in this field for ten years.", pt:'Trabalho nessa área há dez anos.', core:"I've been working in"},
      {en:"I'll keep the introductions short.", pt:'Vou fazer uma introdução curta.', core:"I'll keep it short"}]},
    {step:'O que vem por aí', lines:[
      {en:"Today I want to talk about three things.", pt:'Hoje eu quero falar de três coisas.', core:'I want to talk about'},
      {en:"By the end of this, you'll know exactly how to start.", pt:'No fim disso, você vai saber exatamente como começar.', core:'by the end of this'},
      {en:"Feel free to jump in with questions.", pt:'Fiquem à vontade para perguntar.', core:'feel free to jump in'}]},
    {step:'Fechando', lines:[
      {en:"That's all I have. Happy to take questions.", pt:'É isso que eu tinha. Feliz em responder perguntas.', core:'happy to take questions'},
      {en:"Thank you all so much for your time.", pt:'Muito obrigado pelo tempo de vocês.', core:'thank you for your time'},
      {en:"You can find me right after this.", pt:'Podem me achar logo depois.', core:'right after this'}]}],
  hear:[
    {en:"Could you go back one slide?", pt:'Pode voltar um slide?'},
    {en:"Quick question for you.", pt:'Uma pergunta rápida.'},
    {en:"Could you speak up a bit?", pt:'Pode falar um pouco mais alto?'},
    {en:"We have time for one more.", pt:'Dá tempo para mais uma.'},
    {en:"Let's give it up for our speaker.", pt:'Uma salva de palmas para nosso palestrante.'}]},

{ id:'vendas', tag:'No trabalho', title:'Reunião de metas de vendas',
  brief:'Reunião de vendas em inglês corporativo é curta e cheia de número. Comece pelo resultado, não pelo contexto. Se estiver abaixo da meta, diga isso na primeira frase e depois explique — enrolar antes do número soa como desculpa.',
  steps:[
    {step:'Abrindo', lines:[
      {en:"Thanks for jumping on, everyone. Let's get started.", pt:'Obrigado por entrarem. Vamos começar.', core:"let's get started"},
      {en:"I'll keep this to twenty minutes.", pt:'Vou manter isso em vinte minutos.', core:"I'll keep this to"},
      {en:"Quick agenda: numbers, blockers, next steps.", pt:'Pauta rápida: números, travas, próximos passos.', core:'quick agenda'}]},
    {step:'Os números', lines:[
      {en:"We closed the quarter at eighty percent of target.", pt:'Fechamos o trimestre em oitenta por cento da meta.', core:'we closed the quarter at'},
      {en:"We're tracking ahead of plan.", pt:'Estamos acima do planejado.', core:"we're tracking ahead"},
      {en:"That's up fifteen percent from last month.", pt:'Isso é quinze por cento acima do mês passado.', core:"that's up fifteen percent"}]},
    {step:'Problemas', lines:[
      {en:"The main blocker is the approval process.", pt:'A principal trava é o processo de aprovação.', core:'the main blocker is'},
      {en:"I want to flag a risk on the Acme deal.", pt:'Quero sinalizar um risco no negócio da Acme.', core:'I want to flag a risk'},
      {en:"I'd push back on that timeline.", pt:'Eu questionaria esse prazo.', core:"I'd push back on that"}]},
    {step:'Fechando', lines:[
      {en:"So the next steps are on me.", pt:'Então os próximos passos ficam comigo.', core:'the next steps are'},
      {en:"Let's circle back on Friday.", pt:'Vamos retomar na sexta.', core:"let's circle back"},
      {en:"I'll send a recap after this.", pt:'Vou mandar um resumo depois disso.', core:"I'll send a recap"}]}],
  hear:[
    {en:"Where are we on the pipeline?", pt:'Como está o funil?'},
    {en:"What's driving that number?", pt:'O que está puxando esse número?'},
    {en:"Can you walk me through that?", pt:'Pode me explicar isso passo a passo?'},
    {en:"Who owns this?", pt:'Quem é o responsável?'},
    {en:"Let's take that offline.", pt:'Vamos tratar disso separadamente.'},
    {en:"Any blockers on your end?", pt:'Alguma trava do seu lado?'}]},

{ id:'entrevista', tag:'No trabalho', title:'Entrevista de emprego',
  brief:'Espere a pergunta "me fale sobre você" logo de cara — e ela não é sobre sua vida, é sobre sua carreira em dois minutos. Responder com histórias concretas (situação, o que você fez, resultado) vale mais que adjetivos sobre si mesmo.',
  steps:[
    {step:'Começo', lines:[
      {en:"Thanks for taking the time to meet with me.", pt:'Obrigado por reservar um tempo para me encontrar.', core:'thanks for taking the time'},
      {en:"I've been looking forward to this.", pt:'Eu estava ansioso por isso.', core:"I've been looking forward to"},
      {en:"A little about my background:", pt:'Um pouco sobre minha trajetória:', core:'about my background'}]},
    {step:'Falando de você', lines:[
      {en:"I led a team of eight for three years.", pt:'Liderei um time de oito pessoas por três anos.', core:'I led a team of'},
      {en:"What I'm most proud of is the launch we did last year.", pt:'O que mais me orgulha é o lançamento do ano passado.', core:"what I'm most proud of"},
      {en:"I'm looking for something more hands-on.", pt:'Estou buscando algo mais mão na massa.', core:"I'm looking for something"}]},
    {step:'Perguntando', lines:[
      {en:"What does success look like in this role?", pt:'Como se mede sucesso nessa vaga?', core:'what does success look like'},
      {en:"What are the next steps in the process?", pt:'Quais são os próximos passos do processo?', core:'the next steps in the process'},
      {en:"Could you tell me more about the team?", pt:'Pode me contar mais sobre o time?', core:'tell me more about'}]}],
  hear:[
    {en:"So, tell me about yourself.", pt:'Então, me fale sobre você.'},
    {en:"Walk me through your resume.", pt:'Me conte sua trajetória pelo currículo.'},
    {en:"What made you apply?", pt:'O que te fez se candidatar?'},
    {en:"Tell me about a time you failed.", pt:'Me conte uma vez em que você falhou.'},
    {en:"Do you have any questions for us?", pt:'Você tem perguntas para a gente?'},
    {en:"We'll be in touch by the end of the week.", pt:'Entramos em contato até o fim da semana.'}]},

{ id:'daily', tag:'No trabalho', title:'Daily e reunião de time',
  brief:'Daily de verdade dura menos de quinze minutos. O formato é sempre o mesmo: o que fiz, o que vou fazer, o que está me travando. Discussão longa é cortada com "let\'s take that offline" — e isso não é grosseria, é etiqueta.',
  steps:[
    {step:'Sua vez', lines:[
      {en:"Yesterday I finished the report.", pt:'Ontem eu terminei o relatório.', core:'yesterday I finished'},
      {en:"Today I'm picking up the new tickets.", pt:'Hoje vou pegar os novos chamados.', core:"today I'm picking up"},
      {en:"No blockers on my end.", pt:'Nenhuma trava do meu lado.', core:'no blockers on my end'}]},
    {step:'Quando trava', lines:[
      {en:"I'm blocked on the design review.", pt:'Estou travado esperando a revisão de design.', core:"I'm blocked on"},
      {en:"I could use a hand with this.", pt:'Eu precisaria de uma ajuda nisso.', core:'I could use a hand'},
      {en:"Can we sync after this?", pt:'Podemos alinhar depois disso?', core:'can we sync after'}]},
    {step:'Interagindo', lines:[
      {en:"Sorry, go ahead.", pt:'Desculpa, pode falar.', core:'sorry go ahead'},

      {en:"I see it a little differently.", pt:'Eu vejo isso de um jeito um pouco diferente.', core:'I see it differently'}]}],
  hear:[
    {en:"Who wants to kick us off?", pt:'Quem quer começar?'},
    {en:"Anything blocking you?", pt:'Algo te travando?'},
    {en:"Let's take that offline.", pt:'Vamos tratar disso depois.'},
    {en:"Can you unmute?", pt:'Pode tirar o mudo?'},
    {en:"You're breaking up a bit.", pt:'Você está falhando um pouco.'},
    {en:"That's it from me.", pt:'De mim é isso.'}]},

{ id:'social', tag:'No dia a dia', title:'Conversa social e small talk',
  brief:'Small talk não é perda de tempo, é o pedágio de qualquer interação. "How are you?" não é pergunta de verdade — a resposta é curta e você devolve. Falar de tempo, trânsito e fim de semana é sempre seguro.',
  steps:[
    {step:'Cumprimento', lines:[
      {en:"Hey, how's it going?", pt:'Oi, tudo bem?', core:"how's it going"},
      {en:"Good, thanks. How about you?", pt:'Bem, obrigado. E você?', core:'how about you'},
      {en:"Long time no see!", pt:'Quanto tempo!', core:'long time no see'}]},
    {step:'Puxando assunto', lines:[
      {en:"Any plans for the weekend?", pt:'Algum plano pro fim de semana?', core:'plans for the weekend'},
      {en:"How was your weekend?", pt:'Como foi seu fim de semana?', core:'how was your weekend'},
      {en:"Crazy weather today, huh?", pt:'Tempo doido hoje, né?', core:'crazy weather'}]},
    {step:'Saindo bem', lines:[
      {en:"It was great talking to you.", pt:'Foi ótimo falar com você.', core:'great talking to you'},
      {en:"I should get going.", pt:'Preciso ir andando.', core:'I should get going'},
      {en:"Let's catch up soon.", pt:'Vamos nos falar em breve.', core:"let's catch up"}]}],
  hear:[
    {en:"What have you been up to?", pt:'O que você tem feito?'},
    {en:"How's the family?", pt:'Como está a família?'},
    {en:"Same here.", pt:'Comigo é igual.'},
    {en:"No way, seriously?", pt:'Não acredito, sério?'},
    {en:"Take care!", pt:'Se cuida!'}]},

{ id:'trabalho', lvl:'A2', tag:'No trabalho', title:'Falar de você e do seu trabalho',
  brief:'É a conversa que mais aparece: na entrevista, no primeiro dia, no networking. Frases curtas no presente simples já resolvem. Não tente traduzir seu cargo palavra por palavra — diga o que você faz.',
  steps:[
    {step:'Quem você é', lines:[
      {en:"Hi, I'm Zeu. Nice to meet you.", pt:'Oi, sou o Zeu. Prazer.', core:'nice to meet you'},
      {en:"I'm from Brazil.", pt:'Sou do Brasil.', core:"I'm from"},
      {en:"I live in a small city.", pt:'Moro numa cidade pequena.', core:'I live in a'}]},
    {step:'O que você faz', lines:[
      {en:"I work in sales.", pt:'Trabalho com vendas.', core:'I work in'},
      {en:"I help companies find new customers.", pt:'Ajudo empresas a achar clientes novos.', core:'I help companies'},
      {en:"I've been doing this for five years.", pt:'Faço isso há cinco anos.', core:"I've been doing this"}]},
    {step:'O que você quer', lines:[
      {en:"What I like most is talking to people.", pt:'O que eu mais gosto é falar com pessoas.', core:'what I like most'},
      {en:"I'm learning English for work.", pt:'Estou aprendendo inglês para o trabalho.', core:"I'm learning English"},
      {en:"My goal is to work for a bigger company.", pt:'Meu objetivo é trabalhar numa empresa maior.', core:'my goal is to'}]}],
  hear:[
    {en:"So, what do you do?", pt:'Então, o que você faz?'},
    {en:"How long have you been doing that?", pt:'Há quanto tempo você faz isso?'},
    {en:"Where are you based?", pt:'Você mora ou trabalha onde?'},
    {en:"That sounds interesting.", pt:'Parece interessante.'},
    {en:"What brings you here?", pt:'O que te traz aqui?'}]},

{ id:'call', lvl:'B1', tag:'No trabalho', title:'Ligação e videochamada',
  brief:'Em chamada você não tem gestos para ajudar, então peça para repetir sem medo — nativos fazem isso o tempo todo. Confirmar se todos ouvem no começo e resumir o combinado no fim evita metade dos mal-entendidos.',
  steps:[
    {step:'Começando', lines:[
      {en:"Can you hear me okay?", pt:'Você está me ouvindo bem?', core:'can you hear me'},
      {en:"Sorry, I'm having some connection issues.", pt:'Desculpa, estou com problema de conexão.', core:'connection issues'},
      {en:"Let me share my screen.", pt:'Deixa eu compartilhar minha tela.', core:'share my screen'}]},
    {step:'No meio', lines:[
      {en:"Sorry, you cut out for a second.", pt:'Desculpa, você cortou por um segundo.', core:'you cut out'},
      {en:"Could you repeat the last part?", pt:'Pode repetir a última parte?', core:'repeat the last part'},
      {en:"Just to make sure I understood, you need it by Friday?", pt:'Só para ter certeza que entendi, você precisa até sexta?', core:'make sure I understood'}]},
    {step:'Fechando', lines:[
      {en:"So, to sum up, we agreed on three things.", pt:'Então, resumindo, combinamos três coisas.', core:'to sum up'},
      {en:"I'll follow up by email.", pt:'Vou mandar um e-mail de acompanhamento.', core:"I'll follow up"},
      {en:"Thanks, everyone. Talk soon.", pt:'Obrigado, pessoal. Até mais.', core:'talk soon'}]}],
  hear:[
    {en:"You're on mute.", pt:'Você está no mudo.'},
    {en:"Can you see my screen?", pt:'Está vendo minha tela?'},
    {en:"You froze for a second.", pt:'Você congelou por um segundo.'},
    {en:"Let's give it a couple more minutes.", pt:'Vamos esperar mais uns minutos.'},
    {en:"I have a hard stop at three.", pt:'Tenho que sair às três em ponto.'}]},

{ id:'salario', lvl:'B2', tag:'No trabalho', title:'Negociar salário e proposta',
  brief:'Quem fala o primeiro número costuma ancorar a conversa. Se perguntarem sua pretensão, responda com uma faixa baseada em pesquisa de mercado. Agradeça a proposta antes de negociar — negociar não é ingratidão, é esperado.',
  steps:[
    {step:'Ganhando tempo', lines:[
      {en:"Thank you, I'm really excited about this offer.", pt:'Obrigado, estou muito animado com essa proposta.', core:'excited about this offer'},
      {en:"Could I have a couple of days to think it over?", pt:'Posso ter uns dias para pensar?', core:'think it over'},
      {en:"Could you walk me through the full package?", pt:'Pode me detalhar o pacote completo?', core:'the full package'}]},
    {step:'Pedindo mais', lines:[
      {en:"Based on my research, I was expecting something closer to ten thousand.", pt:'Pela minha pesquisa, eu esperava algo mais perto de dez mil.', core:'something closer to'},
      {en:"Is there any flexibility on the base salary?", pt:'Tem alguma flexibilidade no salário base?', core:'any flexibility on'},
      {en:"If we can meet there, I'm ready to sign.", pt:'Se a gente chegar nisso, eu assino.', core:"I'm ready to sign"}]},
    {step:'Alternativas', lines:[
      {en:"If the salary is fixed, could we talk about bonuses?", pt:'Se o salário é fixo, podemos falar de bônus?', core:'could we talk about'},
      {en:"Would remote days be an option?", pt:'Dias remotos seriam uma opção?', core:'be an option'},
      {en:"Could we review it after six months?", pt:'Podemos revisar depois de seis meses?', core:'review it after'}]}],
  hear:[
    {en:"What are your salary expectations?", pt:'Qual sua pretensão salarial?'},
    {en:"That's at the top of our range.", pt:'Isso está no topo da nossa faixa.'},
    {en:"Let me check with the team.", pt:'Deixa eu ver com o time.'},
    {en:"We can't move on salary, but we can offer more vacation.", pt:'Não dá para mexer no salário, mas podemos dar mais férias.'},
    {en:"We'd love to have you on board.", pt:'Adoraríamos ter você no time.'}]},

{ id:'opiniao', lvl:'B2', tag:'No trabalho', title:'Dar opinião, discordar e convencer',
  brief:'Discordar de forma direta é aceito, desde que você reconheça o ponto do outro antes. A estrutura que funciona: concordar com uma parte, apresentar o dado, sugerir o próximo passo.',
  steps:[
    {step:'Opinando', lines:[
      {en:"In my opinion, we should focus on existing clients.", pt:'Na minha opinião, devíamos focar nos clientes atuais.', core:'in my opinion'},
      {en:"The way I see it, price is the main issue.", pt:'Do jeito que eu vejo, o preço é o problema principal.', core:'the way I see it'},
      {en:"I'm fairly confident this will work.", pt:'Tenho bastante confiança de que isso vai funcionar.', core:"I'm fairly confident"}]},
    {step:'Discordando', lines:[
      {en:"I see your point, but the numbers say otherwise.", pt:'Entendo seu ponto, mas os números dizem o contrário.', core:'I see your point'},
      {en:"I'm not sure I agree with that.", pt:'Não sei se concordo com isso.', core:"I'm not sure I agree"},
      {en:"Can I offer a different perspective?", pt:'Posso dar outra perspectiva?', core:'a different perspective'}]},
    {step:'Convencendo', lines:[
      {en:"Let me give you an example.", pt:'Deixa eu dar um exemplo.', core:'let me give you an example'},
      {en:"What if we tried it for one month?", pt:'E se a gente testasse por um mês?', core:'what if we tried'},
      {en:"Can we agree on a next step?", pt:'Podemos combinar um próximo passo?', core:'agree on a next step'}]}],
  hear:[
    {en:"I hear you, but...", pt:'Te entendo, mas...'},
    {en:"That's a fair point.", pt:'É um ponto justo.'},
    {en:"Where's the data on that?", pt:'Onde estão os dados disso?'},
    {en:"Let me play devil's advocate.", pt:'Deixa eu fazer o advogado do diabo.'},
    {en:"I'm on the fence.", pt:'Estou em cima do muro.'}]},

{ id:'lideranca', lvl:'C1', tag:'No trabalho', title:'Conduzir reunião e dar feedback',
  brief:'Liderar em inglês é menos sobre vocabulário difícil e mais sobre controle da conversa: abrir com o objetivo, dar a palavra, cortar desvios com educação e fechar com responsáveis e prazos. Feedback segue o padrão situação, impacto, pedido.',
  steps:[
    {step:'Conduzindo', lines:[
      {en:"The goal of today's meeting is to make a decision on pricing.", pt:'O objetivo da reunião de hoje é decidir o preço.', core:"the goal of today's meeting"},
      {en:"Ana, I'd love to hear your take on this.", pt:'Ana, queria ouvir sua visão sobre isso.', core:'hear your take'},
      {en:"Let's park that for now and come back to it.", pt:'Vamos deixar isso de lado por ora e voltar depois.', core:"let's park that"}]},
    {step:'Dando feedback', lines:[
      {en:"Can I share some feedback on yesterday's call?", pt:'Posso dar um feedback sobre a chamada de ontem?', core:'share some feedback'},
      {en:"When the report was late, the client got frustrated.", pt:'Quando o relatório atrasou, o cliente ficou frustrado.', core:'the client got frustrated'},
      {en:"Going forward, could you flag delays earlier?", pt:'Daqui pra frente, pode avisar atrasos mais cedo?', core:'going forward'}]},
    {step:'Fechando', lines:[
      {en:"So who's taking ownership of this?", pt:'Então quem fica responsável por isso?', core:'taking ownership'},
      {en:"Let's aim to have it done by Thursday.", pt:'Vamos mirar em ter isso pronto até quinta.', core:"let's aim to"},
      {en:"Great discussion, everyone. Thanks.", pt:'Ótima discussão, pessoal. Obrigado.', core:'great discussion'}]}],
  hear:[
    {en:"Could you clarify what you mean by that?", pt:'Pode esclarecer o que quer dizer com isso?'},
    {en:"I'll take that as an action item.", pt:'Vou pegar isso como tarefa.'},
