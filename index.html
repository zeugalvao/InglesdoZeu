/* ---------------------------- MOTOR FONÉTICO (regras, sem IA) ---------------------------- */
const TH_VOICED = new Set(['the','this','that','these','those','they','them','their','there','then','than','though','although','other','another','mother','father','brother','together','either','neither','weather','whether','rather','breathe','with','without','they\'re','that\'s','there\'s']);
const H_SILENT  = new Set(['hour','hours','honest','honestly','honor','honour','heir']);
const NO_AE     = new Set(['want','was','what','watch','water','wash','all','call','walk','talk','small','ball','car','far','star','park','hard','part','start','are','war','warm','many','any','saw','law','father','half','can\'t','father\'s']);

const RULES = [
  { kind:'th', pri:1, why:'Ponta da língua entre os dentes e sopra. Não vira "f", nem "t", nem "d".',
    scan:(w)=>{ const i=w.toLowerCase().indexOf('th'); return i<0?null:{s:i,e:i+2,
      why: TH_VOICED.has(w.toLowerCase().replace(/[^a-z']/g,''))
        ? 'Língua entre os dentes COM voz, a garganta vibra. Não é "d" de "dia".'
        : 'Língua entre os dentes SEM voz, só sopro. Não é "t" nem "f".' }; } },

  { kind:'s + consoante', pri:2, why:'Comece direto no "s", sem colocar "i" na frente. É "street", não "istreet".',
    scan:(w)=>{ const l=w.toLowerCase(); return /^s[ptkmnlfwc]/.test(l) ? {s:0,e:2} : null; } },

  { kind:'vogal + r', pri:3, why:'A vogal se funde com o r americano: língua puxada para trás, sem bater no céu da boca. Nada de "r" de "carro" nem de "porta".',
    scan:(w)=>{ const l=w.toLowerCase().replace(/[^a-z']/g,'');
      const m=l.match(/(ear|ir|er|ur|or|ar)(?!r)(?=[^aeiouy]|$)/);
      if(!m) return null; if(m.index===0 && l.length<3) return null; return {s:m.index,e:m.index+m[0].length}; } },

  { kind:'æ', pri:4, why:'Boca bem aberta, som entre "a" e "é". "cat" não é "két" nem "cát".',
    scan:(w)=>{ const l=w.toLowerCase().replace(/[^a-z']/g,'');
      if(NO_AE.has(l)) return null;
      const m=l.match(/a(?=[bcdfgkmnpstvxz]([^aeiouy]|$))/); return m?{s:m.index,e:m.index+1}:null; } },

  { kind:'ɪ', pri:5, why:'"i" curto e frouxo, quase um "ê". "ship" e "sheep" são sons diferentes.',
    scan:(w)=>{ const l=w.toLowerCase().replace(/[^a-z']/g,'');
      if(/ee|ea|ie|igh|ind$|ild$|ime|ine$|ite$|ive$/.test(l)) return null;
      const m=l.match(/(^|[^aeiouy])i(?=[bcdfgklmnprstvxz]([^aeiouy]|$))/);
      if(!m) return null;
      const at = m.index + m[1].length;
      return {s:at, e:at+1}; } },

  { kind:'-ed', pri:6, why:'',
    scan:(w)=>{ const l=w.toLowerCase().replace(/[^a-z]/g,'');
      if(!/[a-z]{3,}ed$/.test(l)) return null;
      const prev=l[l.length-3];
      return {s:l.length-2,e:l.length,
        why: (prev==='t'||prev==='d')
          ? 'Aqui o -ed vira uma sílaba /id/: "wanted" é "uãn-tid".'
          : 'O -ed é UM som só (/t/ ou /d/), não uma sílaba. "asked" soa "askt".' }; } },

  { kind:'ŋ', pri:7, why:'Som nasal único, feito no fundo da boca. Não pronuncie o "g" separado.',
    scan:(w)=>{ const l=w.toLowerCase().replace(/[^a-z]/g,''); return /ing$/.test(l)&&l.length>4?{s:l.length-3,e:l.length}:null; } },

  { kind:'h', pri:8, why:'O "h" sopra de verdade, como quem embaça um vidro. Em português ele é mudo.',
    scan:(w)=>{ const l=w.toLowerCase().replace(/[^a-z']/g,'');
      if(H_SILENT.has(l)||!/^h[aeiou]/.test(l)) return null; return {s:0,e:1}; } },

  { kind:'r', pri:9, why:'"r" americano: língua enrolada para trás, sem raspar a garganta. Nada de "r" de "rato".',
    scan:(w)=>{ const l=w.toLowerCase(); return /^r[aeiouy]/.test(l)?{s:0,e:1}:null; } },

  { kind:'w', pri:10, why:'Bico de boca, sem encostar dente no lábio. "we" não pode virar "ve".',
    scan:(w)=>{ const l=w.toLowerCase(); return /^w[aeiouhr]/.test(l)?{s:0,e:1}:null; } },

  { kind:'final seco', pri:11, why:'Termine a palavra seca, sem "i" depois. "big" não é "bigui".',
    scan:(w)=>{ let l=w.toLowerCase().replace(/[^a-z']/g,'');
      if(l.length<3) return null;
      let end=l.length;
      if(l.endsWith('e')){ l=l.slice(0,-1); end--; }
      return /[bdgkpt]$/.test(l) ? {s:end-1,e:end} : null; } }
];

function soundMarks(text, max){
  max = max || 4;
  const found = [];
  const re = /[A-Za-z']+/g; let m;
  while((m = re.exec(text)) !== null){
    const word = m[0], off = m.index;
    for(const r of RULES){
      const hit = r.scan(word);
      if(!hit) continue;
      const s = off + hit.s, e = off + hit.e;
      if(e > off + word.length) continue;
      found.push({ start:s, end:e, kind:r.kind, pri:r.pri, why: hit.why || r.why, text:text.slice(s,e) });
    }
  }
  found.sort((a,b)=> a.pri - b.pri || a.start - b.start);
  const kept = [];
  for(const f of found){
    if(kept.length >= max) break;
    if(kept.some(k => f.start < k.end && f.end > k.start)) continue;
    if(kept.some(k => k.kind === f.kind)) continue;   // um exemplo por tipo de som
    kept.push(f);
  }
  return kept.sort((a,b)=>a.start-b.start);
}

/* ---------------------------- utilidades ---------------------------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function norm(s){ return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim(); }
function words(t){ return String(t).trim().split(/\s+/).filter(Boolean); }
function beatsOf(t){ return words(t).map(w=>({w, level: WEAK.has(w.toLowerCase().replace(/[^a-z']/g,''))?'weak':'strong'})); }
const CORE_SKIP = new Set(("i i'm im you he she it we they a an the is are am was were be do does did can could would will shall please sorry hi hello hey excuse me my your of to and but so just really very okay ok yeah").split(' '));

/* trecho curto e buscável: frases longas não acham vídeo no YouGlish */
function coreOf(t){
  const c = String(t).replace(/["“”.?!,;:]/g,'').trim();
  const w = c.split(/\s+/).filter(Boolean);
  if(w.length <= 4) return c;
  let ini = 0;
  while(ini < w.length-3 && CORE_SKIP.has(w[ini].toLowerCase())) ini++;
  return w.slice(ini, ini+4).join(' ');
}

/* palavra mais distintiva da frase — plano B quando a frase inteira não retorna vídeo */
function keyWord(t){
  const w = String(t).toLowerCase().replace(/[^a-z'\s]/g,' ').split(/\s+/).filter(Boolean);
  const cand = w.filter(x => x.length > 3 && !CORE_SKIP.has(x) && !WEAK.has(x));
  return cand.sort((a,b)=>b.length-a.length)[0] || w[w.length-1] || '';
}

function uid(){ return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function isoLocal(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function markedHTML(text){
  const marks = soundMarks(text);
  if(!marks.length) return esc(text);
  let out='',cur=0;
  marks.forEach(m=>{
    out += esc(text.slice(cur,m.start));
    out += `<mark class="mark" title="${esc(m.kind+': '+m.why)}">${esc(text.slice(m.start,m.end))}</mark>`;
    cur = m.end;
  });
  return out + esc(text.slice(cur));
}

/* palavras vazias que não devem valer ponto na busca */
const PT_STOP = new Set(('a o as os um uma uns umas de do da dos das em no na nos nas por para pra com sem que se e ou mas ao aos eu tu ele ela nos voce voces eles elas meu minha seu sua isso isto aquilo lhe me te ja ainda mais menos muito como quando onde qual quais e é ser estar ter fazer').split(' '));

/* peso por raridade (IDF): palavra comum vale pouco, palavra específica vale muito */
const DF = {};
INDEX.forEach(it=>{
  new Set(norm(it.pt||'').split(' ')).forEach(w=>{ if(w.length>2) DF[w]=(DF[w]||0)+1; });
});
const NDOCS = INDEX.length;
function idf(t){ return Math.log(NDOCS / (1 + (DF[t]||0))) + 0.4; }

/* busca no banco embutido + no que o usuário já salvou */
function search(q){
  const n = norm(q); if(n.length < 3) return [];
  const terms = n.split(' ').filter(t=>t.length>2 && !PT_STOP.has(t));
  if(!terms.length) return [];

  const peso = terms.map(idf);
  const total = peso.reduce((a,b)=>a+b, 0);

  const pool = INDEX.concat(state.phrases.map(p=>({en:p.text, pt:p.source, core:p.core, kit:'sua coleção', mine:true})));
  const seen = new Set();

  return pool.map(it=>{
    const hpt = norm(it.pt||''), hen = norm(it.en||'');
    let ganho = 0;
    terms.forEach((t,i)=>{
      if(hpt.includes(t))      ganho += peso[i];
      else if(hen.includes(t)) ganho += peso[i] * 0.4;
    });
    const ratio = total ? ganho / total : 0;
    let sc = ratio * 100;
    if(hpt === n)            sc += 200;   // idêntica
    else if(hpt.includes(n)) sc += 60;    // frase inteira contida
    return {...it, sc, ratio};
  }).filter(it=>{
    if(it.ratio < 0.55) return false;     // os termos que importam precisam bater
    const k = it.en.toLowerCase(); if(seen.has(k)) return false; seen.add(k); return true;
  }).sort((a,b)=>b.sc-a.sc).slice(0,6);
}

/* tradutores automáticos devolvem lixo: tags <g id="1">, entidades HTML, aspas sobrando */
function cleanMT(s){
  return String(s||'')
    .replace(/<[^>]*>/g,'')
    .replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&apos;/g,"'")
    .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&nbsp;/g,' ')
    .replace(/\s+/g,' ')
    .replace(/\s+([.,!?;:])/g,'$1')
    .replace(/^["“”'`\s]+|["“”'`\s]+$/g,'')
    .trim();
}

function withTimeout(p, ms){
  return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error('tempo esgotado')), ms))]);
}

/* heurística: o texto parece português? */
function looksPortuguese(t){
  const l = ' ' + t.toLowerCase() + ' ';
  if(/[ãõçáéíóúâêô]/.test(l)) return true;
  const pt = [' eu ',' que ',' não ',' nao ',' como ',' onde ',' quero ',' pode ',' você ',' voce ',' uma ',' meu ',' minha ',' pra ',' para ',' com ',' está ',' esta ',' isso ',' fazer ',' tem '];
  const en = [' the ',' you ',' can ',' could ',' would ',' please ',' what ',' where ',' i ',' my ',' is ',' are ',' do ',' to '];
  const ps = pt.filter(w=>l.includes(w)).length, es = en.filter(w=>l.includes(w)).length;
  return ps >= es;
}

/* traduz, gravando no cache local para nunca repetir a chamada */
async function translateOnline(text){
  const key = norm(text);
  if(state.cache[key]) return { en: state.cache[key].en, src: state.cache[key].src + ' · do cache' };

  const tgt = state.accent === 'en-GB' ? 'en-GB' : 'en-US';
  const erros = [];
  for(const p of PROVIDERS){
    try{
      const out = await withTimeout(p.run(text, tgt), 8000);
      const en = cleanMT(out);
      if(en){
        state.cache[key] = { en, src:p.label, t:Date.now() };
        logEvent('translate', text + ' → ' + en);
        save();
        return { en, src:p.label };
      }
    }catch(e){ erros.push(p.label + ': ' + (e.message||'falhou')); }
  }
  throw new Error(erros.join(' | ') || 'nenhum serviço respondeu');
}

let voices=[];
function loadVoices(){
  if(!('speechSynthesis' in window)) return;
  voices=speechSynthesis.getVoices()||[];
  const w=document.getElementById('voice-warn');
  if(voices.length && !voices.some(v=>/^en/i.test(v.lang))){
    w.hidden=false; w.textContent='Nenhuma voz em inglês instalada aqui — os vídeos continuam funcionando.';
  } else w.hidden=true;
}
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
else { const w=document.getElementById('voice-warn'); w.hidden=false; w.textContent='Este navegador não fala em voz alta — use os links de vídeo.'; }
function pickVoice(lang){
  const ex=voices.filter(v=>v.lang.replace('_','-')===lang);
  if(ex.length) return ex.find(v=>v.localService)||ex[0];
  return voices.filter(v=>/^en/i.test(v.lang))[0]||null;
}
let sweep=null;
function clearSweep(){ clearInterval(sweep); sweep=null; document.querySelectorAll('.beat--on').forEach(b=>b.classList.remove('beat--on')); }
function say(text, rate, stripId){
  if(!('speechSynthesis' in window)||!text) return;
  speechSynthesis.cancel(); clearSweep();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=state.accent; u.rate=rate;
  const v=pickVoice(state.accent); if(v) u.voice=v;
  const strip=stripId?document.querySelectorAll(`[data-beats="${stripId}"] .beat`):[];
  let ok=false;
  if(strip.length){
    u.onboundary=e=>{
      if(e.name&&e.name!=='word') return;
      ok=true; clearInterval(sweep);
      const b=text.slice(0,e.charIndex).trim();
      const i=b?b.split(/\s+/).length:0;
      strip.forEach((x,j)=>x.classList.toggle('beat--on',j===i));
    };
    u.onstart=()=>{ let i=0; sweep=setInterval(()=>{
      if(ok){ clearInterval(sweep); return; }
      strip.forEach((x,j)=>x.classList.toggle('beat--on',j===i));
      if(++i>=strip.length) clearInterval(sweep);
    },340/rate); };
  }
  u.onend=u.onerror=clearSweep;
  speechSynthesis.speak(u);
  logEvent('play', text); save();
}
function speakPhrase(p,rate){ say(p.text,rate,p.id); p.plays=(p.plays||0)+1; renderStats(); }

/* --------- busca de vídeo: termos alternativos + player embutido --------- */
function videoTerms(p){
  const core = p.core || coreOf(p.text);
  const kw   = keyWord(p.text);
  const full = String(p.text).replace(/["“”.?!,;:]/g,'').trim();
  const out  = [];
  const push = (label, term) => {
    term = String(term||'').trim();
    if(term && !out.some(o=>o.term.toLowerCase()===term.toLowerCase())) out.push({label, term});
  };
  push('frase inteira', full);
  push('trecho curto', core);
  push('só “'+kw+'”', kw);
  return out;
}

/* ---- player do YouGlish: script oficial de incorporação ---- */
let ygWidget = null;
let ygState = 'idle';   // idle | carregando | pronto | falhou
function loadYG(cb){
  let respondido = false;
  const responde = ok => { if(!respondido){ respondido = true; cb(ok); } };
  if(window.YG){ ygState='pronto'; return responde(true); }
  if(ygState === 'falhou') return responde(false);

  if(ygState !== 'carregando'){
    ygState = 'carregando';
    const s = document.createElement('script');
    s.src = 'https://youglish.com/public/emb/widget.js';
    s.charset = 'utf-8';
    s.onerror = ()=>{ ygState='falhou'; };
    document.head.appendChild(s);
  }
  const t0 = Date.now();
  const espera = setInterval(()=>{
    if(window.YG){ clearInterval(espera); ygState='pronto'; responde(true); }
    else if(ygState==='falhou' || Date.now()-t0 > 8000){ clearInterval(espera); ygState='falhou'; responde(false); }
  }, 200);
}

function videoFalhou(motivo, termo){
  const msg = document.getElementById('vid-msg'), box = document.getElementById('yg-box'),
        note = document.getElementById('vid-note');
  if(msg) msg.innerHTML = 'Não deu para mostrar aqui dentro';
  if(box) box.innerHTML = `<div class="vid__fail">
      <p class="vid__failt">O player não pôde ser embutido</p>
      <p class="vid__faild">${esc(motivo)}. Os links abrem normalmente numa aba nova — é o mesmo conteúdo.</p>
      <div class="acts acts--bare" style="justify-content:center">
        <a class="act act--main" href="${ygURL(termo)}" target="_blank" rel="noopener">Abrir o YouGlish ↗</a>
        <a class="act" href="${ppURL(termo)}" target="_blank" rel="noopener">Abrir o PlayPhrase ↗</a>
      </div></div>`;
  if(note) note.textContent = 'Dica: no YouGlish, a seta para baixo pula para o próximo falante.';
}

function wireVideo(){
  if(!state.video || !state.video.open) return;
  const termo = state.video.term;
  const frase = (find(state.video.id)||{}).text || termo;
  const box = document.getElementById('yg-box');
  if(!box) return;

  const A = state.auto;
  const MAXV = 3, REPS = 3, PAUSA = 2600;
  A.on = true; A.rep = 1; A.seen = 0; A.total = 0; A.fim = false; A.skipped = 0; A.waiting = false;
  clearTimeout(A.timer);
  const msg    = ()=>document.getElementById('vid-msg');
  const status = ()=>document.getElementById('auto-status');
  const NAO_EN = /[؀-ۿݐ-ݿ֐-׿Ѐ-ӿऀ-ॿ฀-๿぀-ヿ㐀-鿿가-힯]/;

  function pintaProg(){
    document.querySelectorAll('#vprog [data-vv]').forEach((v,i)=>{
      const n = i < A.seen ? REPS : i === A.seen && !A.fim ? A.rep-1 : 0;
      v.classList.toggle('vprog__v--on', i===A.seen && !A.fim);
      v.querySelectorAll('i').forEach((d,j)=>d.classList.toggle('on', j<n));
    });
  }
  function pintaStatus(txt){
    const s = status(); if(!s) return;
    s.textContent = txt || (A.fim ? '' : `vídeo ${A.seen+1} de ${MAXV} · repetição ${A.rep} de ${REPS}${A.waiting?' · sua vez: repita em voz alta':''}`);
    pintaProg();
  }
  function acabou(w, motivo){
    A.fim = true; clearTimeout(A.timer);
    try{ w && w.pause(); }catch(e){}
    pintaStatus(motivo || `Pronto: ${A.seen} vídeo${A.seen===1?'':'s'} × ${REPS} repetições. O vídeo ficou pausado.`);
    const n = document.getElementById('vid-next');
    if(n) n.innerHTML = `<div class="handoff">
      <p class="handoff__t">${A.seen>=MAXV?'Shadowing com vídeos concluído 🎉':'Acabaram os vídeos disponíveis'}</p>
      <p class="handoff__d">Agora grave a sua versão logo abaixo e compare com o que você ouviu.</p>
      <div class="acts acts--bare" style="justify-content:center"><button class="act" id="auto-restart">↺ Ver de novo</button></div></div>`;
    const r = document.getElementById('auto-restart');
    if(r) r.onclick = ()=>{ state.video = {id:state.video.id, term:termo, open:true}; render(); };
  }
  function proximo(w){
    A.rep = 1; A.waiting = false;
    if(A.total && A.seen + A.skipped >= A.total) return acabou(w);
    try{ w.next(); }catch(e){ return acabou(w); }
    pintaStatus();
  }
  /* terminou a frase: pausa, dá tempo para repetir, depois repete ou passa para o próximo vídeo */
  function aoTerminarFrase(w){
    if(A.fim || A.waiting) return;
    clearTimeout(A.timer);
    try{ w.pause(); }catch(e){}
    if(typeof countPlay === 'function') countPlay(frase);
    A.waiting = true; pintaStatus();
    A.timer = setTimeout(()=>{
      A.waiting = false;
      if(A.rep < REPS){ A.rep++; try{ w.replay(); }catch(e){} pintaStatus(); return; }
      A.seen++;
      if(A.seen >= MAXV) return acabou(w);
      proximo(w);
    }, PAUSA);
  }

  loadYG(ok=>{
    if(!ok || !window.YG){ videoFalhou('o script do YouGlish não carregou', termo); return; }
    let respondeu = false;
    try{
      const w = new window.YG.Widget('yg-box', {
        width: box.clientWidth || 620,
        components: 9,
        restrictionMode: 1,
        events: {
          onFetchDone: e => {
            respondeu = true;
            A.total = (e && typeof e.totalResult === 'number') ? e.totalResult : 0;
            const m = msg(); if(m){
              m.innerHTML = A.total === 0
                ? 'Nenhum vídeo com “'+esc(termo)+'”. Tente um termo mais curto acima.'
                : 'Vídeos de pessoas falando inglês ('+(dial()==='uk'?'Reino Unido':'EUA')+')';
            }
            if(A.total === 0) acabou(w, 'Nenhum vídeo encontrado para esse termo.'); else pintaStatus();
          },
          onVideoChange: () => { A.rep = 1; A.waiting = false; clearTimeout(A.timer); if(!A.fim) pintaStatus(); },
          onCaptionChange: e => {
            if(A.fim || !e || !e.caption) return;
            if(NAO_EN.test(e.caption)){ A.skipped++; clearTimeout(A.timer); pintaStatus('Pulei um vídeo que não era em inglês…'); proximo(w); }
          },
          onCaptionConsumed: () => aoTerminarFrase(w),
          onError: () => videoFalhou('o player retornou um erro', termo)
        }
      });
      ygWidget = w;
      w.fetch(termo, 'english', dial());
      setTimeout(()=>{ if(!respondeu && !box.querySelector('iframe,div,video'))
        videoFalhou('o player não respondeu a tempo', termo); }, 9000);
      const sk = document.getElementById('vid-skip');
      if(sk) sk.onclick = ()=>{ if(A.fim) return; A.skipped++; clearTimeout(A.timer); proximo(w); };
      const ag = document.getElementById('vid-again');
      if(ag) ag.onclick = ()=>{ if(A.fim) return; clearTimeout(A.timer); A.waiting=false; try{ w.replay(); }catch(e){} pintaStatus(); };
    }catch(err){
      videoFalhou('o player não inicializou', termo);
      return;
    }
    pintaStatus();
  });
}

function histHTML(){
  const N=30, base=new Date(), days=[];
  for(let i=N-1;i>=0;i--){ const d=new Date(base); d.setDate(d.getDate()-i); days.push(isoLocal(d)); }
  const counts={}; state.log.forEach(e=>{ counts[e.d]=(counts[e.d]||0)+1; });
  const max=Math.max(1,...days.map(d=>counts[d]||0));
  const top=[...state.phrases].sort((a,b)=>(b.plays||0)-(a.plays||0)).filter(p=>p.plays).slice(0,8);
  const last=[...state.phrases].slice(0,8);
  const total=state.log.filter(e=>e.kind==='play').length;

  return `<section class="hist">
    <h2 class="hist__t">Seu histórico</h2>
    <p class="hist__d">${total} repetições registradas · ${streak()} dias seguidos de treino · tudo guardado só aqui no aparelho.</p>
    <div class="days">${days.map(d=>{
      const c=counts[d]||0, h=c?Math.max(6,Math.round(c/max*70)):3;
      const cls = c===0?'':(c>=max*0.6?'day--top':'day--hot');
      return `<div class="day ${cls}" style="height:${h}px" title="${d}: ${c} ações"></div>`;
    }).join('')}</div>
    <div class="days__ax"><span>30 dias atrás</span><span>hoje</span></div>
    <div class="hist__grid">
      <div><p class="hist__h">Mais praticadas</p>${
        top.length? top.map((p,i)=>`<div class="rank"><span class="rank__n">${String(i+1).padStart(2,'0')}</span><span>${esc(p.text)}</span><span class="rank__c">${p.plays}×</span></div>`).join('')
        : '<p class="hist__d">Ainda nenhuma. Aperte ouvir em alguma frase.</p>'}</div>
      <div><p class="hist__h">Últimas adicionadas</p>${
        last.length? last.map(p=>`<div class="rank"><span>${esc(p.text)}</span></div>`).join('')
        : '<p class="hist__d">Sua coleção está vazia.</p>'}</div>
    </div>
  </section>`;
}

/* Enter / botão: se tem inglês digitado, salva. Se tem sugestão boa, usa. Senão traduz online. */
async function go(){
  const pt=document.getElementById('in-pt'), en=document.getElementById('in-en');
  if(en.value.trim()) return saveTyped();
  const src = pt.value.trim();
  if(!src) return;

  const hits = search(src);
  if(hits.length && hits[0].sc >= 130){ state.sugg=hits; renderSugg(); return pickSugg(0); }
  if(hits.length){ state.sugg=hits; renderSugg(); }

  if(!looksPortuguese(src)){
    en.value = src; pt.value='';
    state.tStatus='Isso já parece inglês — salvei como está.';
    return saveTyped(src);
  }

  state.tBusy=true; state.tStatus='procurando tradução online…'; renderCompose();
  document.getElementById('in-pt').value = src;
  try{
    const r = await translateOnline(src);
    state.tBusy=false;
    const novo = keep(r.en, src, coreOf(r.en), 'traduzido por '+r.src);
    state.tStatus = novo
      ? 'Traduzido por '+r.src+' e salvo. Se não soar natural, use ✎ Editar no cartão.'
      : 'Essa frase já estava na sua coleção.';
    state.sugg=[]; save(); render();
    const f=document.getElementById('in-pt'); if(f){ f.value=''; f.focus(); }
  }catch(err){
    state.tBusy=false;
    state.tStatus='Nenhum serviço de tradução respondeu ('+String(err.message).slice(0,90)+'). Escreva o inglês no campo ao lado.';
    renderCompose();
    document.getElementById('in-pt').value=src;
    document.getElementById('in-en').focus();
  }
}

function saveTyped(srcOverride){
  const pt=document.getElementById('in-pt'), en=document.getElementById('in-en');
  const e=en.value.trim(), p=(srcOverride!==undefined?srcOverride:pt.value.trim());
  if(!e) return;
  keep(e, p, coreOf(e), p?'traduzida':'sua frase');
  pt.value=''; en.value=''; state.sugg=[]; state.tStatus=''; save(); render();
  const f=document.getElementById('in-pt'); if(f) f.focus();
}
function renderSugg(){
  const el=document.getElementById('sugg'); if(!el) return;
  if(!state.sugg.length){ el.innerHTML=''; return; }
  el.innerHTML=`<div class="sugg"><p class="sugg__l">No banco de frases</p>${
    state.sugg.map((s,i)=>`<button data-pick="${i}">
      <span class="sugg__en">${esc(s.en)}</span><br><span class="sugg__pt">${esc(s.pt)} · ${esc(s.kit)}</span>
    </button>`).join('')}</div>`;
  el.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>pickSugg(+b.dataset.pick));
}
function pickSugg(i){
  const s=state.sugg[i]; if(!s) return;
  keep(s.en, s.pt, s.core, s.kit && !s.mine ? ('banco: '+s.kit) : '');
  state.sugg=[]; save();
  const pt=document.getElementById('in-pt'); if(pt) pt.value='';
  render();
}

function renderKits(){
  const tags=['todos', ...Array.from(new Set(KITS.map(k=>k.tag)))];
  const list = state.tag==='todos' ? KITS : KITS.filter(k=>k.tag===state.tag);
  view.innerHTML = `
    <div class="chips">${tags.map(t=>`<button class="chip" data-tag="${esc(t)}" aria-pressed="${state.tag===t}">${esc(t)}</button>`).join('')}</div>
    <div class="list">${list.map(k=>`<article class="card">
      <p class="card__source">${esc(k.tag)}</p>
      <p class="card__text">${esc(k.title)}</p>
      <p class="card__note">${esc(k.brief.split('.')[0])}.</p>
      <div class="acts">
        <button class="act act--main" data-openkit="${k.id}">Abrir kit · ${k.steps.reduce((a,s)=>a+s.lines.length,0)+ (k.hear?k.hear.length:0)} frases</button>
      </div></article>`).join('')}</div>`;
  view.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{ state.tag=b.dataset.tag; renderKits(); });
}

function render(){
  renderBrand(); renderStats(); renderLogoPick(); renderCompose();
  if(['hoje','tri','rev','con','conta','prof'].includes(state.mode)){ renderMetodo(); return; }

  if(state.mode==='his'){ view.innerHTML=histHTML(); return; }

  if(state.mode==='sit'){
    if(state.kit){ const k=KITS.find(x=>x.id===state.kit); if(k){ view.innerHTML=kitHTML(k); return; } }
    renderKits(); return;
  }

  const list=visible();
  if(!state.phrases.length){
    view.innerHTML=`<div class="empty">
      <h2>Sua coleção está vazia</h2>
      <p>Busque em português no campo acima, ou abra a aba Situações e salve as frases de um kit inteiro de uma vez.</p>
      <button class="btn btn--ghost" id="goto-sit">Ver as situações</button></div>`;
    document.getElementById('goto-sit').onclick=()=>document.getElementById('m-sit').click();
    return;
  }

  if(state.mode==='tra'){
    if(!list.length){ view.innerHTML=`<div class="empty"><h2>Nada para treinar</h2><p>Tudo dominado. Troque o filtro ou salve frases novas.</p></div>`; return; }
    if(state.idx>=list.length) state.idx=0;
    const p=list[state.idx];
    view.innerHTML=`<section class="card train">
      <p class="train__pos">${state.idx+1} de ${list.length} · espaço ouve, setas navegam</p>
      ${cardHTML(p,true)}
      <div class="train__nav">
        <button class="act" data-nav="-1">← Anterior</button>
        <button class="act" data-nav="1">Próxima →</button>
        <button class="act" data-shuffle="1">↯ Embaralhar</button>
      </div></section>`;
    wireVideo();
    return;
  }
  view.innerHTML=`<div class="list">${list.map(p=>
    `<article class="card ${p.known?'card--known':''}">${cardHTML(p,false)}</article>`).join('')}</div>`;
  wireVideo();
}

/* ---------------------------- ações ---------------------------- */
function keep(en, pt, core, note){
  if(!en || isSaved(en)) return false;
  state.phrases.unshift({ id:uid(), text:en.trim(), source:(pt||'').trim(), core:core||coreOf(en),
    note:note||'', beats:beatsOf(en), known:false, plays:0, added:Date.now(), stage:0, due:today() });
  logEvent('add', en);
  return true;
}

view.addEventListener('click', e=>{
  const t=e.target.closest('[data-say],[data-sayraw],[data-del],[data-known],[data-nav],[data-shuffle],[data-keep],[data-keepall],[data-openkit],[data-backkits],[data-edit],[data-editsave],[data-editcancel],[data-vterm],[data-vopen],[data-vclose]');
  if(!t) return;
  if(t.dataset.vterm){ state.video={id:t.dataset.vid, term:t.dataset.vterm, open:!!(state.video&&state.video.open)};
    if(!state.video.open) state.video={id:t.dataset.vid, term:t.dataset.vterm, open:false};
    render(); return; }
  if(t.dataset.vopen){ state.video={id:t.dataset.vopen, term:t.dataset.vterm2, open:true}; render(); return; }
  if(t.dataset.vclose){ clearTimeout(state.auto.timer); ygWidget=null; state.video=null; render(); return; }
  if(t.dataset.edit){ state.editing=t.dataset.edit; render();
    const i=document.getElementById('ed-in'); if(i){ i.focus(); i.select(); } return; }
  if(t.dataset.editcancel){ state.editing=null; render(); return; }
  if(t.dataset.editsave){
    const p=find(t.dataset.editsave), v=document.getElementById('ed-in').value.trim();
    if(p && v){ p.text=v; p.core=coreOf(v); p.beats=beatsOf(v); p.note='corrigida por você'; logEvent('edit', v); }
    state.editing=null; save(); render(); return;
  }
  if(t.dataset.say)      return speakPhrase(find(t.dataset.say), parseFloat(t.dataset.rate));
  if(t.dataset.sayraw)   return say(t.dataset.sayraw, 1, null);
  if(t.dataset.openkit){ state.kit=t.dataset.openkit; save(); render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(t.dataset.backkits){ state.kit=null; save(); render(); return; }
  if(t.dataset.del){ state.phrases=state.phrases.filter(p=>p.id!==t.dataset.del); save(); render(); return; }
  if(t.dataset.known){ const p=find(t.dataset.known); p.known=!p.known; p.stage=p.known?4:0; p.due=p.known?addDays(SRS_INT[4]):today(); save(); render(); return; }
  if(t.dataset.keep){ keep(t.dataset.keep, t.dataset.pt, t.dataset.core, 'banco de situações'); save(); render(); return; }
  if(t.dataset.keepall){
    const k=KITS.find(x=>x.id===t.dataset.keepall); if(!k) return;
    let n=0; k.steps.forEach(s=>s.lines.forEach(x=>{ if(keep(x.en,x.pt,x.core,'kit: '+k.title)) n++; }));
    save(); render(); return;
  }
  if(t.dataset.nav){ const n=visible().length; state.idx=(state.idx + +t.dataset.nav + n)%n; render(); return; }
  if(t.dataset.shuffle){ state.phrases.sort(()=>Math.random()-.5); state.idx=0; save(); render(); return; }
});

function group(ids,fns){
  ids.forEach((id,i)=>{ document.getElementById(id).onclick=()=>{
    ids.forEach(o=>document.getElementById(o).setAttribute('aria-pressed', o===id?'true':'false')); fns[i]();
  };});
}
const MODE_BTNS=['m-hoje','m-tri','m-rev','m-col','m-sit','m-tra','m-his','m-con'];
group(MODE_BTNS,[
  ()=>{state.mode='hoje';render();},
  ()=>{state.mode='tri';render();},
  ()=>{state.mode='rev';state.rv=null;render();},
  ()=>{state.mode='col';state.editing=null;render();},
  ()=>{state.mode='sit';state.editing=null;render();},
  ()=>{state.mode='tra';state.idx=0;render();},
  ()=>{state.mode='his';render();},
  ()=>{state.mode='con';render();}]);
group(['a-us','a-uk'],[()=>{state.accent='en-US';render();},()=>{state.accent='en-GB';render();}]);
group(['f-all','f-lea'],[()=>{state.filter='all';state.idx=0;render();},()=>{state.filter='lea';state.idx=0;render();}]);

document.getElementById('logo-btn').onclick=()=>{ state.showLogo=!state.showLogo; state.showCfg=false; renderLogoPick(); window.scrollTo({top:0,behavior:'smooth'}); };
document.getElementById('cfg-btn').onclick=()=>{ state.showCfg=!state.showCfg; state.showLogo=false; renderLogoPick(); window.scrollTo({top:0,behavior:'smooth'}); };
document.getElementById('export').onclick=()=>{
  const txt=state.phrases.map(p=>[p.source||'—','→',p.text, p.note?('  ['+p.note+']'):''].join(' ')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));
  a.download='ingles-do-zeu.txt'; a.click();
};
document.getElementById('wipe').onclick=async()=>{
  state.phrases=[]; state.log=[]; state.cache={}; state.kit=null; state.idx=0; state.profile=null; state.days={}; state.fabDone={}; state.rv=null; state.fab=null; state.game=newGame();
  await store.del(KEY); render();
};
document.addEventListener('keydown', e=>{
  if(e.target.id==='ed-in' && e.key==='Enter'){
    const b=document.querySelector('[data-editsave]'); if(b) b.click(); return;
  }
  if(e.target.tagName==='INPUT'||state.mode!=='tra') return;
  const list=visible(); if(!list.length) return;
  if(e.code==='Space'){ e.preventDefault(); speakPhrase(list[state.idx],1); }
  if(e.code==='ArrowRight'){ state.idx=(state.idx+1)%list.length; render(); }
  if(e.code==='ArrowLeft'){ state.idx=(state.idx-1+list.length)%list.length; render(); }
});

</script>

function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return isoLocal(d); }
function lvlIdx(l){ return Math.max(0, LVLS.indexOf(l)); }
function dayNum(){ return Math.floor(new Date(today()+'T12:00:00').getTime()/86400000); }
function pickDay(arr, off){ return arr && arr.length ? arr[((dayNum()+(off||0))%arr.length+arr.length)%arr.length] : null; }
function isWeekend(){ const g=new Date().getDay(); return g===0||g===6; }
function curLvl(){ return state.profile ? state.profile.level : 'A2'; }
function trackLvl(l){ return l==='A1' ? 'A2' : l; }
function fill(frame, x){ return frame.replace('___', x); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

/* ---------------- dias, minutos, horas ---------------- */
function dayRec(d){ d=d||today(); if(!state.days[d]) state.days[d]={done:{}, min:0, ext:0}; return state.days[d]; }
function totalMin(){ return Object.values(state.days).reduce((a,r)=>a+(r.min||0)+(r.ext||0),0); }
function hoursDone(){ const p=state.profile; if(!p) return 0; return p.base + Math.max(0,totalMin()-(p.minAtPlace||0))/60; }
function missionsToday(){ const k=RITMOS[(state.profile&&state.profile.ritmo)||'padrao'].k, L=lvlIdx(curLvl());
  return MISSIONS.filter(m=>m.r.includes(k) && (!m.weekend||isWeekend()) && (!m.minLvl||L>=lvlIdx(m.minLvl)) && (!m.maxLvl||L<=lvlIdx(m.maxLvl))); }
function mMin(m){ return (state.profile && state.profile.ritmo==='intenso' && m.minI) ? m.minI : m.min; }
function metaMin(){ return missionsToday().filter(m=>!m.weekend).reduce((a,m)=>a+mMin(m),0); }
function avgDaily(){
  let s=0, n=0;
  for(let i=1;i<=14;i++){ const r=state.days[addDays(-i)]; if(r){ const v=(r.min||0)+(r.ext||0); s+=v; if(v>0) n++; } }
  return n>=5 ? s/14 : metaMin()*6/7;
}
function eta(){
  const p=state.profile; const rest=(CUM[p.goal]-hoursDone())*60;
  if(rest<=0) return {txt:'meta atingida', sub:'refaça o teste de nível'};
  const avg=Math.max(5, avgDaily()); const days=Math.ceil(rest/avg);
  const d=new Date(); d.setDate(d.getDate()+days);
  const txt = days<60 ? `~${Math.round(days/7)} semanas` : `~${Math.round(days/30)} meses`;
  return {txt, sub:`${p.goal} por volta de ${MESES[d.getMonth()]}/${d.getFullYear()}`};
}
function markDone(id, val){
  const r=dayRec(), m=MISSIONS.find(x=>x.id===id); if(!m) return;
  if(val && !r.done[id]){ r.done[id]=true; r.min+=mMin(m); logEvent('mission', m.t); }
  else if(!val && r.done[id]){ delete r.done[id]; r.min=Math.max(0, r.min-mMin(m)); }
  save();
}

/* ---------------- teste de nível ---------------- */
function startPlace(){
  const p=state.profile;
  state.place={ ans:(p&&p.answers)?p.answers.slice():CANDO.map(()=>null), goal:p?p.goal:'B2', ritmo:p?p.ritmo:'padrao' };
}
function computePlace(){
  const A=state.place.ans; let level='C1', partial=false;
  for(const l of LVLS){
    const ix=CANDO.map((c,i)=>c.lvl===l?i:-1).filter(i=>i>=0);
    const yes=ix.filter(i=>A[i]===1).length;
    if(yes<ix.length){ level=l; partial=yes>0; break; }
  }
  const li=lvlIdx(level), prev=li>0?CUM[LVLS[li-1]]:0;
  const base = prev + (partial ? (CUM[level]-prev)/2 : 0);
  let goal=state.place.goal; if(lvlIdx(goal)<=li) goal=LVLS[Math.min(4,li+1)];
  state.profile={ level, goal, ritmo:state.place.ritmo, base, minAtPlace:totalMin(), answers:A.slice(), at:today() };
  state.placing=false; state.place=null; logEvent('place', level); save();
}

/* ---------------- revisão espaçada ---------------- */
function dueList(){ const t=today(); return state.phrases.filter(p=>(p.due||t)<=t); }
function startReview(ctx, extra){
  let ids;
  if(extra){ ids=shuffle(state.phrases.filter(p=>(p.due||today())>today())).slice(0,10).map(p=>p.id); }
  else ids=dueList().sort((a,b)=>(a.stage||0)-(b.stage||0)).slice(0,25).map(p=>p.id);
  state.rv={ctx, q:ids, i:0, shown:false, ok:0};
}
function nextIntervalLabel(p, g){
  const s=p.stage||0;
  if(g===0) return 'hoje à noite';
  const ns = g===1 ? Math.max(1,s) : Math.min(5, s+(g===2?1:2));
  const d=SRS_INT[ns]; return d===1?'amanhã':d+' dias';
}
function grade(g){
  const R=state.rv; const p=find(R.q[R.i]); if(!p) return;
  let s=p.stage||0;
  if(g===0){ s=0; p.due=today(); }
  else { s = g===1 ? Math.max(1,s) : Math.min(5, s+(g===2?1:2)); p.due=addDays(SRS_INT[s]); R.ok++; }
  p.stage=s; p.known = s>=4; logEvent('review', p.text);
  R.i++; R.shown=false;
  if(R.i>=R.q.length && MISSIONS.some(m=>m.id===R.ctx)) markDone(R.ctx, true);
  save();
}
function reviewHTML(ctx){
  if(!state.phrases.length) return `<div class="empty" style="margin:0"><h2>Nada para revisar ainda</h2>
    <p>As frases entram aqui quando você salva. Comece pela Fábrica de frases ou abra um kit na Trilha.</p>
    <button class="btn btn--ghost" data-gomode="tri">Abrir a trilha</button></div>`;
  if(!state.rv || state.rv.ctx!==ctx) startReview(ctx);
  const R=state.rv;
  if(!R.q.length){
    const prox=state.phrases.map(p=>p.due).filter(Boolean).sort()[0];
    return `<div class="drill"><p class="drill__q">Nada vencido agora ✓</p>
      <p class="sec__d" style="margin-top:8px">${prox?'Próxima revisão marcada para '+prox.split('-').reverse().slice(0,2).join('/')+'.':''} Revisar antes da hora não é proibido, só rende menos.</p>
      <div class="acts acts--bare" style="margin-top:12px"><button class="act" data-rvextra="${esc(ctx)}">Revisar 10 adiantadas</button></div></div>`;
  }
  if(R.i>=R.q.length){
    return `<div class="drill"><p class="drill__pos">Sessão completa</p>
      <p class="drill__q">${R.ok} de ${R.q.length} lembradas</p>
      <p class="sec__d" style="margin-top:8px">As que você errou voltam ainda hoje. As outras foram empurradas para mais longe — esse é o espaçamento trabalhando.</p>
      <div class="acts acts--bare" style="margin-top:12px"><button class="act" data-rvrestart="${esc(ctx)}">Revisar de novo o que venceu</button></div></div>`;
  }
  const p=find(R.q[R.i]); if(!p){ R.i++; return reviewHTML(ctx); }
  const hasPt = p.source && p.source!==p.text;
  return `<div class="drill">
    <div class="drill__top"><p class="drill__pos" style="margin:0">${R.i+1} de ${R.q.length} · nível ${p.stage||0} de 5</p>${maosHTML()}</div>
    ${hasPt ? `<p class="drill__ask">Como você diria em inglês? Fale em voz alta antes de ver.</p><p class="drill__q">${esc(p.source)}</p>`
            : `<p class="drill__ask">Leia em voz alta e lembre o que significa.</p><p class="drill__q">${markedHTML(p.text)}</p>`}
    ${!R.shown ? `<div class="acts acts--bare" style="margin-top:16px">
        <button class="act act--main" data-rvshow="1">Mostrar resposta</button>
        ${listenBtn('rv', p.text)}</div>${listenOut('rv')}`
      : `<div class="drill__a">
        ${hasPt ? `<p class="drill__q">${markedHTML(p.text)}</p>` : `<p class="drill__q" style="font-size:20px">${esc(p.source||'(sem tradução salva)')}</p>`}
        <div class="acts acts--bare" style="margin-top:10px">
          <button class="act" data-say="${p.id}" data-rate="1">▶ Ouvir</button>
          <button class="act" data-say="${p.id}" data-rate="0.6">▶ Devagar</button>
          ${listenBtn('rv', p.text)}</div>${listenOut('rv')}
        <div class="grades">${[['Errei',0],['Difícil',1],['Lembrei',2],['Fácil',3]].map(([l,g])=>
          `<button class="grade ${g===0?'grade--bad':''}" data-grade="${g}">${l}<small>${nextIntervalLabel(p,g)}</small></button>`).join('')}</div>
      </div>`}
  </div>`;
}

/* ---------------- reconhecimento de voz ---------------- */
const SRec = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog=null, recogKey=null;
function listenBtn(key, target){
  if(!SRec) return '';
  return `<button class="act" data-listen="${esc(key)}" data-target="${esc(target||'')}">🎤 ${target?'Falar e conferir':'Falar e transcrever'}</button>`;
}
function listenOut(key){ const m=(typeof scMem!=='undefined'&&scMem[key])||''; return SRec ? `<div class="${m&&scCls[key]?scCls[key]:'sc'}" id="sc-${esc(key)}">${m}</div>` : ''; }
function toks(s){ return String(s).toLowerCase().replace(/[’]/g,"'").replace(/[^a-z0-9'\s]/g,' ').split(/\s+/).filter(Boolean); }
function cmpSpeech(t, s){
  const tw=toks(t), pool=toks(s);
  const marks=tw.map(w=>{ const i=pool.indexOf(w); if(i>=0){ pool.splice(i,1); return {w,ok:true}; } return {w,ok:false}; });
  return { marks, said:s, score: tw.length ? marks.filter(m=>m.ok).length/tw.length : 0 };
}
/* ---------------- microfone: um uso por vez + mensagens claras ---------------- */
function micHelp(tipo){
  if(tipo==='busy') return `<p class="sc__l"><b>O microfone estava ocupado.</b> Pode ser a gravação, uma ligação ou outro app usando o microfone (WhatsApp, assistente de voz). Feche o outro uso e toque de novo.</p>`;
  if(tipo==='none') return `<p class="sc__l"><b>Não encontrei um microfone</b> neste aparelho.</p>`;
  if(tipo==='net') return `<p class="sc__l"><b>O reconhecimento de voz precisa de internet.</b> Confira a conexão e toque de novo.</p>`;
  return `<div class="sc__l"><b>O navegador bloqueou o microfone para o app.</b> Para liberar:
    <ol class="michelp"><li><b>App instalado (Android):</b> segure o ícone do app → <b>Informações do app</b> (ⓘ) → <b>Permissões</b> → <b>Microfone</b> → <b>Permitir</b>.</li>
    <li><b>No Chrome:</b> toque no ícone à esquerda do endereço → <b>Permissões</b> → <b>Microfone</b> → <b>Permitir</b>.</li>
    <li>Feche o app por completo e abra de novo.</li></ol></div>`;
}
async function micBloqueado(){
  try{ const p=await navigator.permissions.query({name:'microphone'}); return p.state==='denied'; }catch(e){ return true; }
}
let listenSess=null;
/* junta os pedaços sem repetir: o Android às vezes devolve o texto anterior junto com o novo */
function mergeSeg(segs, t){
  t=String(t||'').trim(); if(!t) return;
  const nw=s=>String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9'\s]/g,' ').replace(/\s+/g,' ').trim();
  const last=segs[segs.length-1]||'', nl=nw(last), nt=nw(t);
  if(!nt) return;
  if(last && nt.startsWith(nl)){ segs[segs.length-1]=t; return; }
  if(last && (nl.endsWith(nt) || nl===nt)) return;
  const all=nw(segs.join(' ')).split(' ').filter(Boolean), tw=t.split(/\s+/), twn=nt.split(' ');
  if(all.length && nw(segs.join(' ')).endsWith(nt)) return;
  let k=Math.min(all.length, twn.length);
  while(k>0 && all.slice(-k).join(' ')!==twn.slice(0,k).join(' ')) k--;
  if(k>=2 || (k>=1 && twn.length===k)){ const rest=tw.slice(k).join(' '); if(rest) segs.push(rest); return; }
  segs.push(t);
}
function stopListen(){ if(listenSess) listenSess.finish('other'); }
function runListen(btn){
  const key=btn.dataset.listen, target=btn.dataset.target, out=document.getElementById('sc-'+key);
  if(listenSess && listenSess.key===key){ listenSess.finish('user'); return; }
  if(listenSess) listenSess.finish('other');
  if(mediaRec){ try{ mediaRec.stop(); }catch(e){} setTimeout(()=>runListen(btn), 450); return; }
  const label = btn.dataset.label || btn.textContent; btn.dataset.label = label;
  const S={ key, target, segs:[], interim:'', t0:Date.now(), last:Date.now(), done:false, inst:null, best:null, passed:null, passAt:(+btn.dataset.pass||0.85), cum:btn.dataset.cum==='1' };
  listenSess=S;
  const IDLE = target ? 9000 : 15000, MAX = target ? 60000 : 240000;
  btn.classList.add('act--live');
  btn.textContent = '■ Parar · pode pausar, eu espero';
  const tick=setInterval(()=>{ if(S.done) return; const n=Date.now(); if(n-S.last>IDLE || n-S.t0>MAX) S.finish('idle'); }, 400);

  function paint(){
    if(!out || S.done) return;
    if(target){
      const cum=cmpSpeech(target, (S.segs.join(' ')+' '+S.interim).trim());
      const tudo = cum.score>=S.passAt && !S.passed;
      out.className='sc sc--live';
      out.innerHTML=`<p class="sc__v">🎙️ Ouvindo… pode falar em pedaços</p>
        <p>${cum.marks.map(m=>`<span class="sc__w sc__w--${m.ok?'ok':'todo'}">${esc(m.w)}</span>`).join('')}</p>
        ${S.segs.length||S.interim?`<p class="sc__l" style="margin-top:6px">Pedaços: ${S.segs.map(s=>`“${esc(s)}”`).join(' · ')}${S.interim?` <i>${esc(S.interim)}…</i>`:''}</p>`:'<p class="sc__l" style="margin-top:6px">Fale no seu ritmo. Pausas não cortam.</p>'}
        ${tudo?'<p class="sc__hint">Você já falou todas as partes! Agora diga a frase inteira de uma vez.</p>':''}`;
    } else {
      const txt=(S.segs.join(' ')+' '+S.interim).trim();
      out.className='sc sc--live';
      out.innerHTML=`<p class="sc__v">🎙️ Ouvindo… pode pausar, eu espero</p>
        <p class="sc__said">${esc(S.segs.join(' '))}${S.interim?` <i>${esc(S.interim)}</i>`:''}</p>
        <p class="sc__l">${words(txt).length} palavras · toque em Parar quando terminar</p>`;
    }
  }
  function finalize(why){
    if(!out) return;
    if(target){
      if(!S.segs.length){ out.className='sc'; out.innerHTML='<p class="sc__l">Não captei sua voz. Toque e fale de novo.</p>'; return; }
      const best = S.passed || S.best;
      const cum = cmpSpeech(target, S.segs.join(' '));
      const pct = Math.round(best.score*100);
      let v, cls;
      if(S.passed){ v=/^mq/.test(key)?'Frase completa! ✓':'Mandou bem'; cls='ok'; }
      else if(cum.score>=S.passAt){ v='Todas as partes certas 👏 Falta juntar: toque e diga a frase inteira de uma vez'; cls='mid'; }
      else if(pct>=60){ v='Quase lá'; cls='mid'; }
      else { v='Ainda não — ouça e tente de novo'; cls='no'; }
      const marks = S.passed ? best.marks : cum.marks;
      out.className='sc sc--'+cls;
      out.innerHTML=`<p class="sc__v">${S.passed?pct+'% · ':''}${v}</p>
        <p>${marks.map(m=>`<span class="sc__w sc__w--${m.ok?'ok':'no'}">${esc(m.w)}</span>`).join('')}</p>
        <p class="sc__l" style="margin-top:6px">O que eu entendi: ${S.passed?`“${esc(best.said)}”`:S.segs.map(s=>`“${esc(s)}”`).join(' · ')}</p>`;
      scCls[key]=out.className; scMem[key]=out.innerHTML;
      logEvent('speak', target);
      const sc = S.passed ? best.score : Math.min(best.score, S.passAt-0.01);
      if(window.onSpeakScore) onSpeakScore(sc);
      if(window.onSpeakPass) onSpeakPass(key, sc);
      if(window.onSpeakPassApp) onSpeakPassApp(key, Math.max(sc, cum.score>=0.85?0.6:0), target);
    } else {
      const txt=S.segs.join(' ').trim();
      out.className='sc';
      out.innerHTML = txt ? `<p class="sc__l">O que o reconhecimento entendeu · ${words(txt).length} palavras</p><p class="sc__said">${esc(txt)}</p>`
                          : '<p class="sc__l">Não captei sua voz. Toque e fale de novo.</p>';
      if(txt && window.onTranscribe) onTranscribe(key, txt);
    }
  }
  S.finish=(why, errHtml)=>{
    if(S.done) return; S.done=true; clearInterval(tick);
    if(listenSess===S) listenSess=null;
    const r=S.inst; S.inst=null; if(recog===r){ recog=null; recogKey=null; }
    try{ r && r.abort(); }catch(e){}
    btn.textContent=label; btn.classList.remove('act--live');
    if(errHtml && out){ out.className='sc'; out.innerHTML=errHtml; }
    else if(why!=='other') finalize(why);
    save();
  };
  function onSeg(alts){
    S.last=Date.now();
    if(target){
      const sc=alts.map(a=>cmpSpeech(target,a)).sort((x,y)=>y.score-x.score)[0];
      mergeSeg(S.segs, sc.said);
      if(!S.best || sc.score>S.best.score) S.best=sc;
      if(sc.score>=S.passAt){ S.passed=sc; S.finish('pass'); return; }
      if(S.cum){ const c=cmpSpeech(target, S.segs.join(' ')); if(c.score>=S.passAt){ S.passed=c; S.finish('pass'); return; } }
    } else {
      mergeSeg(S.segs, alts[0]);
      if(window.onTranscribe) onTranscribe(key, S.segs.join(' '));
    }
    paint();
  }
  function startInst(){
    const r=new SRec(); S.inst=r; recog=r; recogKey=key;
    r.lang=state.accent; r.continuous=false; r.interimResults=true; r.maxAlternatives=3;
    r.onresult=e=>{
      if(S.done || S.inst!==r) return;
      let interim='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const res=e.results[i];
        if(res.isFinal){ const alts=Array.from(res).map(a=>String(a.transcript||'').trim()).filter(Boolean); if(alts.length){ onSeg(alts); if(S.done) return; } }
        else interim+=res[0].transcript;
      }
      if(interim) S.last=Date.now();
      S.interim=interim.trim(); paint();
    };
    r.onerror=async e=>{
      if(S.done || S.inst!==r) return;
      if(e.error==='no-speech' || e.error==='aborted') return;
      if(e.error==='not-allowed'||e.error==='service-not-allowed') S.finish('error', micHelp(await micBloqueado() ? 'blocked' : 'busy'));
      else if(e.error==='audio-capture') S.finish('error', micHelp('busy'));
      else if(e.error==='network') S.finish('error', micHelp('net'));
    };
    r.onend=()=>{ if(S.done || S.inst!==r) return; S.interim=''; setTimeout(()=>{ if(!S.done && S.inst===r) startInst(); }, 150); };
    try{ r.start(); }catch(e){ S.finish('error', micHelp('busy')); }
  }
  paint();
  startInst();
}

/* ---------------- gravador ---------------- */
const recs={}; let mediaRec=null, mrKey=null, mrT0=0, mrTick=null;
function recHTML(key, opts){ return `<div class="rec" data-recbox="${esc(key)}" data-max="${(opts&&opts.max)||0}" data-dl="${(opts&&opts.dl)||''}">${recInner(key)}</div>`; }
function recInner(key){
  const box=document.querySelector(`[data-recbox="${key}"]`);
  const dl = box ? box.dataset.dl : '';
  const live = mrKey===key;
  if(!(navigator.mediaDevices && window.MediaRecorder)) return '<span class="sc__l">Este navegador não grava áudio.</span>';
  return `<button class="act ${live?'act--live':''}" data-rec="${esc(key)}">${live?'■ Parar':'● Gravar minha voz'}</button>
    ${live?`<span class="rec__t" id="rect-${esc(key)}">0s</span>`:''}
    ${recs[key]&&!live?`<audio controls src="${recs[key]}"></audio>${dl?`<a class="act" download="${esc(dl)}" href="${recs[key]}">Baixar</a>`:''}`:''}`;
}
function paintRec(key){ const b=document.querySelector(`[data-recbox="${key}"]`); if(b) b.innerHTML=recInner(key); }
async function toggleRec(key){
  if(mediaRec){ const same=mrKey===key; mediaRec.stop(); if(same) return; }
  if(listenSess){ stopListen(); await new Promise(r=>setTimeout(r,400)); }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const chunks=[]; const mr=new MediaRecorder(stream); mediaRec=mr; mrKey=key; mrT0=Date.now();
    mr.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
    mr.onstop=()=>{ stream.getTracks().forEach(t=>t.stop()); clearInterval(mrTick);
      if(recs[key]) URL.revokeObjectURL(recs[key]);
      recs[key]=URL.createObjectURL(new Blob(chunks,{type:mr.mimeType||'audio/webm'}));
      const dur=(Date.now()-mrT0)/1000;
      if(mediaRec===mr){ mediaRec=null; mrKey=null; } logEvent('record', key); save(); paintRec(key); if(window.onRecorded) onRecorded(key, dur); };
    mr.start(); paintRec(key);
    const box=document.querySelector(`[data-recbox="${key}"]`); const max=box?+box.dataset.max:0;
    clearInterval(mrTick);
    mrTick=setInterval(()=>{ const s=Math.round((Date.now()-mrT0)/1000); const el=document.getElementById('rect-'+key);
      if(el) el.textContent=s+'s'; if(max && s>=max && mediaRec===mr) mr.stop(); },500);
  }catch(e){
    mediaRec=null; mrKey=null;
    const b=document.querySelector(`[data-recbox="${key}"]`);
    const tipo = e && (e.name==='NotReadableError'||e.name==='AbortError'||e.name==='TrackStartError') ? 'busy'
      : e && (e.name==='NotFoundError'||e.name==='DevicesNotFoundError') ? 'none'
      : (await micBloqueado()) ? 'blocked' : 'busy';
    if(b) b.innerHTML=`<div class="sc">${micHelp(tipo)}</div><button class="act" data-rec="${esc(key)}">● Tentar gravar de novo</button>`;
  }
}

function sentencesOf(t){ return String(t).split(/[.!?\n]+/).map(s=>s.trim()).filter(s=>words(s).length>=3); }

let recT=null;
document.addEventListener('input', e=>{

document.addEventListener('click', e=>{
  const f=e.target.closest('[data-recframe]');
  if(f){ const ta=document.getElementById('rec-txt'); if(!ta) return; const frame=f.dataset.recframe;
    const pos=frame.indexOf('___'); const base=ta.value.trim(); const pre=base?(base+(/[.!?]$/.test(base)?' ':'. ')):'';

});

/* ---------------- escuta repetida ---------------- */
let escTok=0, escTimer=null;
function escKit(){
  const L=lvlIdx(curLvl());
  const ks=KITS.filter(k=>lvlIdx(k.lvl)<=Math.max(L,1));
  const same=ks.filter(k=>k.lvl===trackLvl(curLvl()));
  return pickDay(dayNum()%2 && same.length ? same : ks) || KITS[0];
}
function escLines(k){ const out=[]; (k.hear||[]).forEach(x=>out.push(x)); k.steps.forEach(s=>s.lines.forEach(x=>out.push(x))); return out.slice(0,6); }
function stopEsc(){ escTok++; clearTimeout(escTimer); if('speechSynthesis' in window) speechSynthesis.cancel();
  document.querySelectorAll('.row--on').forEach(r=>r.classList.remove('row--on')); }
function escPlay(){
  if(!('speechSynthesis' in window)) return;
  stopEsc(); const tok=++escTok;
  const L=escLines(escKit()); let lap=0, i=0;
  const st=()=>document.getElementById('esc-st');
  const hi=n=>document.querySelectorAll('[data-escl]').forEach(r=>r.classList.toggle('row--on', +r.dataset.escl===n));
  const next=()=>{
    if(tok!==escTok) return;
    if(i>=L.length){ i=0; lap++;
      if(lap>=state.esc.reps){ hi(-1); const s=st(); if(s) s.textContent='Fim das voltas. Agora toque em Mostrar texto e escreva cada frase 3 vezes.'; gain(8,'escuta completa'); return; } }
    hi(i);
    const s=st(); if(s) s.textContent=`volta ${lap+1} de ${state.esc.reps}${lap===0?' · só ouvindo':lap===state.esc.reps-1?' · repita junto (shadowing)':' · ouvindo de novo'} · frase ${i+1} de ${L.length}`;
    const u=new SpeechSynthesisUtterance(L[i].en); u.lang=state.accent; u.rate=state.esc.rate;
    const v=pickVoice(state.accent); if(v) u.voice=v;
    let fired=false; const go=()=>{ if(fired||tok!==escTok) return; fired=true; i++; escTimer=setTimeout(next, lap===state.esc.reps-1?2600:1300); };
    u.onend=go; u.onerror=go; speechSynthesis.speak(u); if(typeof countPlay==='function') countPlay(L[i].en);
  };
  logEvent('listen', 'escuta'); save();
  next();
}
function escRowHTML(x, i){
  const k=normT(x.en), dp=dayRec().plays||{}, wr=dayRec().writes||{};
  const n=Math.min(3,dp[k]||0), w=Math.min(3,wr[k]||0), open=n>=3;
  return `<div class="row esc-row ${open?'':'esc-lock'}" data-escl="${i}">
    <button class="row__play" data-sayraw="${esc(x.en)}" aria-label="Ouvir">▶</button>
    <div class="row__body">
      ${open?`<p class="row__en esc-txt">${esc(x.en)}</p><p class="row__pt esc-txt">${esc(x.pt||'')}</p>`
            :`<p class="row__en esc-lockmsg">🔒 Ouça ${3-n}× mais para ver esta frase</p>`}
      ${open?`<div class="wr">${w>=3?'<span class="wr__ok">✍️ Escrita 3× ✓</span>'

function paintEsc(){
  const box=document.getElementById('esc-box'); if(!box) return;
  const L=escLines(escKit()), dp=dayRec().plays||{};
  box.querySelectorAll('.esc-lock').forEach(row=>{
    const i=+row.dataset.escl, x=L[i]; if(!x) return;
    const n=Math.min(3,dp[normT(x.en)]||0);
    if(n>=3){ const on=row.classList.contains('row--on'); row.outerHTML=escRowHTML(x,i); if(on){ const r=box.querySelector(`[data-escl="${i}"]`); if(r) r.classList.add('row--on'); } }
    else { const m=row.querySelector('.esc-lockmsg'); if(m) m.textContent=`🔒 Ouça ${3-n}× mais para ver esta frase`; }
  });
}
function normW(s){ return String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9'\s]/g,' ').replace(/\s+/g,' ').trim(); }
function checkWrite(i){
  const L=escLines(escKit()), x=L[i]; if(!x) return;
  const inp=document.querySelector(`[data-wr="${i}"]`), fb=document.getElementById('wrfb-'+i); if(!inp) return;
  const typed=inp.value.trim(); if(!typed) return;
  if(normW(typed)===normW(x.en)){
    const r=dayRec(); if(!r.writes) r.writes={}; const k=normT(x.en); r.writes[k]=Math.min(3,(r.writes[k]||0)+1);
    gain(2,'frase escrita'); save();
    const row=document.querySelector(`[data-escl="${i}"]`);
    if(r.writes[k]>=3){ if(row) row.outerHTML=escRowHTML(x,i); if(typeof paintPlays==='function') paintPlays(); }
    else { inp.value=''; inp.placeholder=`Escreva a frase (${r.writes[k]+1} de 3)`; if(fb){ fb.className='wr__fb wr__fb--ok'; fb.textContent=`✓ Certo! ${r.writes[k]} de 3`; } inp.focus(); }
    if(typeof checkTasks==='function') checkTasks();
  } else {
    const tw=toks(x.en), got=toks(typed), pool=got.slice();
    const marks=tw.map(w=>{ const j=pool.indexOf(w); if(j>=0){ pool.splice(j,1); return `<span class="sc__w sc__w--ok">${esc(w)}</span>`; } return `<span class="sc__w sc__w--no">${esc(w)}</span>`; }).join('');
    if(fb){ fb.className='wr__fb wr__fb--no'; fb.innerHTML=`Quase. Confira as palavras em vermelho: ${marks}`; }
  }
}

function podPhrase(force){
  const r=dayRec(); let p=!force && r.pod && find(r.pod); if(p) return p;
  const cand=state.phrases.filter(x=>!x.known && x.id!==r.pod);
  if(cand.length) p = force ? cand[Math.floor(Math.random()*cand.length)] : pickDay(cand);
  else {
    const lines=escKit().steps.flatMap(s=>s.lines).filter(x=>!isSaved(x.en));
    const x=(force?lines[Math.floor(Math.random()*lines.length)]:pickDay(lines,3)) || escKit().steps[0].lines[0];
    keep(x.en, x.pt, x.core, 'frase do dia'); p=state.phrases.find(q=>q.text===x.en);
  }
  r.pod=p.id; save(); return p;
}

function maosLivres(key){
  if(!state.maos || !SRec) return;

    if(c && !c.hidden){ if(++n<60) setTimeout(go,800); return; }

function fabAdvance(ok){
  const F=state.fab; if(!F || F.i>=F.order.length) return;
  if(ok) F.ok++; gain(ok?4:1,'fábrica de frases'); F.i++; F.shown=false; scMem.fab=''; logEvent('fab', F.pid);
  if(F.i>=F.order.length){
    state.fabDone[F.pid]=(state.fabDone[F.pid]||0)+1; gain(10,'rodada completa'); { const rr=dayRec(); rr.rounds=(rr.rounds||0)+1; }
    cloudEvent('fabrica','Rodada completa: '+(PATTERNS.find(p=>p.id===F.pid)||{}).en,10);
  }
  save(); render(); if(typeof checkTasks==='function') checkTasks();
  if(F.i<F.order.length) maosLivres('fab');
}
function nextPat(pid){
  const L=PATTERNS.find(p=>p.id===pid); const lvl=L?L.lvl:trackLvl(curLvl());
  const list=PATTERNS.filter(p=>p.lvl===lvl); const i=list.findIndex(p=>p.id===pid);
  for(let k=1;k<=list.length;k++){ const c=list[(i+k)%list.length]; if((state.fabDone[c.id]||0)<3) return c.id; }
  return list[(i+1)%list.length].id;
}

      if(out) out.insertAdjacentHTML('beforeend','<p class="sc__go">✓ Acertou! Indo para a próxima…</p>');
      clearTimeout(passTimer); const F=state.fab, at=F.i;
      passTimer=setTimeout(()=>{ if(state.fab===F && F.i===at) fabAdvance(true); }, 1300);
    } else if(score>=0.6 && !state.fab.shown){
      state.fab.shown=true; render();
    }
    return;
  }
  if(key==='rv' && state.rv && state.rv.i<state.rv.q.length){
    if(score>=0.85){
      if(out) out.insertAdjacentHTML('beforeend','<p class="sc__go">✓ Lembrou! Indo para a próxima…</p>');
      clearTimeout(passTimer); const R=state.rv, at=R.i;
      passTimer=setTimeout(()=>{ if(state.rv===R && R.i===at){ grade(2); scMem.rv=''; render(); if(R.i<R.q.length) maosLivres('rv'); } }, 1300);
    } else if(score>=0.6 && !state.rv.shown){
      state.rv.shown=true; render();
    }
  }
};

/* ---------------- cronômetro das missões ---------------- */
let lastAct=Date.now(), tickN=0;
['pointerdown','keydown','touchstart','scroll'].forEach(ev=>document.addEventListener(ev, ()=>{ lastAct=Date.now(); }, {passive:true}));
function fmtT(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function secsOf(id){ const r=dayRec(); return (r.secs&&r.secs[id])||0; }
function timerTarget(){
  if(!state.profile) return null;
  const ms=missionsToday(), has=id=>ms.some(m=>m.id===id);
  if(state.mode==='hoje' && state.open && has(state.open)) return state.open;
  if(state.mode==='tri' && state.triPat && state.triOpen && has('fabrica')) return 'fabrica';
  if(state.mode==='rev'){ const r=dayRec(); if(!r.done.rev1 || !has('rev2')) return 'rev1'; return 'rev2'; }
  return null;
}
function timerHTML(id){
  const m=MISSIONS.find(x=>x.id===id); if(!m) return '';
  const tot=mMin(m)*60, s=Math.min(secsOf(id),tot), done=!!dayRec().done[id];
  return `<div class="tmr ${done?'tmr--done':''}" data-tmr="${id}">
    <div class="tmr__row"><span>⏱ <b>${esc(m.t)}</b> · ${esc(m.slot.toLowerCase())}</span>
      <span class="tmr__txt">${done?'✓ missão concluída hoje — pode continuar treinando':`<b class="tmr__v">${fmtT(s)}</b> de ${fmtT(tot)} · faltam <b class="tmr__l">${fmtT(tot-s)}</b>`}</span></div>
    <div class="tmr__bar"><span style="width:${done?100:(s/tot*100).toFixed(1)}%"></span></div>
    ${done?'':'<small class="tmr__st">conta enquanto você pratica · pausa sozinho depois de 1 min parado</small>'}
  </div>`;
}
function paintTimer(id){
  const m=MISSIONS.find(x=>x.id===id); if(!m) return;
  const tot=mMin(m)*60, s=Math.min(secsOf(id),tot), idle=Date.now()-lastAct>60000;
  document.querySelectorAll(`[data-tmr="${id}"]`).forEach(el=>{
    const v=el.querySelector('.tmr__v'), l=el.querySelector('.tmr__l'), b=el.querySelector('.tmr__bar span'), st=el.querySelector('.tmr__st');
    if(v) v.textContent=fmtT(s); if(l) l.textContent=fmtT(tot-s); if(b) b.style.width=(s/tot*100).toFixed(1)+'%';
    if(st) st.textContent = idle ? '⏸ pausado — toque em qualquer lugar ou fale para continuar' : 'contando · pausa sozinho depois de 1 min parado';
    el.classList.toggle('tmr--pause', idle);
  });
  document.querySelectorAll(`[data-mmin="${id}"]`).forEach(el=>{ el.textContent=`${Math.floor(s/60)}/${mMin(m)} min`; });
}
setInterval(()=>{
  const id=timerTarget(); if(!id) return;
  if(recog || mediaRec || (window.speechSynthesis && speechSynthesis.speaking)) lastAct=Date.now();
  const r=dayRec(); if(r.done[id]) return;
  if(document.visibilityState!=='visible' || Date.now()-lastAct>60000){ paintTimer(id); return; }
  if(!r.secs) r.secs={};
  r.secs[id]=(r.secs[id]||0)+1;
  const m=MISSIONS.find(x=>x.id===id);
  if(r.secs[id]>=mMin(m)*60){
    completeMission(id);
    document.querySelectorAll(`[data-tmr="${id}"]`).forEach(el=>{ el.outerHTML=timerHTML(id); });
    return;
  }
  paintTimer(id);
  if(++tickN%20===0) save();
}, 1000);

/* ---------------- render e eventos ---------------- */
function setModeBtn(mode){
  const map={con:'m-con',hoje:'m-hoje',tri:'m-tri',rev:'m-rev',col:'m-col',sit:'m-sit',tra:'m-tra',his:'m-his'};
  MODE_BTNS.forEach(id=>document.getElementById(id).setAttribute('aria-pressed', id===map[mode]?'true':'false'));
}
function renderMetodo(){
  if(state.mode==='hoje'){
    view.innerHTML = (state.profile && !state.placing) ? hojeHTML() : placeHTML();
    if(state.open==='shadow') wireVideo();
    return;
  }
  if(state.mode==='rev'){ view.innerHTML=revModeHTML(); return; }
  if(state.mode==='tri'){ view.innerHTML=triHTML(); return; }
}
function scrollTo$(id){ const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); }

view.addEventListener('click', async e=>{
  const t=e.target.closest('[data-mdone],[data-mopen],[data-cando],[data-goal],[data-pritmo],[data-placego],[data-placecancel],[data-replace],[data-ritmo],[data-ext],[data-rvshow],[data-grade],[data-rvextra],[data-rvrestart],[data-listen],[data-rec],[data-fabshow],[data-fabgrade],[data-fabpick],[data-fabagain],[data-fabown],[data-escplay],[data-escstop],[data-esctxt],[data-escreps],[data-escrate],[data-podnext],[data-miss],[data-vsave],[data-trilvl],[data-tripat],[data-trikit],[data-gomode],[data-maos],[data-fabnext]');
  if(!t) return; const d=t.dataset;

  if(d.mdone){
    const id=d.mdone, v = d.force ? true : !dayRec().done[id];
    markDone(id, v);
    if(d.force){ if(id==='escuta') stopEsc();
      const nx=missionsToday().find(m=>!dayRec().done[m.id]); state.open = nx ? nx.id : null; state.rv=null; state.fab=null; }
    render(); if(d.force && state.open) scrollTo$('mis-'+state.open); return;
  }
  if(d.mopen){ if(state.open==='escuta') stopEsc(); state.open = state.open===d.mopen ? null : d.mopen; state.rv=null; render();
    if(state.open) scrollTo$('mis-'+state.open); return; }

  if(d.cando!==undefined){ state.place.ans[+d.cando]=+d.v; render(); return; }
  if(d.goal){ state.place.goal=d.goal; render(); return; }
  if(d.pritmo){ state.place.ritmo=d.pritmo; render(); return; }
  if(d.placego){ computePlace(); state.open=null; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(d.placecancel){ state.placing=false; state.place=null; render(); return; }
  if(d.replace){ state.placing=true; startPlace(); state.mode='hoje'; setModeBtn('hoje'); render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(d.ritmo){ state.profile.ritmo=d.ritmo; save(); render(); return; }
  if(d.ext){ dayRec().ext += +d.ext; logEvent('ext', d.ext+' min'); gain(Math.round(d.ext/2),'prática fora do app'); save(); render(); return; }

  if(d.rvshow){ state.rv.shown=true; render(); const p=find(state.rv.q[state.rv.i]); if(p) say(p.text,1,null); return; }
  if(d.grade!==undefined){ clearTimeout(passTimer); grade(+d.grade); scMem.rv=''; render(); maosLivres('rv'); return; }
  if(d.rvextra){ startReview(d.rvextra, true); render(); return; }
  if(d.rvrestart){ startReview(d.rvrestart); render(); return; }

  if(d.listen){ runListen(t); return; }
  if(d.rec){ toggleRec(d.rec); return; }

  if(d.fabshow){ state.fab.shown=true; render(); const pat=PATTERNS.find(p=>p.id===state.fab.pid);
    say(fill(pat.en, pat.slots[state.fab.order[state.fab.i]].en), 1, null); return; }
  if(d.fabgrade!==undefined){ clearTimeout(passTimer); fabAdvance(+d.fabgrade===1); return; }
  if(d.maos){ setMaos(!state.maos); render(); if(state.maos){ const k=state.mode==='rev'||state.open==='rev1'||state.open==='rev2'?'rv':'fab'; maosLivres(k); } return; }
  if(d.fabnext){ const nx=nextPat(d.fabnext); state.fab=null; scMem.fab='';
    if(state.mode==='tri') state.triPat=nx; else state.fabPid=nx; render(); maosLivres('fab'); return; }
  if(d.fabpick){ state.fabPid=d.fabpick; state.fab=null; scMem.fab=''; render(); return; }
  if(d.fabagain){ state.fab=null; scMem.fab=''; render(); maosLivres('fab'); return; }
  if(d.fabown){ const inp=document.getElementById('fab-own'), msg=document.getElementById('fab-msg'); const v=(inp&&inp.value||'').trim();
    if(!v) return; const pat=PATTERNS.find(p=>p.id===d.fabown);
    const ok=keep(v, '', coreOf(v), 'criada por você · '+pat.en); if(ok) gain(8,'frase criada por você'); save(); renderStats(); say(v,1,null);
    if(msg) msg.textContent = ok ? 'Salva. Ela vai aparecer na sua revisão.' : 'Essa já estava na coleção.'; inp.value=''; return; }

  if(d.escplay){ escPlay(); return; }
  if(d.escstop){ stopEsc(); const s=document.getElementById('esc-st'); if(s) s.textContent='Parado.'; return; }
  if(d.esctxt){ state.esc.show=!state.esc.show; const b=document.getElementById('esc-box'); if(b) b.classList.toggle('esc--hide', !state.esc.show); t.textContent=state.esc.show?'Ocultar texto':'Mostrar texto'; return; }
  if(d.escreps){ state.esc.reps=+d.escreps; stopEsc(); render(); return; }
  if(d.escrate){ state.esc.rate=+d.escrate; stopEsc(); render(); return; }

  if(d.podnext){ state.video=null; podPhrase(true); render(); return; }
  if(d.miss){ addMissing(); return; }
  if(d.vsave){ const inp=document.getElementById('vid-in'), st=document.getElementById('vid-st'); const v=(inp&&inp.value||'').trim(); if(!v) return;
    const ok=keep(v, '', coreOf(v), 'ouvida em vídeo'); save(); renderStats(); if(st) st.textContent= ok?'Salva na coleção e na revisão.':'Essa já estava salva.'; inp.value=''; return; }

  if(d.trilvl){ state.triLvl=d.trilvl; state.triPat=null; state.fab=null; scMem.fab=''; render(); return; }
  if(d.tripat){ state.triPat=d.tripat; state.fab=null; scMem.fab=''; render(); const el=document.getElementById('tri-drill'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  if(d.trikit){ state.mode='sit'; state.kit=d.trikit; setModeBtn('sit'); save(); render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(d.gomode){ state.mode=d.gomode; setModeBtn(d.gomode); render(); return; }
});

view.addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  if(e.target.id==='miss-in'){ e.preventDefault(); addMissing(); }
  if(e.target.id==='fab-own'){ e.preventDefault(); const b=document.querySelector('[data-fabown]'); if(b) b.click(); }
  if(e.target.id==='vid-in'){ e.preventDefault(); const b=document.querySelector('[data-vsave]'); if(b) b.click(); }
});


</script>
<script>
/* ==================================================================
   GAMIFICAÇÃO — XP, patentes, conquistas, escudos, baú, certificados
   ================================================================== */
function newGame(){ return { xp:0, xpDays:{}, badges:{}, shields:0, shieldDays:{}, shieldMark:'', chests:{}, certs:[],
  theme:'padrao', bestSpeak:0, recs:0, bestStreak:0, cap:null, outbox:[], nome:'', rankSeen:0 }; }
state.game = newGame();

const RANKS=[
  {xp:0,     n:'Novato',              ic:'🌱', r:'Começo da jornada'},
  {xp:300,   n:'Curioso',             ic:'🔎', r:'+1 escudo de sequência'},
  {xp:1000,  n:'Explorador',          ic:'🧭', r:'Tema Oceano'},
  {xp:2500,  n:'Conversador',         ic:'💬', r:'Tema Vinho'},
  {xp:5000,  n:'Desenrolado',         ic:'⚡', r:'+2 escudos de sequência'},
  {xp:10000, n:'Profissional',        ic:'💼', r:'Tema Ouro'},
  {xp:20000, n:'Fluente em formação', ic:'🚀', r:'Selo dourado nos certificados'},
  {xp:35000, n:'Líder global',        ic:'🌎', r:'+3 escudos de sequência'},
  {xp:60000, n:'Lenda',               ic:'👑', r:'O topo. Hora de dar aula.'}
];
const THEMES={ padrao:{n:'Padrão', need:0}, oceano:{n:'Oceano', need:2}, vinho:{n:'Vinho', need:3}, ouro:{n:'Ouro', need:5} };
function rankIdx(xp){ let i=0; RANKS.forEach((r,k)=>{ if(xp>=r.xp) i=k; }); return i; }
function rankOf(xp){ return RANKS[rankIdx(xp)]; }
function practiceMin(){ return totalMin(); }
function kitFull(id){ const k=KITS.find(x=>x.id===id); return !!k && k.steps.every(s=>s.lines.every(x=>isSaved(x.en))); }

const BADGES=[
  {id:'frase1',   ic:'✨', t:'Primeira frase',       d:'Salvou a primeira frase.',                  ok:()=>state.phrases.length>=1},
  {id:'frase50',  ic:'📚', t:'Colecionador',         d:'50 frases salvas.',                         ok:()=>state.phrases.length>=50},
  {id:'frase200', ic:'🏛️', t:'Biblioteca viva',      d:'200 frases salvas.',                        ok:()=>state.phrases.length>=200},
  {id:'dom10',    ic:'🧠', t:'Dez na memória',       d:'10 frases dominadas na revisão.',           ok:()=>state.phrases.filter(p=>p.known).length>=10},
  {id:'dom100',   ic:'🧠', t:'Cem na memória',       d:'100 frases dominadas na revisão.',          ok:()=>state.phrases.filter(p=>p.known).length>=100},
  {id:'fab1',     ic:'⚙️', t:'Operário das frases',  d:'Primeira rodada completa na Fábrica.',      ok:()=>Object.keys(state.fabDone).length>=1},
  {id:'fab10',    ic:'🏗️', t:'Mestre de obras',      d:'10 estruturas dominadas (3 rodadas cada).', ok:()=>Object.values(state.fabDone).filter(n=>n>=3).length>=10},
  {id:'grav',     ic:'🎙️', t:'No ar',                d:'Gravou a própria voz pela primeira vez.',   ok:()=>state.game.recs>=1},
  {id:'voz',      ic:'🎯', t:'Pronúncia aprovada',   d:'85% ou mais no Falar e conferir.',          ok:()=>state.game.bestSpeak>=0.85},
  {id:'dia',      ic:'☀️', t:'Dia completo',         d:'Cumpriu todas as missões de um dia.',       ok:()=>Object.keys(state.game.chests).length>=1},
  {id:'dia10',    ic:'🏅', t:'Dez dias completos',   d:'10 dias com todas as missões feitas.',      ok:()=>Object.keys(state.game.chests).length>=10},
  {id:'seq7',     ic:'🔥', t:'Semana de fogo',       d:'7 dias seguidos de treino.',                ok:()=>state.game.bestStreak>=7},
  {id:'seq30',    ic:'🔥', t:'Mês inteiro',          d:'30 dias seguidos de treino.',               ok:()=>state.game.bestStreak>=30},
  {id:'seq100',   ic:'💯', t:'Cem dias',             d:'100 dias seguidos de treino.',              ok:()=>state.game.bestStreak>=100},
  {id:'h10',      ic:'⏱️', t:'10 horas',             d:'10 horas de prática registradas.',          ok:()=>practiceMin()>=600},
  {id:'h50',      ic:'⏳', t:'50 horas',             d:'50 horas de prática registradas.',          ok:()=>practiceMin()>=3000},
  {id:'h100',     ic:'🏆', t:'100 horas',            d:'100 horas de prática registradas.',         ok:()=>practiceMin()>=6000},
  {id:'conversa', ic:'☎️', t:'Conversa real',        d:'Fez uma conversa com gente de verdade.',    ok:()=>Object.values(state.days).some(r=>r.done&&r.done.conversa)},
  {id:'kit',      ic:'🧰', t:'Kit completo',         d:'Salvou todas as frases de um kit.',         ok:()=>KITS.some(k=>kitFull(k.id))},
  {id:'entrev',   ic:'🤝', t:'Pronto pra entrevista',d:'Completou os kits Entrevista e Negociar salário.', ok:()=>kitFull('entrevista')&&kitFull('salario')},
  {id:'lvB1',     ic:'🥉', t:'Etapa B1',             d:'Chegou ao B1 no teste de nível.',           ok:()=>!!state.profile&&lvlIdx(state.profile.level)>=2},
  {id:'lvB2',     ic:'🥈', t:'Etapa B2',             d:'Chegou ao B2 no teste de nível.',           ok:()=>!!state.profile&&lvlIdx(state.profile.level)>=3},
  {id:'lvC1',     ic:'🥇', t:'Etapa C1',             d:'Chegou ao C1 no teste de nível.',           ok:()=>!!state.profile&&lvlIdx(state.profile.level)>=4}
];

/* ---------------- toast e celebração ---------------- */
let toastT=null;
function toast(txt){
  const el=document.getElementById('toast'); if(!el) return;
  el.textContent=txt; el.hidden=false; el.classList.remove('toast--on'); void el.offsetWidth; el.classList.add('toast--on');
  clearTimeout(toastT); toastT=setTimeout(()=>{ el.hidden=true; },2200);
}
const celebQ=[];
let bannerT=null;
function softBanner(c){
  let el=document.getElementById('banner');
  if(!el){ el=document.createElement('div'); el.id='banner'; el.className='banner'; el.setAttribute('role','status'); document.body.appendChild(el); }
  el.innerHTML=`<span class="banner__ic">${c.ic||'🎉'}</span><span><small>${esc(c.kicker||'')}</small><b>${esc(c.t)}</b>${c.d?`<em>${esc(c.d)}</em>`:''}${c.reward?`<i>${esc(c.reward)}</i>`:''}</span>`;
  el.classList.remove('banner--on'); void el.offsetWidth; el.classList.add('banner--on');
  clearTimeout(bannerT); bannerT=setTimeout(()=>el.classList.remove('banner--on'), 4500);
}
function celebrate(c){ if(c.soft){ softBanner(c); return; } celebQ.push(c); if(celebQ.length===1) showCeleb(); }
function showCeleb(){
  const box=document.getElementById('celeb'); if(!box) return;
  const c=celebQ[0]; if(!c){ box.hidden=true; return; }
  box.innerHTML=`<div class="celeb__box" role="dialog" aria-modal="true" aria-label="${esc(c.t)}">
    <div class="celeb__ic">${c.ic||'🎉'}</div>
    <p class="eyebrow" style="text-align:center">${esc(c.kicker||'Recompensa')}</p>
    <h2 class="celeb__t">${esc(c.t)}</h2>
    ${c.d?`<p class="celeb__d">${esc(c.d)}</p>`:''}
    ${c.list?`<div class="celeb__list">${c.list.map(b=>`<div class="celeb__it"><span>${b.ic}</span><span><b>${esc(b.t)}</b><br><small>${esc(b.d)}</small></span></div>`).join('')}</div>`:''}
    ${c.reward?`<p class="celeb__r">${esc(c.reward)}</p>`:''}
    <div class="acts acts--bare" style="justify-content:center;margin-top:18px">
      ${c.cert?`<button class="act" data-cert="${esc(c.cert)}">Ver certificado</button>`:''}
      <button class="act act--main" data-celebok="1">Continuar</button></div></div>`;
  box.hidden=false;
  const b=box.querySelector('[data-celebok]'); if(b) b.focus();
}

/* ---------------- XP ---------------- */
let inBadge=false;
function gain(n, motivo, opt){
  const G=state.game, d=today(); if(!n) return;
  if(opt && opt.cap){
    if(!G.cap || G.cap.d!==d) G.cap={d, v:{}};
    const used=G.cap.v[opt.cap]||0; if(used>=opt.capMax) return;
    n=Math.min(n, opt.capMax-used); G.cap.v[opt.cap]=used+n;
  }
  G.xp+=n; G.xpDays[d]=(G.xpDays[d]||0)+n;
  toast(`+${n} XP · ${motivo}`);
  const ri=rankIdx(G.xp);
  while(G.rankSeen<ri){ G.rankSeen++; rankReward(G.rankSeen); }
  if(!inBadge) checkBadges();
  paintStatsXP();
}
function rankReward(i){
  const R=RANKS[i], G=state.game;
  if(i===1) G.shields=Math.min(5,G.shields+1);
  if(i===4) G.shields=Math.min(5,G.shields+2);
  if(i===7) G.shields=Math.min(5,G.shields+3);
  celebrate({ic:R.ic, kicker:'Nova patente', t:R.n, d:`Você passou de ${R.xp.toLocaleString('pt-BR')} XP.`, reward:'Recompensa: '+R.r});
  cloudEvent('patente', 'Nova patente: '+R.n, 0);
}
function checkBadges(silentXp){
  const G=state.game, novos=[];
  BADGES.forEach(b=>{ if(!G.badges[b.id]){ let ok=false; try{ ok=b.ok(); }catch(e){} if(ok){ G.badges[b.id]=today(); novos.push(b); } } });
  if(!novos.length) return;
  inBadge=true;
  novos.forEach(b=>{ gain(25, 'conquista: '+b.t); cloudEvent('conquista', b.t, 25); });
  inBadge=false;
  celebrate(novos.length===1
    ? {ic:novos[0].ic, kicker:'Nova conquista', t:novos[0].t, d:novos[0].d, reward:'+25 XP', soft:true}
    : {ic:'🏆', kicker:'Novas conquistas', t:`${novos.length} conquistas desbloqueadas`, list:novos, reward:`+${novos.length*25} XP`});
  save();
}
function paintStatsXP(){ const el=document.getElementById('s-xp'); if(el) el.textContent=state.game.xp.toLocaleString('pt-BR'); }

/* ---------------- sequência com escudos ---------------- */
function activeDays(){ const s=new Set(state.log.map(e=>e.d)); Object.keys(state.game.shieldDays||{}).forEach(d=>s.add(d)); return s; }
function streakFrom(dstr, days){
  days=days||activeDays(); let n=0; const d=new Date(dstr+'T12:00:00');
  while(days.has(isoLocal(d)) && n<2000){ n++; d.setDate(d.getDate()-1); }
  return n;
}
streak=function(){ const days=activeDays(); const t=today(); return days.has(t) ? streakFrom(t,days) : streakFrom(addDays(-1),days); };
function applyShields(){
  const G=state.game; if(G.shieldCheck===today()) return; G.shieldCheck=today();
  const days=activeDays(), y=addDays(-1);
  if(!days.has(y) && G.shields>0 && streakFrom(addDays(-2),days)>0){
    G.shieldDays[y]=1; G.shields--;
    celebrate({ic:'🛡️', kicker:'Escudo usado', t:'Sua sequência foi salva', d:'Ontem você não treinou, então um escudo protegeu seus dias seguidos.', reward:`Restam ${G.shields} escudo${G.shields===1?'':'s'}.`});
    cloudEvent('escudo','Escudo protegeu a sequência',0);
  }
  save();
}
function checkStreak(){
  const G=state.game, s=streak();
  if(s>G.bestStreak) G.bestStreak=s;
  if(s>0 && s%7===0 && G.shieldMark!==today()){
    G.shieldMark=today();
    if(G.shields<5){ G.shields++; celebrate({ic:'🛡️', kicker:`${s} dias seguidos`, t:'Você ganhou um escudo', d:'Se um dia você não conseguir treinar, o escudo protege sua sequência automaticamente.', reward:`Escudos: ${G.shields} de 5`}); }
  }
}

/* ---------------- baú do dia ---------------- */
function checkChest(){
  const G=state.game, d=today(); if(G.chests[d]) return;
  const ms=missionsToday().filter(m=>!m.weekend); const r=dayRec();
  if(!ms.length || !ms.every(m=>r.done[m.id])) return;
  const bonus=20+Math.floor(Math.random()*41); G.chests[d]=bonus;
  celebrate({ic:'🎁', kicker:'Dia completo', t:'Baú do dia aberto', d:'Você cumpriu todas as missões de hoje. É exatamente assim que a fluência é construída: um dia de cada vez.', reward:`+${bonus} XP de bônus`});
  gain(bonus,'baú do dia');
  cloudEvent('dia','Dia completo: todas as missões',bonus);
}
