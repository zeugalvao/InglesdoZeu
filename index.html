const SQL_SCRIPT = "-- ============================================================\n-- INGLÊS DO ZEU — banco de dados (Supabase)\n-- Cole tudo no SQL Editor e clique em Run. Pode rodar de novo\n-- sem problema: ele não apaga nada que já existe.\n-- ============================================================\n\n-- 1. TABELAS ---------------------------------------------------\ncreate table if not exists public.professores (\n  email text primary key\n);\n\ncreate table if not exists public.alunos (\n  id            uuid primary key references auth.users(id) on delete cascade,\n  email         text,\n  nome          text,\n  objetivo      text,\n  meta          text default 'B2',\n  nivel         text,\n  ativo         boolean not null default true,\n  criado_em     timestamptz not null default now(),\n  ultimo_acesso timestamptz\n);\n\ncreate table if not exists public.progresso (\n  aluno_id      uuid primary key references public.alunos(id) on delete cascade,\n  dados         jsonb not null default '{}'::jsonb,\n  xp            integer default 0,\n  patente       text,\n  nivel         text,\n  horas         numeric default 0,\n  streak        integer default 0,\n  frases        integer default 0,\n  atualizado_em timestamptz not null default now()\n);\n\ncreate table if not exists public.eventos (\n  id        bigint generated always as identity primary key,\n  aluno_id  uuid not null references public.alunos(id) on delete cascade,\n  tipo      text not null,\n  detalhe   text,\n  xp        integer default 0,\n  criado_em timestamptz not null default now()\n);\ncreate index if not exists eventos_aluno_idx on public.eventos (aluno_id, criado_em desc);\n\n-- 2. QUEM É PROFESSOR -----------------------------------------\ncreate or replace function public.eh_professor()\nreturns boolean language sql stable security definer set search_path = public as $$\n  select exists (\n    select 1 from public.professores\n    where lower(email) = lower(coalesce(auth.jwt() ->> 'email', ''))\n  );\n$$;\n\n-- 3. MATRÍCULA AUTOMÁTICA: todo cadastro vira um aluno ---------\ncreate or replace function public.novo_aluno()\nreturns trigger language plpgsql security definer set search_path = public as $$\nbegin\n  insert into public.alunos (id, email, nome, objetivo, meta)\n  values (\n    new.id, new.email,\n    coalesce(nullif(new.raw_user_meta_data ->> 'nome', ''), split_part(new.email, '@', 1)),\n    coalesce(new.raw_user_meta_data ->> 'objetivo', ''),\n    coalesce(nullif(new.raw_user_meta_data ->> 'meta', ''), 'B2')\n  )\n  on conflict (id) do nothing;\n  insert into public.eventos (aluno_id, tipo, detalhe) values (new.id, 'cadastro', 'Matrícula criada');\n  return new;\nend $$;\n\ndrop trigger if exists ao_criar_usuario on auth.users;\ncreate trigger ao_criar_usuario after insert on auth.users\n  for each row execute function public.novo_aluno();\n\n-- 4. PROFESSOR ATIVA OU PAUSA UM ALUNO -------------------------\ncreate or replace function public.definir_status(p_aluno uuid, p_ativo boolean)\nreturns void language plpgsql security definer set search_path = public as $$\nbegin\n  if not public.eh_professor() then\n    raise exception 'Apenas professores podem fazer isso';\n  end if;\n  update public.alunos set ativo = p_ativo where id = p_aluno;\n  insert into public.eventos (aluno_id, tipo, detalhe)\n  values (p_aluno, 'status', case when p_ativo then 'Matrícula ativada' else 'Matrícula pausada' end);\nend $$;\n\n-- 5. SEGURANÇA: cada aluno só vê o que é dele ------------------\nalter table public.professores enable row level security;\nalter table public.alunos      enable row level security;\nalter table public.progresso   enable row level security;\nalter table public.eventos     enable row level security;\n\ndrop policy if exists alunos_ler      on public.alunos;\ndrop policy if exists alunos_editar   on public.alunos;\ndrop policy if exists progresso_ler   on public.progresso;\ndrop policy if exists progresso_criar on public.progresso;\ndrop policy if exists progresso_editar on public.progresso;\ndrop policy if exists eventos_ler     on public.eventos;\ndrop policy if exists eventos_criar   on public.eventos;\n\ncreate policy alunos_ler on public.alunos for select to authenticated\n  using (id = auth.uid() or public.eh_professor());\ncreate policy alunos_editar on public.alunos for update to authenticated\n  using (id = auth.uid()) with check (id = auth.uid());\n\ncreate policy progresso_ler on public.progresso for select to authenticated\n  using (aluno_id = auth.uid() or public.eh_professor());\ncreate policy progresso_criar on public.progresso for insert to authenticated\n  with check (aluno_id = auth.uid());\ncreate policy progresso_editar on public.progresso for update to authenticated\n  using (aluno_id = auth.uid()) with check (aluno_id = auth.uid());\n\ncreate policy eventos_ler on public.eventos for select to authenticated\n  using (aluno_id = auth.uid() or public.eh_professor());\ncreate policy eventos_criar on public.eventos for insert to authenticated\n  with check (aluno_id = auth.uid());\n\n-- permissões: o aluno não consegue se reativar sozinho\nrevoke all on public.professores from anon, authenticated;\nrevoke all on public.alunos      from anon;\nrevoke all on public.progresso   from anon;\nrevoke all on public.eventos     from anon;\nrevoke update on public.alunos from authenticated;\ngrant usage on schema public to authenticated;\ngrant select on public.alunos to authenticated;\ngrant update (nome, objetivo, meta, nivel, ultimo_acesso) on public.alunos to authenticated;\ngrant select, insert, update on public.progresso to authenticated;\ngrant select, insert on public.eventos to authenticated;\nrevoke execute on function public.definir_status(uuid, boolean) from public, anon;\ngrant execute on function public.definir_status(uuid, boolean) to authenticated;\ngrant execute on function public.eh_professor() to authenticated;\n\n-- 6. VOCÊ COMO PROFESSOR --------------------------------------\ninsert into public.professores (email) values ('EMAIL_DO_PROFESSOR')\n  on conflict (email) do nothing;\n";

/* ---------------- conexão ---------------- */
function loadLib(){
  return new Promise(res=>{
    if(window.supabase && window.supabase.createClient) return res(true);
    let done=false; const fin=v=>{ if(!done){ done=true; res(v); } };
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    s.onload=()=>fin(!!(window.supabase && window.supabase.createClient));
    s.onerror=()=>fin(false);
    document.head.appendChild(s);
    setTimeout(()=>fin(!!(window.supabase && window.supabase.createClient)), 12000);
  });
}
function traduzErro(e){
  const m=String((e&&(e.message||e.error_description||e))||'');
  if(/Invalid login credentials/i.test(m)) return 'E-mail ou senha errados.';
  if(/already registered|already been registered|User already/i.test(m)) return 'Esse e-mail já tem cadastro. Use a aba Entrar.';
  if(/Password should be|at least 6/i.test(m)) return 'A senha precisa ter pelo menos 6 caracteres.';
  if(/Email not confirmed/i.test(m)) return 'E-mail ainda não confirmado. Abra o link que chegou no e-mail, ou desligue a confirmação (passo 4 do guia).';
  if(/invalid.*email|Unable to validate email/i.test(m)) return 'Esse e-mail parece inválido.';
  if(/signups? (are )?(not allowed|disabled)|Signups not allowed/i.test(m)) return 'As matrículas novas estão fechadas no momento. Avise o professor para liberar o cadastro no Supabase (Authentication → Sign In / Providers → Email ligado e “Allow new users to sign up” ligado).';
  if(/rate limit|too many/i.test(m)) return 'Muitas tentativas seguidas. Espere um minuto e tente de novo.';
  if(/Failed to fetch|NetworkError|network/i.test(m)) return 'Sem conexão com o Supabase. Confira a internet e o endereço do projeto.';
  if(/Invalid API key|No API key|apikey/i.test(m)) return 'Chave inválida. Copie de novo a Publishable key do projeto.';
  return m || 'Erro desconhecido.';
}
async function cloudInit(){
  if(!CFG.url || !CFG.key){ cloud.status='off'; paintAcct(); return; }
  cloud.status='conectando'; paintAcct();
  const ok=await loadLib();
  if(!ok){ cloud.status='offline'; cloud.err='Sem internet agora. Seu progresso continua salvo neste aparelho e sobe quando a conexão voltar.'; render(); return; }
  try{ cloud.sb=window.supabase.createClient(CFG.url, CFG.key); }
  catch(e){ cloud.status='erro'; cloud.err=traduzErro(e); paintAcct(); return; }
  const {data}=await cloud.sb.auth.getSession();
  if(data && data.session){ cloud.user=data.session.user; await afterLogin(); render(); }
  else { cloud.status = CFG.uid ? 'expirou' : 'saiu'; render(); }
}
async function afterLogin(){
  const u=cloud.user, sb=cloud.sb;
  const myKey='zeu:v1:u:'+u.id;
  if(KEY!==myKey){ resetState(); KEY=myKey; await load(); }
  CFG.uid=u.id; CFG.email=u.email; CFG.guestOk=false; writeCfg();
  const al=await sb.from('alunos').select('*').eq('id',u.id).maybeSingle();
  cloud.aluno=al.data||null;
  if(cloud.aluno){ CFG.nome=cloud.aluno.nome; writeCfg(); if(!state.game.nome) state.game.nome=cloud.aluno.nome; }
  const pf=await sb.rpc('eh_professor'); cloud.prof = pf.data===true;
  const pr=await sb.from('progresso').select('dados').eq('aluno_id',u.id).maybeSingle();
  const remote=pr.data && pr.data.dados;
  if(remote && (remote.savedAt||0) > (state.savedAt||0)){
    applySnapshot(remote); toast('Progresso baixado da nuvem');
  } else if(!remote && !state.phrases.length && !state.profile){
    const g=await store.get('zeu:v1');
    if(g){ try{ const gd=JSON.parse(g);
      if((gd.phrases||[]).length || gd.profile){
        applySnapshot(gd); state.savedAt=Date.now(); cloudEvent('importacao','Progresso deste aparelho levado para a conta',0);
        await store.set('zeu:v1','');
      } }catch(e){} }
    if(!state.profile && cloud.aluno && cloud.aluno.meta) state.place={ ans:CANDO.map(()=>null), goal:cloud.aluno.meta, ritmo:'padrao' };
  }
  cloud.status = (cloud.aluno && cloud.aluno.ativo===false) ? 'pausado' : 'ok';
  cloud.err='';

}
let pushTimer=null;
function cloudSchedule(){ if(!cloud.sb || !cloud.user) return; clearTimeout(pushTimer); pushTimer=setTimeout(cloudPush, 3000); }
async function cloudPush(){
  if(!cloud.sb || !cloud.user || cloud.status==='pausado') { paintAcct(); return; }
  cloud.status='sincronizando'; paintAcct();
  const uid=cloud.user.id, G=state.game;
  try{
    const r1=await cloud.sb.from('progresso').upsert({ aluno_id:uid, dados:snapshot(), xp:G.xp, patente:rankOf(G.xp).n,
      nivel:state.profile?state.profile.level:null, horas:Math.round(practiceMin()/6)/10, streak:streak(),
      frases:state.phrases.length, atualizado_em:new Date().toISOString() });
    if(r1.error) throw r1.error;
    if(G.outbox.length){
      const lote=G.outbox.slice(0,50).map(e=>Object.assign({aluno_id:uid}, e));
      const r2=await cloud.sb.from('eventos').insert(lote);
      if(!r2.error) G.outbox.splice(0, lote.length);
    }
    await cloud.sb.from('alunos').update({ nivel:state.profile?state.profile.level:null, ultimo_acesso:new Date().toISOString() }).eq('id',uid);
    cloud.status='ok'; cloud.last=Date.now(); cloud.err='';
  }catch(e){ cloud.status='erro'; cloud.err=traduzErro(e); }
  paintAcct();
}

async function saveCfg(){
  state.cfgDraft={url:val('cf-url'), key:val('cf-key')};
  let url=val('cf-url').replace(/\/+$/,''), key=val('cf-key');
  if(!/^https:\/\/.+/.test(url)){ cloud.msg='O endereço precisa começar com https:// (ex.: https://abcd1234.supabase.co).'; return render(); }
  if(!key){ cloud.msg='Cole a Publishable key.'; return render(); }
  if(/^sb_secret_/.test(key) || /service_role/.test(atobSafe(key))){ cloud.msg='Essa é a chave SECRETA. Nunca coloque ela no site. Use a Publishable key (começa com sb_publishable_).'; return render(); }
  cloud.msg='testando a conexão…'; render();
  const ok=await loadLib(); if(!ok){ cloud.msg='Sem internet para carregar o Supabase. Tente de novo.'; return render(); }
  let sb; try{ sb=window.supabase.createClient(url, key); }catch(e){ cloud.msg=traduzErro(e); return render(); }
  const t=await sb.rpc('eh_professor');
  if(t.error){
    const m=String(t.error.message||'');
    cloud.msg = /Could not find|does not exist|PGRST202|schema cache/i.test(m+t.error.code)
      ? 'Conectou, mas o banco ainda não foi criado. Faça o passo 3: rode o SQL no SQL Editor.'
      : traduzErro(t.error);
    return render();
  }
  CFG.url=url; CFG.key=key; CFG.prof=val('cf-prof')||CFG.prof||''; writeCfg();
  cloud.sb=sb; cloud.status='saiu'; cloud.msg='Conectado! Agora cadastre-se como aluno ou entre.'; state.cfgEdit=false; cloud.tab='cadastro';
  render();
}
function atobSafe(k){ try{ return atob((k.split('.')[1]||'').replace(/-/g,'+').replace(/_/g,'/')); }catch(e){ return ''; } }
function sqlFor(email){ return SQL_SCRIPT.replace('EMAIL_DO_PROFESSOR', (email||'seu@email.com').replace(/'/g,'')); }

/* ---------------- progresso de cada missão ---------------- */
function recDay(){ const r=dayRec(); if(!r.recd) r.recd={}; if(!r.micro) r.micro={}; if(!r.spoke) r.spoke={}; return r; }
function taskProg(id){
  const r=recDay(), dp=r.plays||{};
  switch(id){
    case 'rev1': case 'rev2': { const R=state.rv; if(R && R.ctx===id && R.q.length) return R.i/R.q.length; return 0; }
    case 'escuta': { const L=escLines(escKit()), wr=r.writes||{}; return L.reduce((a,x)=>a+Math.min(3,dp[normT(x.en)]||0)+Math.min(3,wr[normT(x.en)]||0),0)/(L.length*6); }
    case 'shadow': { const id2=r.pod && find(r.pod); if(!id2) return 0; const n=Math.min(3,dp[normT(id2.text)]||0);
      return ((r.ppDone?3:n) + ((r.spoke[normT(id2.text)]||r.recd.shadow)?1:0))/4; }
    case 'fabrica': return Math.min(1,(r.rounds||0)/2);
    case 'narra': return r.narrated?1:0;
    case 'micro': { const qs=microQs(); let t=0,d=0; qs.forEach(q=>{ const n=(MICRO_S[q.q]||[1,1,1]).length; t+=n; d+=Math.min(n,((r.micro2||{})[normT(q.q)]||0)); }); return t?d/t:0; }
    case 'diario': return Math.min(1,(r.recd.diarioSecs||0)/60);
    case 'reconto': { const n=sentencesOf(r.recontoTxt||'').length; const fal=(r.recontoWords||0)>=15||r.recd.reconto?1:0; return Math.min(1, Math.min(n,3)/3*0.5 + fal*0.5); }
    case 'video': { if(!r.vidT0) return 0; const m=MISSIONS.find(x=>x.id==='video'); return Math.min(1,(Date.now()-r.vidT0)/(mMin(m)*60*1000*0.7)); }
  }
  return 0;
}
function lessonProg(id){
  if(dayRec().done[id]) return 1;
  const m=MISSIONS.find(x=>x.id===id); if(!m) return 0;
  return Math.max(Math.min(1, secsOf(id)/(mMin(m)*60)), taskProg(id));
}

  video:'Abra um vídeo. Quando você voltar depois de alguns minutos, a missão fecha sozinha.',
  micro:'Termina quando você completar as 3 frases de cada uma das 3 perguntas.',
  diario:'Termina quando você gravar pelo menos 1 minuto.',
  conversa:'Essa acontece fora do app. Quando fizer, toque no botão abaixo.',

  if(/^micsc\d$/.test(key) && n>=4) r.micro[key.replace('sc','')]=1;
  if(key==='recontosc') r.recontoWords=Math.max(r.recontoWords||0, n);

};

  const r=recDay();
  if(key==='shadow' && secs>=1) r.recd.shadow=1;

  if(key==='reconto' && secs>=20) r.recd.reconto=1;

    why:`${esc(k.brief)} <span class="lesson__hint">Toque ▶ em cada frase até ouvir 3 vezes. Quando todas estiverem com ✓, a situação se conclui sozinha e as frases vão para a sua revisão.</span>`,
    body, foot: done?kitDoneHTML(k):'', done });
};
function triItems(L){
  const pats=PATTERNS.filter(p=>p.lvl===L), kits=KITS.filter(k=>k.lvl===L), out=[];
  let ki=0;
  pats.forEach((p,i)=>{ out.push({type:'pat', p}); if(i%2===1 && ki<kits.length) out.push({type:'kit', k:kits[ki++]}); });
  while(ki<kits.length) out.push({type:'kit', k:kits[ki++]});
  return out;
}
triHTML=function(){
  const L = state.triLvl || trackLvl(curLvl());
  const k = state.triKit && KITS.find(x=>x.id===state.triKit);
  if(k) return kitHTML(k);
  if(state.triOpen && state.triPat){
    const pat=PATTERNS.find(p=>p.id===state.triPat), F=state.fab, n=state.fabDone[pat.id]||0;
    const body=fabHTML('tri', pat.id), Fn=state.fab;
    const prog = Fn ? Math.min(1, Fn.i/Fn.order.length) : 0;
    return lessonShell({ close:'data-tclose="1"', prog, right:`${Math.min(3,n)}/3 rodadas`, kick:`🧩 Estrutura · ${pat.lvl}`,
      title:esc(pat.en), why:`${esc(pat.pt)} — fale cada frase. Se o microfone entender certo, passa sozinho. Dominada depois de 3 rodadas.`, body, foot:'' });
  }
  const items=triItems(L);
  const isDone=it=> it.type==='pat' ? (state.fabDone[it.p.id]||0)>=3 : !!KD()[it.k.id];
  const cur=items.find(it=>!isDone(it));
  const can=CANDO.filter(c=>c.lvl===L);
  const nDone=items.filter(isDone).length;
  return `<div class="lvltabs">${['A2','B1','B2','C1'].map(l=>`<button class="lvltab" data-trilvl="${l}" aria-pressed="${l===L}">${l}${l===trackLvl(curLvl())?' •':''}</button>`).join('')}</div>
    <div class="unitbar unitbar--tri">
      <div><p class="unitbar__k">Etapa ${L} · ${LVL_NAME[L]}</p><p class="unitbar__t">${nDone} de ${items.length} lições</p></div>
      <details class="unitbar__det"><summary>O que você vai conseguir</summary><ul>${can.map(c=>`<li>${esc(c.t)}</li>`).join('')}</ul></details>
    </div>
    <div class="path">${items.map((it,i)=>{
      if(it.type==='pat'){ const n=state.fabDone[it.p.id]||0;
        return nodeHTML({ t:it.p.en, s:`${it.p.pt} · ${Math.min(3,n)}/3`, ic:'🧩', done:n>=3, crown:'👑', cur:cur===it, prog:n/3, attr:`data-tnpat="${it.p.id}"`, cta:n?'Continuar':'Começar' }, i); }
      const p=kitProg(it.k);
      return nodeHTML({ t:it.k.title, s:`situação · ${Math.round(p*100)}%`, ic:'💬', done:!!KD()[it.k.id], crown:'⭐', cur:cur===it, prog:p, attr:`data-tnkit="${it.k.id}"`, cta:p?'Continuar':'Começar' }, i);
    }).join('')}
      <div class="pnode pnode--end" style="--off:0px"><div class="chest ${nDone===items.length?'chest--open':''}">${nDone===items.length?'🏆':'🏁'}</div>
        <span class="pnode__s">${nDone===items.length?'Etapa completa! Refaça o teste de nível.':'Fim da etapa '+L}</span></div>
    </div>`;
};

async function abrirProva(licao){

  state.prova={ licao, loading:true, i:-1, resp:{} };

  const r=await cloud.sb.rpc('iniciar_prova',{ p_licao:licao });
  if(r.error){
    const m=String(r.error.message||'');
    const w=/ESPERA:(\d+)/.exec(m);
    state.prova={ licao, err: w ? `Você poderá tentar de novo em ${w[1]} min. Até lá, refaça a prática da lição: é isso que faz você passar.` : m };

  state.prova={ licao, id:d.id, perguntas:d.perguntas, expira:new Date(d.expira_em).getTime(), i: d.retomada?0:-1, resp:saved };

  P.res=r.data; try{ localStorage.removeItem('zeu:prova:'+P.id); }catch(e){}

          <li>Você precisa de <b>${min}%</b> de acerto para passar.</li>
          <li>Tempo: <b>${Math.round((P.expira-Date.now())/60000)} min</b>. Erro de digitação pequeno não conta; maiúscula e pontuação também não.</li>
          <li>Não passou? A lição recomeça e você tenta de novo depois de praticar.</li>
          ${cloud.mes?`<li>Cada prova aprovada no mês vale <b>${brl(valorPorProva())}</b> de reembolso (até ${brl(cloud.mes.valor_max)}).</li>`:''}
        </ul>
      </div>`, foot:`<button class="big" data-provago="1">Começar a prova</button>` });
  }
  const q=Q[P.i], v=P.resp[q.id]||'', last=P.i===n-1;
  const answered=Q.filter(x=>(P.resp[x.id]||'').trim()).length;
  let body='';
  if(q.tipo==='traduzir') body=`<p class="pq__k">Escreva em inglês:</p><p class="pq__q">${esc(q.enunciado)}</p>
      <textarea class="field pq__in" data-presp="${esc(q.id)}" rows="3" placeholder="Digite a frase em inglês" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">${esc(v)}</textarea>`;
  else if(q.tipo==='lacuna') body=`<p class="pq__k">Complete com as palavras que faltam:</p><p class="pq__q">${esc(q.enunciado).replace(/___/g,'<span class="pq__gap">____</span>')}</p>
      <p class="pq__apoio">${esc(q.apoio||'')}</p>
      <input class="field pq__in" data-presp="${esc(q.id)}" value="${esc(v)}" placeholder="Só as palavras que faltam, na ordem" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">`;
  else body=`<p class="pq__k">Ouça e escolha o que significa:</p>
      <div class="acts acts--bare" style="margin:6px 0 14px"><button class="act act--main" data-sayraw="${esc(q.audio)}">🔊 Ouvir</button><button class="act" data-sayslow="${esc(q.audio)}">🐢 Devagar</button></div>
      <div class="pq__opts">${(q.opcoes||[]).map(o=>`<button class="pq__opt" data-popt="${esc(q.id)}" data-val="${esc(o)}" aria-pressed="${v===o}">${esc(o)}</button>`).join('')}</div>`;
  return shell({ prog:P.i/n, right:'⏱ '+fmtT(Math.max(0,Math.round((P.expira-Date.now())/1000))), kick:`📝 Pergunta ${P.i+1} de ${n}`,
    body:`<div class="pq">${body}</div>${P.sendErr?`<p class="msg" style="color:var(--alert-d)">${esc(P.sendErr)}</p>`:''}`,
    foot:`<div class="pq__nav">${P.i>0?'<button class="act" data-pprev="1">← Voltar</button>':''}
      ${last?`<button class="big" data-pentregar="1" ${P.sending?'disabled':''}>${P.sending?'Corrigindo…':`Entregar prova (${answered}/${n} respondidas)`}</button>`
            :`<button class="big" data-pnext="1">${v.trim()?'Próxima':'Pular'}</button>`}</div>` });
}

/* ---------- integração com a Trilha ---------- */
const _inLessonProva=inLesson;
inLesson=function(){ return (state.mode==='tri' && !!state.prova) || _inLessonProva(); };
const _triHTMLProva=triHTML;
triHTML=function(){
  if(state.prova){ setTimeout(provaTimer,0); return provaHTML(); }
  const A=aprovSet();
  const html=_triHTMLProva();
  if(state.triKit || (state.triOpen && state.triPat)) return html;
  /* redesenha os nós: verde só com prova aprovada */
  const L=state.triLvl || trackLvl(curLvl()), items=triItems(L);
  const cur=items.find(it=>!A.has(licaoId(it)));
  const nodes=items.map((it,i)=>{
    const id=licaoId(it), ok=A.has(id), pr=praticaOk(id);
    if(it.type==='pat'){ const n=state.fabDone[it.p.id]||0;
      return nodeHTML({ t:it.p.en, s: ok?`${it.p.pt} · aprovada`: pr?'📝 prova liberada':`${it.p.pt} · ${Math.min(3,n)}/3`, ic: pr&&!ok?'📝':'🧩', done:ok, crown:'👑', cur:cur===it,
        prog: ok?1: pr?0.9 : n/3*0.85, attr:`data-tnpat="${it.p.id}"`, cta: pr?'Fazer prova':n?'Continuar':'Começar' }, i); }
    const p=kitProg(it.k);
    return nodeHTML({ t:it.k.title, s: ok?'situação · aprovada': pr?'📝 prova liberada':`situação · ${Math.round(p*100)}%`, ic: pr&&!ok?'📝':'💬', done:ok, crown:'⭐', cur:cur===it,
      prog: ok?1: pr?0.9 : p*0.85, attr:`data-tnkit="${it.k.id}"`, cta: pr?'Fazer prova':p?'Continuar':'Começar' }, i);
  }).join('');
  const nOk=items.filter(it=>A.has(licaoId(it))).length;
  return html.replace(/<div class="path">[\s\S]*?(<div class="pnode pnode--end")/, `<div class="path">${nodes}$1`)
             .replace(/<p class="unitbar__t">\d+ de (\d+) lições<\/p>/, `<p class="unitbar__t">${nOk} de $1 lições aprovadas</p>`)
             .replace('<div class="unitbar unitbar--tri">', reembolsoCardHTML(true)+'<div class="unitbar unitbar--tri">');
};
/* cartão da prova dentro da lição praticada */
function provaCTA(id){
  if(aprovSet().has(id)) return `<div class="provacta provacta--ok">🏅 Prova aprovada nesta lição.</div>`;
  if(!praticaOk(id)) return `<div class="provacta provacta--lock">📝 A prova é liberada quando você terminar a prática desta lição.</div>`;
  return `<div class="provacta"><span><b>Prática concluída!</b> Agora prove que aprendeu: ${cloud.mes?`vale ${brl(valorPorProva())} de reembolso.`:'80% para passar.'}</span><button class="big" data-provaopen="${id}" style="margin-top:10px">📝 Fazer a prova</button></div>`;
}
const _kitHTMLProva=kitHTML;
kitHTML=function(k){
  const html=_kitHTMLProva(k), id='kit:'+k.id;
  if(state.mode!=='tri') return html;
  return html.replace('<div class="lesson__body">', '<div class="lesson__body">'+provaCTA(id));
};
kitDoneHTML=function(k){
  const id='kit:'+k.id, ok=aprovSet().has(id);
  if(state.mode!=='tri' || ok) return `<div class="okpanel"><span class="okpanel__ic">✓</span><span><b>${ok?'Situação aprovada!':'Prática concluída!'}</b><small>As frases foram para a sua revisão</small></span></div>
    <button class="big" data-kclose="1">Continuar</button>`;
  return `<div class="okpanel"><span class="okpanel__ic">✓</span><span><b>Prática concluída!</b><small>+30 XP · agora falta a prova</small></span></div>
    <button class="big" data-provaopen="${id}">📝 Fazer a prova</button>`;
};
const _fabHTMLProva=fabHTML;
fabHTML=function(ctx, pid){
  let html=_fabHTMLProva(ctx, pid);
  const id='pat:'+pid, n=state.fabDone[pid]||0, F=state.fab;
  if(ctx!=='tri') return html;
  if(F && F.i>=F.order.length && n>=3 && !aprovSet().has(id)){
    html=html.replace(/<button class="big" data-fabcont="[^"]*" data-ctx="[^"]*">[^<]*<\/button>/, `<button class="big" data-provaopen="${id}">📝 Fazer a prova</button>`)
             .replace('Estrutura dominada!','Prática concluída!');
  }
  if(!F || F.i===0) html=provaCTA(id)+html;
  return html;
};
const _helpIdProva=helpId;
helpId=function(){ if(state.mode==='tri' && state.prova) return 'prova'; return _helpIdProva(); };
HELP.prova={tip:'Responda sem consultar. 80% para passar.', steps:[
  'Cada lição da Trilha termina com uma <b>prova de 10 perguntas</b>, sorteadas e corrigidas no servidor.',
  '<b>Traduzir:</b> escreva a frase em inglês. <b>Completar:</b> digite só as palavras que faltam. <b>Ouvir:</b> toque em 🔊 e escolha o significado.',
  'Erro pequeno de digitação, maiúscula e pontuação não contam. Contrações valem (I\'m = I am).',
  'Passou com 80%? A lição fica verde e conta para o seu <b>reembolso do mês</b>. Não passou? Refaça a prática e tente de novo em 30 min.']};
HELP.reembolso={tip:'Cada prova aprovada devolve parte da mensalidade.', steps:[
  'A mensalidade é paga por Pix. Você recebe de volta até <b>50%</b> no seu Pix (chave CPF).',
  'O valor é <b>proporcional</b>: cada prova de lição aprovada no mês soma uma parte, até a meta do mês.',
  'Só conta prova aprovada (80% ou mais). Cada lição conta uma vez.',
  'Cadastre sua <b>chave Pix</b> em Minha conta. O reembolso é enviado depois do fechamento do mês.']};

/* ---------- cartão do reembolso ---------- */
function reembolsoCardHTML(compact){
  const m=cloud.mes; if(!m || !cloud.user) return '';
  const pct=Math.min(100, m.aprovadas/m.meta*100);
  const semPix=cloud.aluno && !cloud.aluno.chave_pix;
  return `<button class="rcard ${compact?'rcard--c':''}" data-gomode="${compact?'conta':'tri'}">
    <span class="rcard__ic">💰</span>
    <span class="rcard__b"><small>Reembolso de ${mesNome(m.mes)}</small>
      <b>${brl(m.valor_ganho)} <i>de ${brl(m.valor_max)}</i></b>
      <span class="rcard__bar"><span style="width:${pct.toFixed(1)}%"></span></span>
      <small>${Math.min(m.aprovadas,m.meta)} de ${m.meta} provas aprovadas${m.reembolso_pago?' · ✓ Pix enviado':!m.mensalidade_paga?' · aguardando confirmação da mensalidade':''}${semPix?' · <u>cadastre sua chave Pix</u>':''}</small></span></button>`;
}
const _hojeHTMLProva=hojeHTML;
hojeHTML=function(){ const h=_hojeHTMLProva(); return state.open ? h : h.replace('<div class="unitbar">', reembolsoCardHTML(false)+'<div class="unitbar">'); };
const _perfilHTMLProva=perfilHTML;
perfilHTML=function(){
  const a=cloud.aluno||{};
  return _perfilHTMLProva().replace('<div class="kit__foot">', `${reembolsoCardHTML(false)}
    <div class="pix">
      <p class="block__l">Chave Pix para receber o reembolso</p>
      <div class="compose__row"><input class="field" id="pix-in" inputmode="numeric" placeholder="Seu CPF (só números)" value="${esc(a.chave_pix||'')}" autocomplete="off">
        <button class="btn" data-pixsave="1">Salvar</button></div>
      <p class="msg" id="pix-msg">${a.chave_pix?'':'Use a chave Pix do tipo CPF, no seu nome.'}</p>
    </div>
    <div class="kit__foot">`);
};
function cpfValido(c){
  c=String(c).replace(/\D/g,''); if(c.length!==11 || /^(\d)\1+$/.test(c)) return false;
  const dv=n=>{ let s=0; for(let i=0;i<n;i++) s+=(+c[i])*(n+1-i); const r=(s*10)%11; return r===10?0:r; };
  return dv(9)===+c[9] && dv(10)===+c[10];
}

/* ---------- painel do professor: mensalidades e reembolsos ---------- */
function mesAnt(m){ let [y,mm]=m.split('-').map(Number); mm--; if(!mm){ mm=12; y--; } return y+'-'+String(mm).padStart(2,'0'); }
async function carregarPay(mes){
  cloud.pay={ mes, loading:true }; render();
  const r=await cloud.sb.rpc('resumo_mes',{ p_mes:mes });
  cloud.pay = r.error ? { mes, err:String(r.error.message) } : { mes, data:r.data };
  render();
}
function payHTML(){
  const P=cloud.pay; const atual=(cloud.mes&&cloud.mes.mes)||isoLocal(new Date()).slice(0,7);
  if(!P){ setTimeout(()=>carregarPay(atual),0); return `<section class="hist"><h2 class="hist__t">💰 Mensalidades e reembolsos</h2><p class="hist__d">Carregando…</p></section>`; }
  const head=`<section class="hist pay">
    <h2 class="hist__t">💰 Mensalidades e reembolsos</h2>
    <div class="chips" style="margin:8px 0 6px">${[atual, mesAnt(atual)].map(m=>`<button class="chip" data-paymes="${m}" aria-pressed="${P.mes===m}">${mesNome(m)}</button>`).join('')}</div>`;
  if(P.loading) return head+'<p class="hist__d">Carregando…</p></section>';
  if(P.err) return head+`<p class="msg" style="color:var(--alert-d)">${esc(P.err)}</p><p class="hist__d">Rodou o script novo de provas e reembolso no Supabase?</p></section>`;
  const C=P.data.config, A=P.data.alunos||[];
  const pagos=A.filter(a=>a.mensalidade), devolver=A.reduce((s,a)=>s+Math.max(0, a.valor-(a.reembolso?a.reembolso.valor:0)),0);
  const enviados=A.reduce((s,a)=>s+(a.reembolso?a.reembolso.valor:0),0);
  return head+`
    <div class="stats" style="margin:10px 0 4px">
      <div><div class="stat__n">${pagos.length}/${A.length}</div><div class="stat__l">mensalidades pagas</div></div>
      <div><div class="stat__n">${brl(pagos.reduce((s,a)=>s+a.mensalidade.valor,0))}</div><div class="stat__l">recebido</div></div>
      <div><div class="stat__n">${brl(devolver)}</div><div class="stat__l">a devolver</div></div>
      <div><div class="stat__n">${brl(enviados)}</div><div class="stat__l">já devolvido</div></div>
    </div>
    <p class="hist__d">Regra: ${brl(C.valor_mensal)} por mês · devolve até ${Math.round(C.pct_reembolso*100)}% (${brl(C.valor_mensal*C.pct_reembolso)}) · proporcional a ${C.meta_mensal} provas aprovadas · ${brl(C.valor_mensal*C.pct_reembolso/C.meta_mensal)} por prova.</p>
    <div class="paylist">${A.map(a=>{
      const pago=a.reembolso, dif=Math.max(0, a.valor-(pago?pago.valor:0));
      return `<div class="payrow">
        <div class="payrow__h"><b>${esc(a.nome||a.email)}</b><small>${esc(a.email)}</small></div>
        <div class="payrow__g">
          <span><small>Mensalidade</small>${a.mensalidade?`<b class="ok">✓ paga</b>`:`<b class="no">pendente</b>`}
            <button class="mini" data-paymens="${a.aluno_id}" data-on="${a.mensalidade?0:1}">${a.mensalidade?'desfazer':'Registrar Pix recebido'}</button></span>
          <span><small>Provas</small><b>${Math.min(a.aprovadas,a.meta)}/${a.meta}</b>${a.aprovadas>a.meta?` <small>(+${a.aprovadas-a.meta})</small>`:''}</span>
          <span><small>Devolver</small><b>${brl(a.valor)}</b></span>
          <span><small>Chave Pix</small>${a.chave_pix?`<b>${esc(a.chave_pix)}</b> <button class="mini" data-copy="${esc(a.chave_pix)}">copiar</button>`:'<b class="no">não cadastrou</b>'}</span>
        </div>
        ${pago?`<p class="payrow__ok">✓ Pix enviado: ${brl(pago.valor)} em ${new Date(pago.pago_em).toLocaleDateString('pt-BR')}${pago.comprovante?' · '+esc(pago.comprovante):''}${dif>0.004?` · <b>diferença de ${brl(dif)} a pagar</b>`:''}</p>`:''}
        ${a.mensalidade && a.valor>0 && (!pago || dif>0.004) ? `<div class="compose__row" style="margin-top:8px">
            <input class="field" data-comp="${a.aluno_id}" placeholder="ID do Pix / comprovante (opcional)">
            <button class="btn" data-paypix="${a.aluno_id}">Marcar ${brl(pago?dif:a.valor)} como enviado</button></div>`:''}
      </div>`; }).join('')}</div>
    <details class="ex" style="margin-top:16px"><summary>Alterar regra (valor, % de reembolso, meta de provas)</summary>
      <div class="compose__row" style="margin-top:10px">
        <input class="field" id="cfg-val" value="${C.valor_mensal}" inputmode="decimal" aria-label="Mensalidade">
        <input class="field" id="cfg-pct" value="${Math.round(C.pct_reembolso*100)}" inputmode="numeric" aria-label="Percentual de reembolso">
        <input class="field" id="cfg-meta" value="${C.meta_mensal}" inputmode="numeric" aria-label="Meta de provas no mês">
        <button class="btn" data-cfgregra="1">Salvar regra</button></div>
      <p class="hist__d" style="margin-top:6px">Mensalidade (R$) · % devolvido · provas para o reembolso máximo. Vale para os cálculos ainda não pagos.</p></details>
  </section>`;
}
const _profHTMLProva=profHTML;
profHTML=function(){ const h=_profHTMLProva(); return cloud.prof && cloud.profData ? payHTML()+h : h; };

/* ---------- eventos ---------- */
document.addEventListener('input', e=>{
  const t=e.target; if(!t.dataset || !t.dataset.presp || !state.prova) return;
  state.prova.resp[t.dataset.presp]=t.value; guardarResp();
  const b=document.querySelector('[data-pnext]'); if(b) b.textContent=t.value.trim()?'Próxima':'Pular';
});
document.addEventListener('click', async e=>{
  const t=e.target.closest('[data-provaopen],[data-provago],[data-provax],[data-provafim],[data-pnext],[data-pprev],[data-pentregar],[data-popt],[data-sayslow],[data-pixsave],[data-paymes],[data-paymens],[data-paypix],[data-copy],[data-cfgregra]');
  if(!t) return; const d=t.dataset, P=state.prova;
  if(d.provaopen){ abrirProva(d.provaopen); return; }
  if(d.provago){ P.i=0; render(); window.scrollTo({top:0}); return; }
  if(d.provax){ if(P && P.i>=0 && !P.res && !P.err && !confirm('Sair da prova? Suas respostas ficam guardadas, mas o tempo continua contando.')) return;
    clearInterval(provaTick); state.prova=null; render(); window.scrollTo({top:0}); return; }
  if(d.provafim){ const ok=P.res.aprovado; state.prova=null; if(ok){ state.triOpen=false; state.triPat=null; state.triKit=null; } render(); window.scrollTo({top:0}); return; }
  if(d.pnext){ P.i=Math.min(P.perguntas.length-1, P.i+1); render(); window.scrollTo({top:0}); const i=document.querySelector('.pq__in'); if(i) i.focus(); return; }
  if(d.pprev){ P.i=Math.max(0,P.i-1); render(); return; }
  if(d.pentregar){
    const vazias=P.perguntas.filter(x=>!(P.resp[x.id]||'').trim()).length;
    if(vazias && !confirm(`Você deixou ${vazias} pergunta${vazias>1?'s':''} em branco. Entregar assim mesmo?`)) return;
    entregarProva(); return; }
  if(d.popt){ P.resp[d.popt]=d.val; guardarResp(); document.querySelectorAll(`[data-popt="${d.popt}"]`).forEach(b=>b.setAttribute('aria-pressed', b===t));
    const b=document.querySelector('[data-pnext]'); if(b) b.textContent='Próxima'; return; }
  if(d.sayslow){ say(d.sayslow,0.65,null); return; }
  if(d.pixsave){
    const v=(document.getElementById('pix-in').value||'').replace(/\D/g,''), msg=document.getElementById('pix-msg');
    if(!cpfValido(v)){ msg.textContent='CPF inválido. Confira os números.'; msg.style.color='var(--alert-d)'; return; }
    const r=await cloud.sb.from('alunos').update({ chave_pix:v }).eq('id',cloud.user.id);
    if(r.error){ msg.textContent=traduzErro(r.error); return; }
    cloud.aluno.chave_pix=v; msg.style.color=''; msg.textContent='✓ Chave Pix salva.'; toast('Chave Pix salva'); return; }
  if(d.paymes){ carregarPay(d.paymes); return; }
  if(d.paymens){ const r=await cloud.sb.rpc('registrar_mensalidade',{ p_aluno:d.paymens, p_mes:cloud.pay.mes, p_pago:d.on==='1' });
    if(r.error) toast(traduzErro(r.error)); carregarPay(cloud.pay.mes); return; }
  if(d.paypix){ const c=document.querySelector(`[data-comp="${d.paypix}"]`);
    if(!confirm('Confirma que você já enviou o Pix para este aluno?')) return;
    const r=await cloud.sb.rpc('marcar_reembolso',{ p_aluno:d.paypix, p_mes:cloud.pay.mes, p_comprovante:c?c.value:'' });
    if(r.error) toast(traduzErro(r.error)); else toast('Reembolso registrado'); carregarPay(cloud.pay.mes); return; }
  if(d.copy){ try{ await navigator.clipboard.writeText(d.copy); toast('Chave copiada'); }catch(err){ toast(d.copy); } return; }
  if(d.cfgregra){ const v=parseFloat(String(document.getElementById('cfg-val').value).replace(',','.')), p=parseFloat(document.getElementById('cfg-pct').value)/100, m=parseInt(document.getElementById('cfg-meta').value,10);
    const r=await cloud.sb.rpc('salvar_config',{ p_valor:v, p_pct:p, p_meta:m }); if(r.error) toast(traduzErro(r.error)); else toast('Regra salva'); carregarMes(); carregarPay(cloud.pay.mes); return; }
});
/* tocar num nó com a prática feita abre a prova direto */
document.addEventListener('click', e=>{
  const n=e.target.closest('[data-tnpat],[data-tnkit]'); if(!n || state.mode!=='tri') return;
  const id=n.dataset.tnpat ? 'pat:'+n.dataset.tnpat : 'kit:'+n.dataset.tnkit;
  if(praticaOk(id) && !aprovSet().has(id)){ e.stopImmediatePropagation(); e.preventDefault(); abrirProva(id); }
}, true);
const _helpIdReemb=helpId;
helpId=function(){ if(state.mode==='conta' && cloud.user) return 'reembolso'; return _helpIdReemb(); };

/* ---------------- início ---------------- */
(async()=>{
  await load();
  applyShields(); checkStreak();
  setModeBtn(state.mode); render();
  checkBadges();
  cloudInit();
})();

</script>
